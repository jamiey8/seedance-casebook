eels spontaneous."]],"points":[],"media":[{"token":"CvNTbqoU1oVzEXxWKp9cv0BKnrg","kind":"image","caption":["车站口型测试使用的人物参考。","Character reference for the station lip-sync test."],"source":"https://feishu.cn/file/CvNTbqoU1oVzEXxWKp9cv0BKnrg"},{"token":"Ma7sbHVJGoNAEfxf9hscXiOunCb","kind":"video","caption":["购物清单与进站列车同时发生的口型测试。","Lip-sync test with a shopping list and an arriving train."],"source":""}]},{"id":"replace","layout":"parallel","eyebrow":["商业测试 02–03","Commercial tests 02–03"],"title":["在相同的街景和光线里，换一个人或一件产品","Replace a person or product inside an existing shot"],"summary":["广告测试把允许变化的对象缩小，才容易看见其余画面有没有被带动。","The commercial tests narrow the allowed change so that unintended shifts are easier to see."],"paragraphs":[["街头测试先给出读地图的原始人物，再替换为目标女性。机位、人物所站的位置、街景和音乐沿用原片。团队还把同一要求放进楼梯上的多人动作和快速甩镜，观察目标人物经过移动和遮挡后还能否保持身份。","The street test begins with a man reading a map and replaces him with a woman. Camera position, blocking, streetscape and music are meant to remain as filmed. A second test repeats the task with several people on stairs and a whip pan, making identity harder to retain through movement and occlusion."],["产品测试使用虚构品牌 XAIA。白瓶 Serenity Sands 换成绿瓶 Lime Zest Bliss，分别放在浴室台面和橄榄枝场景。把同一目标瓶放进两条原片，可以分别核对瓶身、光线和环境，避免把新布景误当成产品替换的成果。","The fictional XAIA brand provides a product test. A white Serenity Sands bottle is replaced with green Lime Zest Bliss in two settings, a bathroom counter and an olive-branch arrangement. Using the same target in both plates lets reviewers check the bottle, lighting and surroundings independently."]],"points":[],"media":[{"token":"LTugb3GXXoAmumxTsf7clFbxnoh","kind":"video","caption":["人物替换原片，伦敦街头读地图。","Original plate for the London street character swap."],"source":""},{"token":"PuGWbW47TomvLExAeV1cyzPInvc","kind":"video","caption":["Seedance 2.5 人物替换结果，与街头原片对读。","Seedance 2.5 character swap for comparison with the street plate."],"source":""},{"token":"F3UObNZ4noVwulxXa0ockw5HnAd","kind":"video","caption":["虚构品牌 XAIA 浴室台面镜头的产品替换结果。","Product replacement on the bathroom counter for the fictional XAIA brand."],"source":""}]}],"takeaways":[{"title":["给动作一个准确的终点","Give an action a precise endpoint"],"body":["“快要碰到狗”和“碰到狗”会讲出两部不同的电影。把边界写进镜头。","A foot that almost touches the dog tells a different story from one that does. Write that limit into the shot."]},{"title":["替换时保留对照","Keep the original plate for comparison"],"body":["保留原片和目标参考，并排检查产品外形、机位和环境是否各自按要求变化。","Keep the plate and the target reference. Compare the product, camera and surroundings against their separate requirements."]}],"sources":[{"title":["深度案例｜DidiOK：从《Candy》镜头叙事到广告素材的可控生成【✅可对外】","Full case study on Feishu"],"url":"https://bytedance.larkoffice.com/docx/KgJRdmq1doh8cBxhbnnca4PAnKd","type":"feishu"}],"questions":[],"evidence":["飞书原文四个镜头、第 14 页海滨片段单独说明、三组商业测试；成片、模型对照和虚构品牌样例已按原文标注。"]},"brandtech":{"key":"brandtech","overview":["Brandtech 将 Seedance 放进品牌广告的创意验证和制作迭代：先确定品牌要讲什么，再用动态影像比较方向、吸收反馈。","Brandtech uses Seedance to test and iterate brand advertising: establish the brand story first, then compare creative directions through moving images and feedback."],"intro":["这不是一支影片的单线拆解。案例从 Brandtech 的实时创意方法出发，连接 NetApp 的快速制作、Maker’s Mark 的前后对照，以及拍摄前的多方向实验，讨论速度怎样转化为更好的品牌判断。","This case examines a working method across several examples. Brandtech’s Real-Time Creativity connects rapid production for NetApp, a Maker’s Mark comparison and pre-shoot experiments to ask how faster image-making can improve brand decisions."],"metrics":[{"value":"8 / 10","label":["服务全球前十大广告主中的八家","Eight of the ten largest advertisers served"],"note":["Brandtech 组织背景，按案例材料披露口径。","Brandtech company context as reported in the case material."],"source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae"},{"value":"10,000","label":["Pencil 已服务品牌数（约）","Brands served by Pencil, approximately"],"note":["Pencil 平台累计覆盖的品牌规模，按案例材料口径。","Cumulative brand coverage of the Pencil platform as reported in the source."],"source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae"},{"value":"10M","label":["Pencil 累计生成广告","Ads generated by Pencil"],"note":["案例材料披露的累计平台数据。","Cumulative platform figure reported in the source."],"source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae"},{"value":"< 1","label":["Unleash Genius 制作周期（周）","Unleash Genius production time (weeks)"],"note":["现场纪要口径；材料对照为约九个月的类似传统制作。","Reported in session notes; the source compares this with roughly nine months for a comparable conventional production."],"source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae"}],"sections":[{"id":"brandtech-context","eyebrow":["1 · 品牌与团队","1 · Brand and team"],"title":["把技术放进品牌内容生产。","Technology inside brand content production."],"summary":["从组织和平台背景，理解这次分享讨论的制作规模。","The company and platform context explains the scale behind this discussion."],"paragraphs":[["Brandtech 成立于 2015 年，总部位于纽约，以技术重构品牌营销与内容生产。材料介绍，其客户包括全球前十大广告主中的八家、前百大中的六十家。","Founded in 2015 and headquartered in New York, Brandtech applies technology to brand marketing and content production. The source says its clients include eight of the ten largest advertisers and sixty of the largest hundred."],["其生成式广告平台 Pencil 从 2018 年开始建设。案例的讨论重点并非单纯提高视频产量，而是把品牌、创作者与生成工具放进同一个决策过程。","Its generative advertising platform Pencil has been in development since 2018. The discussion goes beyond increasing output to consider how brands, creators and generative tools can share one decision-making process."]],"layout":"wide","points":[],"media":[{"token":"P0ADb7yekoHsCzxkWmgcoIOsnDh","kind":"video","caption":["Brandtech 对实时创意与 Seedance 应用的介绍。","Brandtech introduces Real-Time Creativity and its use of Seedance."],"source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae"}]},{"id":"brand-talent-creativity","eyebrow":["2 · 创作判断","2 · Creative judgement"],"title":["画面更容易获得，判断更需要清楚。","As image-making gets easier, judgement matters more."],"summary":["Brandtech 把品牌、人才和创意列为生成式生产中的三个核心变量。","Brandtech identifies brand, talent and creativity as three central factors in generative production."],"paragraphs":[["当生成工具能够快速产出视觉完整的画面，品牌仍需明确角色、语气和视觉语言的边界。内容数量增加，并不会自动形成一致的品牌身份。","When generation tools can quickly deliver polished images, a brand still needs clear boundaries for its characters, tone and visual language. More content does not automatically produce a coherent identity."],["材料中的影片竞赛观察进一步强调：操作门槛下降，并没有消除创作者之间的差距。叙事能力、视觉判断和对品牌的理解，仍然决定哪些画面值得进入作品。","The source’s observations from a generative-film competition make a related point: easier access does not remove differences between creators. Narrative skill, visual judgement and brand understanding still determine which images belong in a finished work."]],"layout":"parallel","points":[{"title":["品牌","Brand"],"body":["先明确什么属于自己，再决定哪些生成结果可以采用。","Define what belongs to the brand before choosing which generated outputs to use."]},{"title":["人才","Talent"],"body":["提示词和模型操作可以学习，创作方向与叙事判断仍需要经验。","Prompting and model operation can be learned; creative direction and narrative judgement still require experience."]},{"title":["创意","Creativity"],"body":["降低实现成本后，更需要检验概念本身，而非只看画面完成度。","As execution becomes less expensive, assess the concept itself rather than judging only visual polish."]}],"media":[]},{"id":"real-time-creativity","eyebrow":["3 · 工作方法","3 · Working method"],"title":["缩短的是完整的反馈循环。","Shorten the entire feedback loop."],"summary":["RTC，即 Real-Time Creativity，把提出想法、看到影像、获得反馈和继续修改连接起来。","Real-Time Creativity, or RTC, connects proposing an idea, seeing it on screen, gathering feedback and revising it."],"paragraphs":[["传统提案依赖脚本、分镜和情绪板，参与者需要在脑中补全影片。Seedance 让更多方向提前进入动态阶段，使镜头运动、表演、氛围和节奏成为可以直接比较的对象。","Conventional pitches rely on scripts, storyboards and mood boards, leaving participants to imagine the final film. Seedance moves more directions into motion early, making camera movement, performance, atmosphere and rhythm directly comparable."],["这种速度的价值，在于给项目保留修改的余地。团队可以更晚地吸收文化信号和市场变化，在正式制作或投放前，用更具体的视觉证据做选择。","The value of speed is room to revise. Teams can incorporate cultural signals and market changes later, using more concrete visual evidence before committing to production or release."]],"layout":"steps","points":[{"title":["提出方向","Propose a direction"],"body":["将品牌观点与创意概念写成可以验证的影像假设。","Turn the brand idea and creative concept into a visual proposition that can be tested."]},{"title":["看见影片","See it in motion"],"body":["将静态设想推进为动态镜头，观察构图、动作和节奏。","Move a static concept into shots and inspect composition, action and rhythm."]},{"title":["比较与修改","Compare and revise"],"body":["根据反馈淘汰不成立的方向，继续完善值得制作的版本。","Use feedback to reject weak directions and refine the versions worth producing."]}],"media":[]},{"id":"unleash-genius","eyebrow":["4 · 制作示例","4 · Production example"],"title":["复杂场面，进入更短的制作周期。","Bring ambitious scenes into a shorter cycle."],"summary":["材料以 NetApp 的 Unleash Genius，说明实时创意如何扩展可实现的画面。","The source uses NetApp’s Unleash Genius to show how Real-Time Creativity expands what can be made."],"paragraphs":[["影片包含冰雪环境中的人物与动作、飞行及电影化场面。根据现场纪要，制作在不到一周内完成；材料将其与可能需要约九个月的类似传统制作进行对照。","The film includes people and action in snowbound environments, flight and cinematic set pieces. Session notes report completion in less than a week and compare it with a similar conventional production that might take roughly nine months."],["材料将这支影片作为生成式 AI 超级碗广告示例，强调复杂场景也能进入快速构思、生成与修改的循环。制作周期缩短后，品牌能够在正式投放前看到更多可比较的方向。","The source presents the film as a generative-AI Super Bowl advertising example, highlighting how ambitious scenes can enter a rapid cycle of ideation, generation and revision. A shorter cycle gives brands more directions to compare before release."]],"layout":"split","points":[],"media":[{"token":"","kind":"video","caption":["Unleash Genius：材料引用的影片。","Unleash Genius, the film linked in the source."],"source":"https://www.youtube.com/embed/CkNGp2WLxS8"}]},{"id":"makers-mark-comparison","eyebrow":["5 · 前后对照","5 · Side-by-side comparison"],"title":["沿用品牌创意，重新生成表达。","Keep the brand idea; regenerate its expression."],"summary":["Maker’s Mark 的官方影片与 Seedance 版本，构成一组可以直接观看的对照。","A Maker’s Mark commercial and a Seedance version form a direct visual comparison."],"paragraphs":[["官方影片 A Perfectly Unreasonable Whisky 已经建立了清晰的品牌世界：电影化摄影、手工质感，以及为品质付出看似不合理努力的核心精神。Seedance 版本沿用这套创意结构，重新生成对应场景与镜头。","The official film, A Perfectly Unreasonable Whisky, establishes a clear brand world through cinematic photography, a handcrafted sensibility and the idea of going to seemingly unreasonable lengths for quality. The Seedance version reuses that creative structure to generate corresponding scenes and shots."],["观看时可以把“品牌核心是否保留”与“画面如何重做”分开判断。前者关乎故事和语气，后者关乎镜头、美术与表演；生成能力扩大了表达方式，但并未替品牌重新决定故事。","Assess two questions separately: whether the brand’s core survives and how the images are remade. One concerns story and tone; the other concerns shots, design and performance. Generation expands the expression without deciding a new brand story on its own."]],"layout":"parallel","points":[],"media":[{"token":"XGugbNz91oRJd6xKrcCc6Lyrnac","kind":"video","caption":["官方广告：A Perfectly Unreasonable Whisky。","Official commercial: A Perfectly Unreasonable Whisky."],"source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae"},{"token":"X0bebtmfqoTZ3dxWSIpcVpsdnGb","kind":"video","caption":["沿用原创意结构的 Seedance 生成版本。","Seedance version based on the same creative structure."],"source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae"}]},{"id":"brand-judgement","eyebrow":["6 · 反向检验","6 · A counterexample"],"title":["能做出来，还需要值得发布。","Making a film is only part of deciding to release it."],"summary":["麦当劳荷兰的 AI 圣诞广告在材料中承担反例作用，讨论品牌语境与情感判断。","The source discusses McDonald’s Netherlands’ AI Christmas advert as a counterexample about brand context and emotional judgement."],"paragraphs":[["材料描述，这支广告以节日混乱和焦虑为主题，将麦当劳塑造成逃离圣诞压力的去处；成片因真实感、情绪和节日语境等问题受到批评，随后被品牌撤下。","The source describes an advert built around festive chaos and anxiety, presenting McDonald’s as a refuge from Christmas stress. It reports criticism of the film’s realism, emotional tone and seasonal context, followed by its withdrawal."],["这段讨论用于检验创意判断，不是 Seedance 制作效果的归因证据。与先确立品牌精神的 Maker’s Mark 对照，Brandtech 要强调的是：快速生成不能替代对品牌、情绪与发布价值的判断。","This discussion tests creative judgement; it does not establish Seedance’s role in that production. In contrast with the established brand idea behind Maker’s Mark, Brandtech’s point is that rapid generation cannot replace decisions about brand fit, emotion and whether a film should be released."]],"layout":"split","points":[],"media":[{"token":"","kind":"video","caption":["材料引用的反例：麦当劳荷兰 AI 圣诞广告。","Counterexample linked in the source: McDonald’s Netherlands’ AI Christmas advert."],"source":"https://www.youtube.com/embed/E-YwjXEVGo8"}]},{"id":"pre-shoot-experiments","eyebrow":["7 · 动态实验","7 · Experiments before the shoot"],"title":["把更多想法，带到拍摄之前。","Test more ideas before the shoot."],"summary":["黑白时尚群像、人物设定和超现实复制，让方向比较发生在高成本制作之前。","Black-and-white fashion ensembles, character variations and surreal duplication let teams compare ideas before expensive production begins."],"paragraphs":[["Brandtech 展示了多个不同风格的动态实验。团队可以在正式拍摄前，观察一个概念成为影片之后是否仍然成立，并将客户反馈落到可观看的镜头、氛围和节奏上。","Brandtech shows experiments in several visual styles. Before a formal shoot, a team can see whether an idea still works as a film and ground client feedback in visible shots, atmosphere and pacing."],["材料将这种关系概括为 Human Creativityᵃⁱ。创作者决定品牌观点、叙事方向和情感核心，Seedance 扩大可以实现的范围，并缩短从想法到影像的距离。","The source expresses the relationship as Human Creativityᵃⁱ. Creators decide the brand viewpoint, narrative direction and emotional core; Seedance expands the range of feasible images and shortens the path from an idea to a film."]],"layout":"parallel","points":[],"media":[{"token":"F22CbavuJoZvRWxUS3mcT5qynhf","kind":"video","caption":["创意实验 1：材料中的 25.1 片段。","Creative experiment 1: source clip 25.1."],"source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae"},{"token":"CYA2bcfqHoI0wDxmCH7clph5nOg","kind":"video","caption":["创意实验 2：材料中的 25.2 片段。","Creative experiment 2: source clip 25.2."],"source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae"},{"token":"JosXbCWv3oSIopxGI8AcHusznpf","kind":"video","caption":["创意实验 3：材料中的 25.3 片段。","Creative experiment 3: source clip 25.3."],"source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae"},{"token":"Zafsbbsy5oOwS9xIfcKcK79bncY","kind":"video","caption":["创意实验 4：材料中的 25.4 片段。","Creative experiment 4: source clip 25.4."],"source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae"},{"token":"Zt9kbF5FIoNJ0Bx5NKkctq2onRb","kind":"image","caption":["材料总结：工具扩大创作者能够抵达的范围。","Source summary: tools expand the places a creator can reach."],"source":"https://feishu.cn/file/Zt9kbF5FIoNJ0Bx5NKkctq2onRb"},{"token":"WIS4bwZpfohAF1xflQ8cZ01Mndh","kind":"image","caption":["材料总结：品牌故事是持续扩展表达的基础。","Source summary: a brand story provides the basis for expanding expression."],"source":"https://feishu.cn/file/WIS4bwZpfohAF1xflQ8cZ01Mndh"}]}],"takeaways":[{"title":["先给生成建立品牌边界","Set brand boundaries before generating"],"body":["角色、语气与视觉语言需要服从同一个核心故事。","Characters, tone and visual language need to serve one core story."]},{"title":["用动态证据推进讨论","Discuss ideas through moving evidence"],"body":["将方向比较提前到拍摄之前，看清镜头、表演和节奏是否成立。","Compare directions before the shoot and assess whether shots, performances and rhythm work."]},{"title":["让速度服务于判断","Make speed serve judgement"],"body":["实时迭代扩大试验空间，但作品是否值得发布仍由人决定。","Real-time iteration creates room for experiments; people still decide what deserves release."]}],"sources":[{"title":["深度案例｜Brandtech × Seedance 让品牌故事走得更远：故事尚未落幕，创意已经启程【🔒 仅内部】","Brandtech: Where Brand Stories Go Next | Seedance × Advertising — Internal Only"],"url":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae","type":"feishu"},{"title":["Brandtech 英文案例原文","Brandtech source case in English"],"url":"https://bytedance.larkoffice.com/wiki/W28kwWZsLicu9dkYLRCc8rLOnzg","type":"feishu"},{"title":["Unleash Genius｜材料引用影片","Unleash Genius | Film linked in the source"],"url":"https://www.youtube.com/embed/CkNGp2WLxS8","type":"film"}],"questions":["NetApp 的制作周期来自现场纪要，材料没有提供可独立核验的完整制作排期。","四个创意实验的片段名称为 25.1 至 25.4，源文未逐一给出品牌、片名或投放信息。","麦当劳反例未在材料中说明由 Seedance 制作，因此不作为 Seedance 成片或性能指标。"],"evidence":["全文依据 assets/source-audit/brandtech.json 中成功读取的原文 content 重组；标题和内部属性均来自该原文。","平台规模、客户覆盖与不到一周制作周期均保留材料口径；平台累计数据与单片效果分开表述。","Maker’s Mark 原片及生成版 token 直接对应原文并列视频；四个创意实验、两张总结图 token 均逐项取自原文。","中文为依据原文整理的呈现文案；英文是对应翻译，并非另行引入事实。"]},"buwen":{"key":"buwen","overview":["《不问凡尘》是朝夕光年基于自研 Realm 引擎与 Seedance 构建的超写实修仙互动游戏。它把生成的视频切片接入状态机，将角色、战斗、剧情和环境组织成可以响应玩家操作的内容。","Buwen Fanchen is a photoreal xianxia interactive game built by Nuverse using its Realm engine and Seedance. Generated video slices feed into a state machine, connecting characters, combat, narrative and environments with player input."],"intro":["案例的核心是视频资产如何成为游戏内容：Seedance 2.0 / 2.5 生成视觉与动态演出，运行时引擎决定切片怎样播放和衔接，二三维合成处理战斗中的图层、光影与空间关系，Character 模型支持角色的记忆和反馈。","The case examines how video assets become playable content. Seedance 2.0 and 2.5 generate visuals and performances; the runtime engine controls playback and transitions; combined 2D and 3D compositing handles layers, light and spatial relationships; a Character model supports memory and responses."],"metrics":[{"value":"9","label":["端到端开发周期（月）","End-to-end development time, months"],"note":["项目材料披露的开发周期。","Development timeline reported in the project material."],"source":"https://bytedance.larkoffice.com/wiki/Aw2OwfbgGirOrukuw50cFUYxnWf"},{"value":"30h","label":["游戏游玩时长","Gameplay duration"],"note":["材料约记为十一万秒。","The source rounds this to approximately 110,000 seconds."],"source":"https://bytedance.larkoffice.com/wiki/Aw2OwfbgGirOrukuw50cFUYxnWf"},{"value":"70K","label":["游玩内容中的 Seedance 视频（秒）","Seedance video in playable content, seconds"],"note":["材料记录约七万秒，区别于包含预演的全部生成素材。","Approximately 70,000 seconds reported in playable content, distinct from all generated material including previs."],"source":"https://bytedance.larkoffice.com/wiki/Aw2OwfbgGirOrukuw50cFUYxnWf"},{"value":"20%","label":["AI 成本占比（材料口径）","AI cost share reported in the source"],"note":["正文按总成本约五分之一表述，列举发行、薪资与服务器等项目。","The body reports roughly one fifth of total costs and mentions publishing, salaries and servers in the overall cost scope."],"source":"https://bytedance.larkoffice.com/wiki/Aw2OwfbgGirOrukuw50cFUYxnWf"}],"sections":[{"id":"buwen-project","eyebrow":["1 · 作品与定位","1 · Project and concept"],"title":["让修仙影像，可以被操作。","Make a xianxia film world playable."],"summary":["从角色待机到战斗和剧情，视频成为游戏的内容资产。","From idle characters to combat and narrative, video becomes a game asset."],"paragraphs":[["《不问凡尘》内部代号 A1，项目将自身定位为“可以玩的修仙影视”。影视级视听、修仙养成与动态交互，被放进同一个体验目标。","Internally codenamed A1, Buwen Fanchen is positioned by its team as a playable xianxia screen experience. Cinematic audiovisuals, character development and dynamic interaction contribute to the same experience."],["在材料描述的管线中，Seedance 2.0 / 2.5 负责批量生成角色待机、NPC 交互、技能、过场和环境动态。自研 Realm 引擎再把这些资产接入游戏运行逻辑。","In the described pipeline, Seedance 2.0 and 2.5 batch-generate character idles, NPC interactions, skills, cutscenes and environmental movement. The team’s Realm engine connects those assets to game logic."]],"layout":"wide","points":[],"media":[{"kind":"video","token":"","localPath":"assets/article-media/buwen/official-trailer-excerpt.mp4","caption":["官方游戏预告节选，5.6 秒。","Official game trailer excerpt, 5.6 seconds."],"source":"https://store.steampowered.com/app/4209920/"},{"token":"WUxObVUfnoMiAVxVhQLcm1a7nSh","kind":"video","caption":["《不问凡尘》项目展示影片。","Buwen Fanchen project showcase."],"source":"https://bytedance.larkoffice.com/wiki/Aw2OwfbgGirOrukuw50cFUYxnWf"}]},{"id":"video-state-machine","eyebrow":["2 · 资产与状态机","2 · Assets and state machines"],"title":["把离散视频，接入连续操作。","Connect separate clips with continuous play."],"summary":["高质量 MP4 / MOV 资产，通过引擎逻辑对应玩家输入和角色状态。","High-quality MP4 and MOV assets are connected to player input and character states through engine logic."],"paragraphs":[["生成结果先作为离散视频切片存在。团队构建专属的视频驱动与状态机系统，将这些切片嵌入运行逻辑，使待机、互动、技能和剧情可以按状态调用。","Generated outputs first exist as separate video slices. The team builds video-driving logic and state machines so that idle, interaction, skill and narrative clips can be called according to state."],["材料将这种使用方式类比为把视频像骨骼动画一样嵌入游戏：玩家操作和 QTE 触发逻辑响应，引擎组织对应视频流。预生成视觉资产与运行时控制，在这里承担不同工作。","The source likens the approach to embedding video as if it were skeletal animation. Player actions and QTE events trigger logic responses, and the engine organises the corresponding video stream. Pre-generated visuals and runtime control have distinct roles."]],"layout":"steps","points":[{"title":["生成资产","Generate assets"],"body":["批量准备角色、技能、过场和环境等切片。","Prepare batches of character, skill, cutscene and environment clips."]},{"title":["组织状态","Organise states"],"body":["在自研引擎中建立视频调用与状态切换关系。","Define video selection and state changes within the engine."]},{"title":["响应输入","Respond to input"],"body":["把玩家操作和 QTE 与视觉反馈连接起来。","Connect player actions and QTE events with visual responses."]}],"media":[]},{"id":"layers-and-space","eyebrow":["3 · 二三维合成","3 · 2D and 3D compositing"],"title":["拆开图层，再把空间合起来。","Separate the layers, then rebuild spatial relationships."],"summary":["人物、特效、前景与背景分别处理，与三维渲染和光影在同一时间轴上协同。","Characters, effects, foregrounds and backgrounds are handled separately and coordinated with 3D rendering and light on one timeline."],"paragraphs":[["为处理二维视频与三维动态交互的关系，团队在战斗等玩法中使用二三维实时合成。Seedance 视频被分解为人物、特效、前景和背景等独立图层，而非作为一张不可拆分的平面直接覆盖。","To connect 2D video with 3D interaction, the team uses real-time 2D/3D compositing in areas such as combat. Seedance video is separated into characters, effects, foregrounds and backgrounds rather than treated as one indivisible surface."],["这些层在同一时间轴上结合空间渲染与光影合成，让有限视角内的人物微表情和影视效果，与打击碰撞及纵深感相互配合。作者在评论中补充，图层分离使用自研算法，正文未进一步展开实现细节。","On a shared timeline, the layers combine with spatial rendering and lighting so that expressions and cinematic effects can work with impacts and depth within a constrained viewpoint. The author adds in a comment that layer separation uses an in-house algorithm; implementation details are not developed in the body."]],"layout":"parallel","points":[{"title":["图层分离","Separate layers"],"body":["将人物、特效和环境拆开，形成可以分别组织的内容。","Separate characters, effects and environment into independently organised elements."]},{"title":["时序协同","Coordinate timing"],"body":["让生成切片、三维空间与光照在同一时间轴上对齐。","Align generated slices, 3D space and lighting on one timeline."]},{"title":["空间反馈","Support spatial feedback"],"body":["在有限视角中配合碰撞、打击与空间纵深。","Coordinate collision, impact and depth within the supported view."]}],"media":[]},{"id":"combat-and-qte","eyebrow":["4 · 动态演示","4 · Motion examples"],"title":["CG、技能与 QTE，承担不同的反馈。","CG, skills and QTE provide different kinds of feedback."],"summary":["材料按制作用途展示了从过场到操作反馈的多类视频。","The source groups videos by their production role, from cutscenes to interactive feedback."],"paragraphs":[["作品展示部分包含游戏 CG、战斗演示、技能演示和 QTE 对比。它们对应不同任务：建立世界和情绪，表现战斗与技能，以及展示玩家输入怎样触发画面。","The showcase includes game CG, combat and skill demos, and a QTE comparison. Their roles differ: establish the world and mood, present combat and abilities, and demonstrate how inputs trigger images."],["材料列举了“岩爆回天锤”“青元劲”和“共鸣合体技能”等片段。页面将这些视为具体内容示例，不把单段演示扩展为所有技能都已完成同样效果的结论。","The source lists examples including Yanbao Huitian Chui, Qingyuan Jin and a combined resonance skill. These are specific content examples rather than proof that every skill has the same implementation or result."]],"layout":"parallel","points":[{"title":["游戏 CG","Game CG"],"body":["组织剧情、环境与角色的电影化呈现。","Present narrative, environments and characters cinematically."]},{"title":["战斗与技能","Combat and skills"],"body":["将高表现力特效接入对应战斗场景。","Connect expressive effects with their combat contexts."]},{"title":["QTE 对比","QTE comparison"],"body":["展示操作时机与画面反馈之间的联系。","Show the relationship between action timing and visual feedback."]}],"media":[{"kind":"image","token":"","localPath":"assets/article-media/buwen/official-combat.webp","caption":["官方游戏截图，雪地战斗中的角色、敌人和技能界面。","Official game screenshot. The player, opponents and skill interface in a snowy encounter."],"source":"https://store.steampowered.com/app/4209920/"},{"token":"","kind":"image","caption":["《不问凡尘》修仙世界的视觉展示。","A visual presentation of the Buwen Fanchen xianxia world."],"source":"https://bytedance.larkoffice.com/wiki/Aw2OwfbgGirOrukuw50cFUYxnWf","localPath":"rotating-src/assets/buwen.jpg"}]},{"id":"character-assets","eyebrow":["5 · 人物与待机","5 · Characters and idle assets"],"title":["让角色在不同状态中，仍然是同一个人。","Keep a character recognisable across different states."],"summary":["面部、服装、发丝与光影参考，服务于角色资产的一致性。","Face, costume, hair and light references support consistent character assets."],"paragraphs":[["材料将多模态参考、跨帧一致性与微表情控制作为人物塑造的基础。目标是在不同片段中保留角色的面部特征、服装和发丝光影，使人物与 NPC 更好地属于同一套美术世界。","The source identifies multimodal references, cross-frame consistency and expression control as foundations for character creation. The aim is to preserve facial features, costume, hair and light across clips so that characters and NPCs share one visual world."],["演示包含纪知澜的待机素材，以及村长在熟悉、陌生等状态下的片段。此类素材既承担人物表演，也为状态机提供可以调用的视觉反馈。","The examples include Ji Zhilan’s idle material and clips of the village chief in familiar and unfamiliar states. Such assets provide performance as well as visual responses that the state machine can call."]],"layout":"split","points":[],"media":[]},{"id":"character-interaction","eyebrow":["6 · 角色交互","6 · Character interaction"],"title":["语言、记忆和动作，一起参与反馈。","Let language, memory and action shape a response."],"summary":["Character 模型负责角色状态理解、个性化记忆与情感驱动。","A Character model supports state understanding, personalised memory and emotional responses."],"paragraphs":[["除视觉生成外，项目还使用 Character 模型理解游戏角色状态，并结合个性化记忆与情感驱动，协同对话和动作的时序。","Alongside visual generation, a Character model interprets character states and uses personalised memory and emotional drivers to coordinate the timing of dialogue and action."],["材料描述，角色可以根据玩家的语言、行为和阵营选择作出反馈，关系从陌生、相知发展到更多阶段。这一层处理角色如何回应，视频资产与引擎则承担回应如何被看见和播放。","The source describes characters responding to a player’s language, behaviour and faction choices, with relationships developing from unfamiliarity to greater closeness. This layer shapes the response, while video assets and the engine determine how that response is seen and played."]],"layout":"steps","points":[{"title":["状态理解","State understanding"],"body":["结合游戏角色所处状态决定反馈。","Use the character’s current game state when shaping feedback."]},{"title":["记忆与关系","Memory and relationships"],"body":["让互动保留个性化记忆与关系变化。","Carry personalised memory and relationship changes across interactions."]},{"title":["对话与动作","Dialogue and action"],"body":["将语言反馈与动作的时间关系协调起来。","Coordinate the timing of spoken responses and actions."]}],"media":[{"kind":"image","token":"","localPath":"assets/article-media/buwen/official-dialogue.webp","caption":["官方游戏截图，和村民对话时，玩家可以选择不同答复。","Official game screenshot. Dialogue options appear during a conversation with a villager."],"source":"https://store.steampowered.com/app/4209920/"}]},{"id":"buwen-scale-and-cost","eyebrow":["7 · 生产规模","7 · Production scale"],"title":["区分素材规模、游玩时长与成本口径。","Distinguish asset volume, playable time and cost."],"summary":["项目数据来自内部材料，预演与成品素材、实际与计划分别呈现。","The internal material separates previs from finished content and current figures from plans."],"paragraphs":[["材料记录，项目制作约一百二十万至一百六十万秒素材，范围包含预演到成品。游戏游玩时长约三十小时，其中 Seedance 内容约七万秒；这两组数字描述不同范围，不能直接互换。","The material reports approximately 1.2–1.6 million seconds of assets, including previs through to finished work. Gameplay lasts about thirty hours, with roughly 70,000 seconds of Seedance content. These figures describe different scopes."],["项目材料给出九个月的端到端开发周期。AI 成本约占总成本五分之一；正文还提到发行、薪资和服务器等总成本项目，并另记 Seedance 单项支出。页面没有由此计算传统制作的节省比例。","The project reports nine months of end-to-end development and an AI cost share of approximately one fifth. The body mentions publishing, salaries and servers within the overall cost scope and separately records Seedance spending. No conventional-production savings percentage is calculated from these figures."],["原文将 AI 占比进一步提高到约三分之一，作为引入 Seedance 2.5 后的后续方向；A2、A3 等多品类项目的复用，也被列为管线沉淀的价值。这里将它们保留为计划和可复用方向。","The source presents a future AI share of around one third after deeper Seedance 2.5 adoption, and identifies reuse across later A2 and A3 projects as a pipeline benefit. These remain future directions rather than completed outcomes."],["材料还以“抽卡率”记录从早期二十以上到当前八以内的变化，但没有详列统一统计方法。该观察可用于理解迭代负担，不能据此推导通用的模型成功率。","The source records a change in what it calls the generation-attempt rate, from more than twenty early on to eight or fewer later, without defining a uniform measurement method. It describes iteration burden rather than a general model success rate."]],"layout":"parallel","points":[{"title":["120–160 万秒","1.2–1.6 million seconds"],"body":["从预演到成品的素材规模。","Asset volume including previs through finished work."]},{"title":["约 20%","Approximately 20%"],"body":["当前材料披露的 AI 成本占比。","Current AI cost share reported in the source."]},{"title":["约 33% · 后续方向","Approximately 33% · future direction"],"body":["材料所述的进一步引入 Seedance 2.5 后的目标口径。","A future target associated with deeper Seedance 2.5 adoption."]}],"media":[]}],"takeaways":[{"title":["视频成为可调用资产","Make video a callable asset"],"body":["先生成切片，再由状态机把资产与玩家操作连接。","Generate slices, then connect the assets to player input through state logic."]},{"title":["空间问题需要图层分工","Handle space through distinct layers"],"body":["把人物、特效和环境拆开，与三维光影及碰撞配合。","Separate character, effects and environment to work with 3D lighting and collision."]},{"title":["角色回应由多层协作","Coordinate the layers of a response"],"body":["Character 模型、视频资产与引擎，各自处理记忆、表演和播放。","The Character model, video assets and engine handle memory, performance and playback together."]}],"sources":[{"title":["深度案例｜《不问凡尘》首款全Seedance 制作开放世界互动游戏【🔒仅内部】","Buwen Fanchen: An Open-World Interactive Game Made with Seedance — Internal Only"],"url":"https://bytedance.larkoffice.com/wiki/Aw2OwfbgGirOrukuw50cFUYxnWf","type":"feishu"},{"title":["《不问凡尘》Steam 作品页","Buwen Fanchen on Steam"],"url":"https://store.steampowered.com/app/4209920/","type":"film"},{"title":["方舟 Gallery：项目展示","Ark Gallery project showcase"],"url":"https://ark.volcengine.com/region:cn-beijing/gallery/works?workId=work-20261015185925-r6jlb","type":"film"}],"questions":["图层分离算法仅在作者评论中说明为自研，具体实现与工程参数未在正文提供。","AI 成本正文以含发行、薪资、服务器等的总成本表述，表格另用开发预算；精确财务口径仍需制作方确认。","材料列出 Seedance 支出“220w 多”，未展开币种、计费范围及期间，因此没有单独转化为人民币预算指标。","“抽卡率”未给出统一分母或样本范围；约33%为后续计划，没有作为已完成数据。"],"evidence":["依据已登录浏览器读取的 /tmp/seed-buwen-source.txt 实际技术正文、演示标题、成本表格与作者回复整理，未采纳 AI 摘要。","自研 Realm 引擎、MP4/MOV 视频状态机、二三维图层与 Character 模型职责直接取自技术正文。","九个月、三十小时、七万秒和约20%均为材料披露；约33%严格保留为未来方向，未做传统3–5年对照的节省率。","展示影片 token WUxObVUfnoMiAVxVhQLcm1a7nSh 来自汇总文档 source-audit/master.json；localPath 指向既有真实案例封面。"]},"journey":{"key":"journey","overview":["芒果伯璟文化用《后西游记》的对照样片，逐项检查长镜头、多人站位、角色表演和复杂水面。","Mango Bojing used comparison clips from Later Journey to the West to examine long takes, blocking, character performance and difficult water effects."],"intro":["美术出身的制作团队该用哪张关键帧控制悟空？同样一个提示，生成时间变长，为什么坠落的角色有时反而向前飞？导演李东坤保留了不同版本的样片和逐条评语，让这篇案例可以一边看片，一边判断某个镜头究竟改善了什么。以下节选是制作测试，部分材料在访谈时尚未播出。","Which keyframe should an art-led team use for Wukong? Why can a character start flying forward in what was meant to be a longer fall? Director Li Dongkun retained different generations and shot-specific notes. Together they let us see which decisions improved a shot and which still needed work. These are production tests, some of which had yet to air when the interview was conducted."],"metrics":[{"value":"30 s","label":["样片中的连续时长","Continuous take in the tests"],"note":["见对照表第 3 组，不等同于整集镜头平均时长。","Comparison 3, a specific take length rather than an episode average."],"source":"https://bytedance.larkoffice.com/wiki/PsMvwyLCBiaK3VkeQeTcujVOnmf"},{"value":"45 min","label":["成本估算中的单集时长","Episode duration used for the estimate"],"note":["伯璟团队给出的预算示例。","Production budget example supplied by the Bojing team."],"source":"https://bytedance.larkoffice.com/wiki/PsMvwyLCBiaK3VkeQeTcujVOnmf"},{"value":"~30%","label":["算力占制作成本","Compute share of production cost"],"note":["团队估算，同例总预算约人民币 90 万元。","Team estimate for the same roughly RMB 900,000 episode."],"source":"https://bytedance.larkoffice.com/wiki/PsMvwyLCBiaK3VkeQeTcujVOnmf"}],"sections":[{"id":"keyframe","layout":"wide","eyebrow":["导演工作","Directing"],"title":["先画出整场戏里不能走样的那一帧","Design the frame the scene cannot afford to lose"],"summary":["李东坤和伯璟文化把原来在片场做的部分调度判断，提前到了人物参考和关键帧。","Li Dongkun and the Bojing team moved some decisions about staging into character references and keyframe design."],"paragraphs":[["团队在大纲阶段就测试难拍的场面。先找一张画面，把人物、环境和空间关系安排到导演认可的位置；再让模型补出从这一状态出发的表演。测试结果也可能反过来改变剧本中的动作。","The team tested difficult scenes while the script was still an outline. It established a frame with characters, environment and depth arranged to the director’s satisfaction, then generated the performance starting from that state. A failed test could change the action in the script."],["关键帧有代价。对照表第 12 组里，导演认可大气透视让空间更深远，也指出有了固定首帧后，人物表演会变僵，运镜没有完全按要求走。单张漂亮画面和一段好表演需要分别验收。","A keyframe came at a cost. In comparison 12, the team credited atmospheric perspective with deepening the scene but found that a fixed first frame could stiffen the performance and constrain the wrong aspects of camera motion. The image and the performance needed separate reviews."]],"points":[],"media":[{"token":"EyPFbWVmqo4ZvcxT9IOcPBrrnZV","kind":"video","caption":["《后西游记》完整项目预告。","Later Journey to the West, complete project trailer."],"source":"https://bytedance.larkoffice.com/docx/OwTRdfb0Wohn7RxosEjcEJhhnZg#LyCbdp4PnokUwbx4Ov7c8tKBn3b"},{"token":"Hj5dbA3mVo39bMxj4UPc9M8Hn6g","kind":"video","caption":["对照 12-1，Seedance 2.5 的空间层次与首帧约束测试。","Comparison 12-1, a Seedance 2.5 test of depth and first-frame constraints."],"source":""}]},{"id":"performance","layout":"parallel","eyebrow":["角色表演","Character performance"],"title":["悟空离开花果山，动作还像猴子吗","Does Wukong still move like a monkey away from home?"],"summary":["导演发现，尾巴、场景和参考声音都会改变模型理解角色的方式。","The director observed that a tail, an unfamiliar setting and even a reference voice could alter how the model interpreted a character."],"paragraphs":[["猴子在树林里动作自然，到了天庭、换上古装，身体有时就像人套了猴子的外形。团队对照参考图后发现，保留尾巴有助于维持动物的动作逻辑。只给声音也有意外影响，熟悉的演员音色可能把人物的神态一起带进来。","The monkeys moved convincingly in woodland. At the celestial court, dressed in period costume, they could slip into human movement under a monkey-like appearance. The team found that keeping the tail in the reference helped preserve animal behaviour. It also saw a recognisable performer’s voice pull facial mannerisms into a character."],["导演把不同问题交给不同参考。面部细节交给清晰的人像，身体与表情可以对照真人实拍，语气和犹豫用预先录下的声音传达。最终上线的剧集计划由人工重新配音，测试音轨服务于当下的表演判断。","The director assigned a different reference to each problem. A close portrait supplied facial detail, live-action footage supplied gesture and expression, and a recording carried tone and hesitation. Human re-recording was planned for release. The test soundtrack served the performance review in the meantime."]],"points":[],"media":[{"token":"NFCJbS8q8onKxpxugWTc36xonB8","kind":"video","caption":["对照 6，猴群场景测试。团队记录了猴种、构图和人物碰撞的问题。","Comparison 6, a monkey-group test with notes on variety, composition and character interaction."],"source":""}]},{"id":"blocking","layout":"split","eyebrow":["空间调度","Blocking"],"title":["人物站对地方之后，还要演对","Correct blocking is only half the shot"],"summary":["在多人镜头中，空间可以先锁定，随后再单独检查动作和背景。","In a multi-character shot, spatial positions can be locked before reviewing performance and background."],"paragraphs":[["基础的正反打和站位用白模能快速讲清楚。遇上复杂距离，团队反而倾向于把人物设定图直接合进场景：人物占画面多少、前后有多远，都由导演当场决定。搭一个能操作的 3D 场景也有制作成本。","A simple grey model clarified positions and reverse angles. Where distance mattered more, the team preferred compositing character artwork directly into the scene. The director could set size in frame and separation by eye, without building a fully operable 3D setup."],["原表第 11 组给出了这种方法的边界。团队认为 2.5 的人物落点准确，光影更细腻，但动作没有按要求完成，人物设定图的背景也被带了进来。审片时应分别看位置、动作、背景三个结果。","Comparison 11 shows the limits of spatial control. The team found that 2.5 placed characters accurately and produced more nuanced light, while the acting still missed the brief and elements of the reference background leaked through. Position, gesture and background needed their own checks."]],"points":[],"media":[{"token":"QedLbUd4So42KrxxApucYAqznod","kind":"video","caption":["对照 11，多人位置、光线与表演控制测试。","Comparison 11, a test of character positions, lighting and performance."],"source":""}]},{"id":"duration","layout":"parallel","eyebrow":["片段对读","Reading the tests"],"title":["30 秒多出来的时间，给表演还是给黑场","Where do the extra seconds go?"],"summary":["同一份对照表里，有的长镜头少了一道接缝，有的却把问题留得更久。","The comparison sheet shows both what a longer take can hold together and what it can leave unresolved."],"paragraphs":[["第 3 组原先要拼两段 15 秒，换成一段 30 秒后，人物表演的起伏能够连起来。第 9 组的长镜头则出现了意料之外的撞岩壁细节，导演觉得沉浸感更好，却也看见明显的黑场，下坠中途变成了向前飞。","In comparison 3, two separate 15-second pieces previously needed a join. A single 30-second take let the performance sustain its rhythm. In comparison 9, an unexpected brush with the rock wall added immersion, but a stretch of black frames wasted time and the intended fall became forward flight."],["再看第 1 组，同样的提示让环境和动作细节更丰富，但景别仍容易收紧。对导演而言，镜头长短和景别是两项独立要求；更多细雪、天光或空间细节并不会自动得到所需的远景。","In comparison 1 the same prompt yielded richer environmental and movement detail, yet the framing still drifted tighter. Take length and shot size remained independent decisions. More convincing snow, sky or depth did not guarantee the requested wide view."]],"points":[],"media":[{"token":"Q54PbVd2WojpFVxrbj4cxRmpnEb","kind":"video","caption":["对照 3-3，以一次连续生成承接表演。","Comparison 3-3, a performance sustained in one continuous generation."],"source":""},{"token":"HyPRbeo1ro7ACexYlgUclkY4nJh","kind":"video","caption":["对照 9，观察下落方向、岩壁与黑场。","Comparison 9, with falling direction, rock surface and black frames to examine."],"source":""},{"token":"PY8dbbrgOoMq5ixDknXc4qDnnwg","kind":"video","caption":["对照 1，环境与动作细节改善，景别仍比预期更紧。","Comparison 1, stronger environmental and action detail with tighter framing than requested."],"source":""}]},{"id":"effects","layout":"parallel","eyebrow":["效果边界","Effects tests"],"title":["一滴水为什么停在镜头前","Why does a droplet stop in front of the lens?"],"summary":["水面质感、动作方向、镜头位置需要在时间上同时成立。","Surface texture, direction of travel and camera position all have to hold over time."],"paragraphs":[["第 4 组里，黑水的视觉质感得到认可，具体动作却没有达到预想。第 7 组和第 13 组又出现相似偏差。水中幻影缺少水面材质，水滴反复朝镜头垂直靠近，到镜头前便停住。另一些尝试甚至意外带出人脸。","The dark water in comparison 4 had a convincing surface, but its action did not meet the brief. Comparisons 7 and 13 exposed a recurring issue. A reflected apparition lacked the quality of water, and droplets repeatedly approached the lens head-on and stopped. Some attempts even introduced a face."],["这些样片适合把问题定位到一段运动，而非用一句“效果不好”带过。水面要保留什么反射？水滴从哪儿落下，又应经过哪里？团队的对比记录没有把复杂特效和运镜列为 2.5 已稳定解决的问题。","These clips locate the fault within a movement. What reflection must the surface retain? Where does the drop originate and where should it pass? The team’s comparison did not establish reliable control over complex effects or camera movement in 2.5."]],"points":[],"media":[{"token":"TnbZbaFzboCdqbxUHIGczZAFnjh","kind":"video","caption":["对照 4，黑水质感与动作要求。","Comparison 4, dark water texture and the intended action."],"source":""},{"token":"PWAAbZE08ot1z2xZJHAcRbCQnOh","kind":"video","caption":["对照 7，水滴运动与水面幻影测试。","Comparison 7, droplet motion and an apparition on water."],"source":""}]},{"id":"production","layout":"steps","eyebrow":["长剧生产","Series production"],"title":["以一个篇章为周期，从大纲推进到审片","Use each chapter as a production and review cycle"],"summary":["伯璟把长剧分成若干篇章，让剧本、制作与审核分段推进。","Bojing divided the series into chapters so that writing, production and review could advance in stages."],"paragraphs":[["导演和美术先按大纲试关键镜头，查出模型在这个场景的强项和难点，再细化剧本。各篇章可以滚动制作与审核，技术升级时也有机会在下一批镜头重新选择方法。对于面向观众的成片，导演更关心镜头语言是否成立。","Direction and art teams first tested essential shots from the outline. What the model handled well or poorly then informed the more detailed script. Chapters could move through production and review on a rolling basis, with a chance to reconsider technique when tools changed. For audience-facing work, the director prioritised whether the shots told the story."],["团队在交流中给出一个成本口径：45 分钟一集约 90 万元，算力约占三成，其余主要为人工。同期传统制作达到同等效果会贵多少，是团队判断；原文没有给出一组逐项核算的传统对照预算。","The team shared a specific budget example. A 45-minute episode was estimated at roughly RMB 900,000, with about 30% going to compute and most of the balance to people. Its assessment of an equivalent conventional production was an estimate. The source does not include a line-item comparison budget."]],"points":[{"title":["大纲阶段","At outline stage"],"body":["先试最难的运镜、动作与构图。","Try the most difficult camera move, action and composition first."]},{"title":["成片阶段","Before release"],"body":["保留审片与人工配音环节，再决定观众看到的版本。","Review the visual performance and complete human dubbing before deciding on the audience-facing version."]}],"media":[]}],"takeaways":[{"title":["拆开判断","Review separate decisions"],"body":["环境更真、人物站准和景别合适分别记录，一个成立时另外两个仍可能有问题。","Record environment, blocking and shot size separately. A convincing result in one can coexist with faults in the others."]},{"title":["依据问题选择参考","Match the reference to the problem"],"body":["用清晰人像约束脸，实拍动作约束身体，参考音频表达犹豫或语气。","Use a clear portrait for the face, filmed movement for the body and reference audio for hesitation or tone."]}],"sources":[{"title":["深度案例｜芒果伯璟文化 用Seedance讲好西游动画故事【🔒仅内部】","Full case study on Feishu"],"url":"https://bytedance.larkoffice.com/wiki/PsMvwyLCBiaK3VkeQeTcujVOnmf","type":"feishu"}],"questions":[],"evidence":["原文的 2.0/2.5 横向样片表，尤其第 1、3-3、4、6、7、9、11、12-1 组；导演访谈第 3、4 部分。"]},"seen":{"key":"seen","overview":["SEEN 把导演的决定带进三个不同的项目：吕克·贝松的动画长片《The Furious Five》、Gaumont 的历史汽车工厂视效研发，以及《法国好声音》的节目舞台演示。每次换场或换机位，都有已经确定的东西需要保留下来。","SEEN carries creative decisions across three projects: Luc Besson’s animated feature The Furious Five, historical factory R&D with Gaumont and a stage demonstration for The Voice France. Each change of scene or camera angle has to carry earlier decisions forward."],"intro":["一辆车驶进 Grand Rapids 小镇。俯拍能看清道路，切进车内时，我们又要认出坐在里面的人；随后一个驾驶员视角，还得让人相信车正沿着同一条街前进。这段不到一分钟的戏，是理解 SEEN 工作方法的入口。","A car arrives in Grand Rapids. An aerial shot establishes the road. Inside the car, we need to recognise the passengers. A driver’s-eye view must then convince us they are moving along the same street. The scene runs under a minute and offers a way into SEEN’s method."],"metrics":[{"value":"2,000+","label":["长片预计镜头数","Shots projected for the feature"],"note":["《The Furious Five》的项目规划规模。","The reported production target for The Furious Five."],"source":"https://bytedance.larkoffice.com/wiki/XlwUw4jGJiiNpfknnP8c5vy7nee"},{"value":"≈25","label":["长片核心团队人数","Core feature team"],"note":["原文所述的核心团队；未计为全部参与者。","The core team as reported in the case study."],"source":"https://bytedance.larkoffice.com/wiki/XlwUw4jGJiiNpfknnP8c5vy7nee"},{"value":"≈2","label":["工厂环境研发用时（周）","Weeks for the factory world build"],"note":["Gaumont 合作案例的环境搭建用时，和长片分属两个项目。","Reported for the Gaumont environment build, a separate project from the feature."],"source":"https://bytedance.larkoffice.com/wiki/XlwUw4jGJiiNpfknnP8c5vy7nee"}],"sections":[{"id":"feature","eyebrow":["项目与人物","The feature"],"title":["从导演熟悉的人物开始","Starting with a director’s characters"],"summary":["由吕克·贝松联合创立的 SEEN，把这套工作方式用于他执导的动画长片《The Furious Five》。","SEEN, co-founded by Luc Besson, applied this approach to the animated feature he directed, The Furious Five."],"paragraphs":[["原文配列了《第五元素》的 Leeloo、《超体》的 Lucy、《这个杀手不太冷》的 Mathilda 与 Léon，以及《尼基塔》的 Nikita 等角色参考。看动画人物还能认出这些参照，只解决了第一层问题。制作的难处在于让人物带着已经拍定的姿势、情绪和对白节奏走过一整场戏。","The study places the animated designs alongside references for Leeloo from The Fifth Element, Lucy, Mathilda and Léon from Léon: The Professional, and Nikita. A recognisable design solves one part of the problem. Production also needs that character to carry an established posture, emotion and rhythm of speech through an entire scene."],["SEEN 在项目中先记录导演对角色、摄影、美术和叙事的要求，再决定团队可以调整哪些内容。新加入的制作者因而能知道车里的乘客是谁、上一镜朝哪走，以及本镜是否可以改变环境。","SEEN records direction for character, cinematography, design and narrative, then identifies what the team can still change. A new artist can see who is in the car, where it was headed on the previous cut and whether the setting is open to revision."]],"layout":"wide","points":[],"media":[{"token":"AcZibsgY1olx1Qxib0nc7QRUnrf","kind":"video","caption":["内部项目《The Furious Five》预告片","Internal teaser for The Furious Five"],"source":""},{"token":"JDFubYCQWoECgOxbJEXcdayun5c","kind":"image","caption":["长片设定中的五名动画角色","Five animated character designs from the feature"],"source":"https://feishu.cn/file/JDFubYCQWoECgOxbJEXcdayun5c"}]},{"id":"arrival","eyebrow":["场景分解","Scene study"],"title":["进镇这场戏，靠剪辑建立方向","Cutting an arrival into a coherent place"],"summary":["小镇入口、教堂、街道、车厢和餐厅分别入镜，观众要能把它们拼成一次行程。","The entrance, church, street, cabin and diner appear in separate shots. The cuts need to add up to one journey."],"paragraphs":[["在到达小镇的片段中，俯视、车外、人物近景和驾驶员主观视角轮流出现。各个机位要共享同一辆车、同一批乘客、同一个年代的建筑与街景。剪辑点也提供了检查方法：切入车内时乘客的位置是否说得通，切回街道时观众能否接上刚才的行驶方向。","In the arrival sequence, an overhead view gives way to exterior coverage, close-ups and the driver’s point of view. Every setup needs the same car, occupants, period buildings and street. Each cut offers a check: does the passenger make sense in that seat, and does the movement back outside continue along the road we just saw?"]],"layout":"split","points":[],"media":[{"token":"CRk8b2AeQoViisxIOXEcdkAdnth","kind":"video","caption":["Grand Rapids 到达段落，注意车内外之间的切点","Grand Rapids arrival sequence, including the cuts between interior and exterior"],"source":""}]},{"id":"night","eyebrow":["灯光与色彩","Lighting and colour"],"title":["夜景的反打，也要继承同一束光","Carrying light through a night sequence"],"summary":["换到夜间旷野，灯光关系成了比地标更重要的辨认线索。","On the open range at night, light becomes a more useful landmark than a building."],"paragraphs":[["同一组人物和汽车经过野牛群。外部旷野呈蓝紫色，火把偏暖，车内有红光。摄影机在外景、人物反打、车内近景和驾驶视角间转换。检查衔接时，可以沿着人物面部的冷暖关系看下去，判断下一镜的光还能否来自此前建立的环境。","The same characters and car pass a herd of bison. The open country is blue-violet, torches burn warm and red light fills the cabin. The edit switches between exterior views, reverse angles, cabin close-ups and the driver’s perspective. Following the warm and cool light on the faces is a way to judge whether the next shot still belongs to the established setting."]],"layout":"wide","points":[],"media":[{"token":"SkoabghV9owfVqxmLObcANYKnEe","kind":"video","caption":["夜间旷野，外景、车内与主观镜头","Night sequence across the open range, cabin and driver’s-eye views"],"source":""}]},{"id":"performance","eyebrow":["表演与剪辑","Performance and edit"],"title":["先把真人这一条剪好","Cut the live performance first"],"summary":["制作分解把真人基础剪辑放在上方，对应的动画成片放在下方。","In the breakdown, the live-action base cut plays above the corresponding animation."],"paragraphs":[["上下两条画面里，人物的眼神、停顿、表情、对白长度，以及毛绒兔子和耳机等道具彼此对应。改变的是演员外形与棚内环境的美术呈现。因为景别、构图和镜头时长已有实拍参照，评审可以逐个指出一处动作或一拍对白有没有被保留下来。","Gazes, pauses, expressions and line readings correspond across the two strips, as do props such as a stuffed rabbit and headphones. The design of the actors and set changes. Because framing, composition and shot length already exist on film, a reviewer can identify exactly which gesture or beat has survived the transformation."]],"layout":"split","points":[],"media":[{"token":"KILhbN7nio48Jqx4ZPPcnxYxnBc","kind":"video","caption":["上方 BASE CUT 与下方 ANIMATION 同步对照","Synchronised BASE CUT above and ANIMATION below"],"source":""}]},{"id":"factory","eyebrow":["Gaumont · 视效研发","Gaumont · VFX research"],"title":["把一辆棚内的雪铁龙放回工厂","Building a factory around a Citroën"],"summary":["在与 Gaumont 的另一项研发里，问题从表演连续性转向建筑与设备的位置。","A separate Gaumont study shifts the continuity question from acting to architecture and machinery."],"paragraphs":[["实拍底片里有老式雪铁龙、演员、灯架、黑幕和少量布景。团队据此扩建完整年代厂房，补入生产线、工人和多辆汽车。环境制作分解同时给出几个机位；改变视角后，结构和设备都得落回同一座工厂内。","The plate contains a vintage Citroën, actors, lighting stands, drapes and a small set. The team extended it into a period factory with production lines, workers and additional cars. The breakdown shows several camera setups. Each new angle needs to place the structure and equipment back in the same building."],["案例将这次世界搭建记为约两周，并把传统周期描述为数月。这里的时长说的是环境研发，不能用来估算动画长片的工期。","The study reports roughly two weeks for this world build and describes the conventional timescale as months. That timing applies to environment development and gives no measure of the animated feature’s full schedule."]],"layout":"parallel","points":[],"media":[{"token":"Q9dKbTiXIoMEwpx90DJcc5Ixn1d","kind":"image","caption":["Gaumont 研发，棚拍底片与汽车工厂环境","Gaumont R&D, stage photography and factory environment"],"source":"https://feishu.cn/file/Q9dKbTiXIoMEwpx90DJcc5Ixn1d"},{"token":"BwRfb5Qvro830jxR0voc6MhMnRf","kind":"image","caption":["同一工业环境的不同机位","Alternate camera positions in the same industrial setting"],"source":"https://feishu.cn/file/BwRfb5Qvro830jxR0voc6MhMnRf"}]},{"id":"voice","eyebrow":["节目 IP · 参与体验","Format IP · Participation"],"title":["卧室里录下的歌，走上同一座舞台","From a bedroom recording to the same stage"],"summary":["《法国好声音》演示沿用了同样的做法，预先确定的内容换成了节目灯光、舞台和造型。","The Voice France demonstration uses the same approach with a different set of fixed decisions: the programme’s stage, lights and wardrobe."],"paragraphs":[["参与者用手机在卧室演唱。演示将不同拍摄条件下的歌手放进统一的节目舞台，并展示换装。看这个项目时，值得把歌手本人的演唱和节目方控制的视觉规则分开观察：前者要能保留个人表达，后者让来自不同房间的画面仍然属于同一个节目。","Participants record a performance on a phone at home. The demo brings singers filmed in different conditions onto a common stage and shows wardrobe changes. The singer supplies the individual performance. The format holder supplies the visual rules that make recordings from different rooms recognisable as the same programme."]],"layout":"split","points":[],"media":[{"token":"FLGEbvYkAoUWGlxLHInc5c6Nnme","kind":"video","caption":["《法国好声音》参与体验演示","The Voice France participation demo"],"source":""}]}],"takeaways":[{"title":["在剪辑点检查连续性","Review at the cut"],"body":["车内外的切换能同时暴露人物、方向、灯光和时间设定上的偏差。","Cutting between cabin and street exposes discrepancies in character, direction, light and period."]},{"title":["用确认过的表演作为比较基准","Compare against an approved performance"],"body":["对齐实拍和动画的时间线后，团队可以具体讨论该留住哪一个目光或停顿。","Aligning the live and animated timelines lets reviewers identify a particular gaze or pause worth preserving."]}],"sources":[{"title":["深度案例｜SEEN x Seedance：镜头之外，意图之上，SEEN 意图编码系统与 AI 影视生产实践【🔒仅内部】","Original case study in Chinese"],"url":"https://bytedance.larkoffice.com/wiki/XlwUw4jGJiiNpfknnP8c5vy7nee","type":"feishu"},{"title":["英文案例原文","Case study in English"],"url":"https://bytedance.larkoffice.com/wiki/LPSBwj5cUi7TWjkt6srcIC4ZnxZ","type":"feishu"},{"title":["《The Furious Five》预告片所在段落","The Furious Five teaser in the source document"],"url":"https://bytedance.larkoffice.com/wiki/XlwUw4jGJiiNpfknnP8c5vy7nee#DxysdXKAHofYN9xKfhycoIuAnFg","type":"feishu"}],"questions":["长片最终镜头数和发行信息尚未披露。","Gaumont 研发时间为案例方口径，未提供同条件下对照项目的排期明细。"],"evidence":["SEEN 原文第四节将长片明确标为保密待发布；预计超过2,000个镜头、约25名核心成员。","第五节的约两周是 Gaumont 环境搭建案例数据。第六节是单独的 The Voice 节目演示。"]},"wind":{"key":"wind","overview":["一位伦敦少年从电视中的 Michael Owen 获得足球梦想；多年后，他站上赛场，成为电视另一端被看见的人。《追风》以足球和奔跑连接时间、地域与人物。","A London boy finds his football dream in Michael Owen on television. Years later, he reaches the pitch and becomes the player seen on the other side of the screen. Chasing the Wind connects times, places and people through football and running."],"intro":["这支 Seedance 2.5 品牌短片以接近实拍广告的流程推进：先重写叙事，再准备人物、场景和道具，随后以多参考视频生成组织运动镜头，最后用剪辑、声音和调色构成完整故事。","This Seedance 2.5 brand film follows an approach informed by live-action advertising: revise the narrative, prepare characters, environments and props, generate action using multiple references, then shape the film through editing, sound and grading."],"metrics":[{"value":"1:45","label":["短片展示时长","Displayed film duration"],"note":["源文完整短片播放器显示 01:45。","The full-film player in the source displays 01:45."],"source":"https://bytedance.larkoffice.com/wiki/MYXFwWl5ki4NQKkMwdQcZuYknCg"},{"value":"720p","label":["制作阶段最高生成分辨率","Maximum generation resolution during production"],"note":["该项目材料中的实际制作条件。","The production condition reported for this project."],"source":"https://bytedance.larkoffice.com/wiki/MYXFwWl5ki4NQKkMwdQcZuYknCg"},{"value":"3","label":["球衣设计迭代次数","Jersey design iterations"],"note":["球衣设计部分记录的迭代轮数。","Iteration count recorded in the jersey-design section."],"source":"https://bytedance.larkoffice.com/wiki/MYXFwWl5ki4NQKkMwdQcZuYknCg"},{"value":"10+","label":["单次生成的镜头数量（团队实测）","Shots in one generation, reported by the team"],"note":["参考生视频流程中的项目观察。","An observation from the project’s reference-to-video workflow."],"source":"https://bytedance.larkoffice.com/wiki/MYXFwWl5ki4NQKkMwdQcZuYknCg"}],"sections":[{"id":"wind-story","eyebrow":["1 · 作品与故事","1 · Film and story"],"title":["从仰望电视，到站上赛场。","From watching the screen to reaching the pitch."],"summary":["故事的观看关系，在片头与片尾发生倒转。","The relationship between viewer and player reverses between the beginning and the end."],"paragraphs":[["故事概要从 1998 年伦敦街头展开：一个少年在酒吧电视中看到 Owen 奔跑，由此爱上足球。这份热爱穿过街道、城市和不同人群，在世界各地延续。","The story synopsis begins on a London street in 1998. A boy sees Owen running on a pub television and falls in love with football. That enthusiasm travels through streets, cities and different groups of people."],["多年后，少年真正站上赛场，并与电视另一端的 Owen 隔空对视。影片的重点由球员的职业经历，转向他的奔跑影响了谁，以及一份热爱怎样被继承。","Years later, the boy reaches the pitch and exchanges a look with Owen through the screen. The film shifts its focus from a player’s career to the people his running inspired and how that passion is passed on."]],"layout":"wide","points":[],"media":[{"token":"YDpcb4GkeoSSrDxcaX7cCPeonnf","kind":"video","caption":["《追风》带片尾标识的完整影片。","Chasing the Wind, full film with closing branding."],"source":"https://bytedance.larkoffice.com/wiki/MYXFwWl5ki4NQKkMwdQcZuYknCg"}]},{"id":"wind-script","eyebrow":["2 · 创意与剧本","2 · Creative development"],"title":["把赛事记忆，改写成普通人的热爱。","Reframe sporting memory as an everyday passion."],"summary":["从单线传记，转为跨时空的多线交叉叙事。","A linear biography becomes interwoven stories across time and place."],"paragraphs":[["初版围绕 Owen 的职业生涯，试图用经典瞬间连接青春、热爱与遗憾。制作推进后，团队明确了具体球队、官方球衣、赛事标识和真实比赛画面的使用边界，单纯还原动作难以保留那些经典时刻的语境。","The first version followed Owen’s career, using iconic moments to connect youth, passion and regret. As production progressed, the team clarified restrictions around clubs, official kits, event marks and actual match footage. Recreating actions alone would not preserve the context of those moments."],["剧本因此转向“追风少年”的精神：不同时空中的普通人踢球、奔跑与追逐，与职业球员形成动作和构图上的呼应。无法直接使用的赛事记忆，被改写为观众可以代入的足球体验。","The script moved toward the spirit of the young runner. Ordinary people playing, running and chasing across different settings echo the professional player through actions and compositions. Specific sporting memories become experiences the audience can share."]],"layout":"split","points":[],"media":[{"token":"","kind":"image","caption":["街头空间与少年，是故事进入足球世界的起点。","The street and the boy provide the story’s entry into football."],"source":"https://bytedance.larkoffice.com/wiki/MYXFwWl5ki4NQKkMwdQcZuYknCg","localPath":"rotating-src/assets/wind-street.jpg"}]},{"id":"wind-assets","eyebrow":["3 · 前期资产","3 · Pre-production assets"],"title":["让年代、角色和道具，说同一种视觉语言。","Give period, character and props one visual language."],"summary":["具体的美术细节，承担场景统一和时代识别。","Specific design details establish a consistent world and sense of period."],"paragraphs":[["场景参考通过建筑、酒吧、老式电视、街道材质、行人衣着和人群状态建立英国街区的年代感。明亮度、冷暖关系与材质表现一并确定，足球氛围则由配色、观赛者和电视转播等元素补足。","Architectural details, pubs, old televisions, street materials, clothing and crowd behaviour establish the period feel of the British neighbourhood. Brightness, colour temperature and material response are planned together, while colours, spectators and television coverage create the football atmosphere."],["主角被设定为约十二岁的英国男孩：身形轻盈，眼神明亮而倔强，球衣褶皱与轻微擦伤帮助形成真实感。人物、服装和关键道具先形成清晰参考，再进入视频生成。","The protagonist is designed as a British boy of about twelve: light on his feet, with a bright, determined gaze. Creases in his clothing and small grazes add realism. Clear references for the character, costume and key props precede video generation."]],"layout":"parallel","points":[{"title":["场景","Environment"],"body":["将老电视、砖墙、公交、酒吧与潮湿街道组织成统一的时代氛围。","Combine old televisions, brick walls, buses, pubs and damp streets into a coherent period setting."]},{"title":["服装","Costume"],"body":["球衣经过三次设计迭代，团队逐步重做版型、配色和装饰关系。","The jerseys go through three design iterations, revising cuts, colours and decorative relationships."]},{"title":["足球","Football"],"body":["保留拼接结构，重新设计非对称几何色块与材质，形成独立的道具参考。","Retain a panel construction while redesigning asymmetric geometric graphics and materials as an original prop reference."]}],"media":[{"token":"","kind":"image","caption":["《追风》的足球与人物视觉设定延续到成片。","The football and character design carry through into the finished film."],"source":"https://bytedance.larkoffice.com/wiki/MYXFwWl5ki4NQKkMwdQcZuYknCg","localPath":"rotating-src/assets/wind.jpg"}]},{"id":"wind-reference-workflow","eyebrow":["4 · 生成流程","4 · Generation workflow"],"title":["从逐张美术帧，转向多参考视频生成。","Move from individual artwork frames to multiple references."],"summary":["人物、场景、服装和道具各有明确用途，镜头由文本组织。","Assign a clear role to each character, environment, costume and prop reference; organise the shots in text."],"paragraphs":[["团队原先考虑先生成美术关键帧，再逐镜头进行图生视频。但项目周期短，且运动镜头对动态强度要求高；图片阶段的质量修正也会占用大量时间。","The team initially considered generating artwork keyframes and animating them shot by shot. The short production window and demanding action made that approach difficult, while correcting still-image quality also consumed time."],["制作重心转为 Seedance 2.5 的参考生视频能力：将人物形象、街道、酒吧、对手服装与足球分别绑定到参考资料，再用提示词安排动作和镜头。材料记录，一段约十五秒的例子由模型生成多个镜头并同时生成环境音效。","The workflow shifted to Seedance 2.5 reference-to-video. Character appearance, streets, pubs, opposing players’ costumes and the football are assigned to distinct references, while the prompt arranges actions and shots. The source describes an approximately fifteen-second example with multiple model-generated shots and generated environmental sound."],["这种做法把更多选择留在同一段动态生成中。团队的项目观察是，多个运动镜头一起生成时，动势、道具和美术风格更容易形成连续关系。","This approach keeps more decisions inside one moving sequence. The team observed that generating action shots together could produce stronger continuity in movement, props and production design."]],"layout":"split","points":[],"media":[{"token":"","kind":"image","caption":["运动段落围绕同一人物、足球和场景参考展开。","The action sequence is built around consistent character, football and environment references."],"source":"https://bytedance.larkoffice.com/wiki/MYXFwWl5ki4NQKkMwdQcZuYknCg","localPath":"rotating-src/assets/wind-run.jpg"}]},{"id":"wind-prompt-structure","eyebrow":["5 · 镜头控制","5 · Shot control"],"title":["先锁定全局，再安排每一镜。","Define the whole sequence before its individual shots."],"summary":["把参考用途、视觉调性、动作与排除项分层写清。","Separate reference roles, visual tone, action and exclusions in the prompt."],"paragraphs":[["材料中的提示词先说明各张参考图承担什么任务，避免人物、服装、场景和道具的信息混用。人物参考集中面部与全身造型，场景则选择最有代表性的统一影调，其余空间信息由文字补充。","The prompts first explain what each reference supplies, avoiding confusion between people, costumes, settings and props. Character references combine face and full-body appearance; representative environment references establish the look, with text describing the remaining space."],["随后按镜头写明视角、机位运动、人物进入画面的方向、停顿和观看关系。普通街区、阴天自然光、酒吧暖光与轻微手持等具体元素，支撑整体的广告质感。","The shot instructions specify viewpoint, camera movement, where a character enters, pauses and what they look toward. Concrete elements such as an ordinary neighbourhood, overcast daylight, warm pub interiors and restrained handheld movement support the advertising look."]],"layout":"steps","points":[{"title":["参考绑定","Reference assignments"],"body":["分别定义人物、空间、服装与关键道具，不把多张图混成含糊的总体参考。","Assign separate references to character, space, costume and key props."]},{"title":["镜头顺序","Shot order"],"body":["用动作、构图与摄影机路径说明镜头如何连接，而非只罗列画面风格。","Describe connections through action, composition and camera paths rather than listing visual styles alone."]},{"title":["生成边界","Generation boundaries"],"body":["指定不需要的标识、地标、文字和常见动态异常，让画面服务普通街头的故事。","Specify unwanted marks, landmarks, text and motion artefacts so the result serves an everyday street-football story."]}],"media":[]},{"id":"wind-sound","eyebrow":["6 · 声音生成","6 · Generated sound"],"title":["每一次触球，都有对应的声音。","Give each touch of the ball its own sound."],"summary":["将生成片段的环境音，与成片剪辑中的声音叙事区分处理。","Distinguish environmental sound in generated clips from the final film’s sound narrative."],"paragraphs":[["示例生成提示词采用“全局排除＋逐镜头指定”：不自动加入配乐、解说和对白，重点保留脚步、足球摩擦、积水、玻璃、电视电流、公交和呼吸等环境音。关键动作明确对应声音的时间、远近与强弱。","The example prompts combine global exclusions with shot-specific directions. Instead of automatically adding music, commentary or dialogue, they focus on footsteps, ball friction, water, glass, television noise, buses and breathing. Key actions specify the timing, distance and strength of their sounds."],["成片剪辑阶段另有声音叙事设计。材料记录，赛事解说与少年的街头动作相互对位，使同一段声音同时指向 Owen 与男孩。生成阶段的声音约束，并不等同于最终混音的完整方案。","The final edit has a separate sound narrative. The source describes aligning match commentary with the boy’s street actions so the same words refer both to Owen and to the boy. Constraints used during generation are therefore distinct from the complete final mix."]],"layout":"split","points":[],"media":[]},{"id":"wind-edit","eyebrow":["7 · 剪辑与完成","7 · Editing and finishing"],"title":["足球成为跨时空的接力棒。","The football becomes a relay across time and place."],"summary":["让球的轨迹、人物动作和声音节奏，把分散素材组织成故事。","Use the ball’s trajectory, human movement and sound to organise separate clips into a story."],"paragraphs":[["剪辑从奔跑、带球、触球和过人建立节奏。运动段落用较短镜头强化速度，人物观察和结尾对视适当放缓；从每条生成素材中提炼可用动作，再用变速、裁切和重组完成衔接。","The edit builds its rhythm from running, dribbling, touching the ball and passing opponents. Shorter shots intensify action, while observation and the final exchange of looks slow the pace. Usable movements are selected from each generation, then connected through retiming, cropping and restructuring."],["跨场景的关键不是动作大致相似，而是足球的运动方向持续成立。少年在街头踢出的球，切到球员脚下继续滚动；动作、脚步和构图共同维持观看的连续性。","Connections depend on more than broadly similar actions: the ball’s direction must continue to make sense. A kick on the street cuts to the ball rolling at a player’s feet. Action, footsteps and composition together preserve continuity."],["不同批次素材再统一曝光、色温、肤色、颗粒与对比度。对于面部漂移、肢体或球轨迹异常，团队使用局部替换、遮挡、跟踪和逐帧调整；无法稳定修复的段落则缩短或改变使用方式。","The team matches exposure, colour temperature, skin tones, grain and contrast across batches. Face drift, limb problems and abnormal ball trajectories are treated with local replacements, occlusion, tracking and frame-level work; unstable moments are shortened or used differently."]],"layout":"steps","points":[{"title":["动作匹配","Match the action"],"body":["用足球轨迹和人物姿态延续空间关系。","Carry spatial relationships through ball trajectories and body poses."]},{"title":["观看倒转","Reverse the gaze"],"body":["片头少年看向电视中的球员，片尾球员看向电视中的少年。","The boy watches the player at the beginning; the player watches the boy at the end."]},{"title":["统一完成度","Unify the finish"],"body":["把色彩、动态修复和声音放回同一套影片节奏。","Bring colour, motion repair and sound into the same film rhythm."]}],"media":[]}],"takeaways":[{"title":["让故事先适应制作条件","Adapt the story to production conditions"],"body":["从具体赛事回忆转向精神传承，为多线叙事建立清晰主语。","Move from specific sporting memories to a clear story about passing on a passion."]},{"title":["用参考分工提高连续性","Give references distinct jobs"],"body":["人物、场景、服装和道具分别锁定，再用文字控制动态关系。","Lock character, environment, costume and props separately, then describe their moving relationships."]},{"title":["剪辑决定素材怎样成为影片","Editing turns clips into a film"],"body":["选择可用瞬间，以球、动作、声音与观看关系组织叙事。","Select usable moments and structure the narrative through the ball, action, sound and the gaze."]}],"sources":[{"title":["深度案例｜Seedance 2.5 AI短片《追风》幕后【🔒仅内部】","Behind Chasing the Wind | Seedance 2.5 AI Short Film — Internal Only"],"url":"https://bytedance.larkoffice.com/wiki/MYXFwWl5ki4NQKkMwdQcZuYknCg","type":"feishu"}],"questions":["故事概要使用 1998 年，具体生成示例提示词使用 2006 年；页面按叙事与示例分别呈现，未强行统一为一个年份。","源文未给出项目总预算、总工时或传播效果数据，因此没有编造此类指标。","完整短片已恢复为本地影片；长镜头生成拆解及设计过程附件尚未逐一恢复，现有过程图仅以静帧标注。"],"evidence":["依据已登录浏览器读取的 /tmp/seed-wind-source.txt 正文整理；忽略重复的“AI 速览”摘要。","01:45 来自完整短片播放器；720p 来自前言；三次迭代仅指球衣；单次 10+ 镜头来自技术解析的团队实测。","原文生成示例只要求环境音；后期剪辑正文另述解说对位，二者分开呈现。","完整影片 token YDpcb4GkeoSSrDxcaX7cCPeonnf 来自汇总文档 source-audit/master.json；三张本地图片为现有真实案例素材。"]},"chapter41":{"key":"chapter41","overview":["《Volcano High》把一出舞台剧搬进不断变形的校园。演员和摄影机走过真实的房间，Chapter41 再用 Seedance 2.5 等模型重新布置人物身边的世界。","Volcano High takes a stage play into a school that keeps changing shape. The actors and camera move through real rooms. Chapter41 uses models including Seedance 2.5 to rebuild the world around them."],"intro":["镜头开场，一个学生低头看显微镜。试拍时他面前只有一只水瓶。这个小道具道出了整部片的拍法：先拍下演员把身体探向哪里、眼睛看向哪里，再让那个值得他凝视的东西出现在画面里。","A student leans over a microscope in the opening shot. On the test shoot, he had a water bottle. That small stand-in gives the film its starting point: first record where the actor leans and looks, then build the object that holds his attention."],"metrics":[{"value":"≈12 min","label":["计划的连续镜头","Planned continuous take"],"note":["《Volcano High》的设计时长；指整段长镜头。","The intended length of the film’s continuous shot."],"source":"https://bytedance.larkoffice.com/wiki/RQ23w900XienU2kHuCycdPNMngc"},{"value":"3","label":["体育馆内实拍演员","Actors filmed in the gym"],"note":["三位演员靠近镜头唱歌、做手势。","Three performers approached the camera, sang and gestured."],"source":"https://bytedance.larkoffice.com/wiki/RQ23w900XienU2kHuCycdPNMngc"},{"value":"20","label":["同一场面的生成人物","Generated figures in that scene"],"note":["创意指导 Tom Tykwer 回顾这段群戏时给出的数量。","The number creative director Tom Tykwer gave for the generated ensemble."],"source":"https://bytedance.larkoffice.com/wiki/RQ23w900XienU2kHuCycdPNMngc"}],"sections":[{"id":"adaptation","eyebrow":["影片","The film"],"title":["把剧场的身体感留在校园里","A school built around real performances"],"summary":["Bonn Park 根据自己的舞台剧编导了这部短片，德语片名为 Gymnasium。","Writer-director Bonn Park adapted his own play for this short, titled Gymnasium in German."],"paragraphs":[["欧洲工作室 Chapter41 与德国制片公司 X Filme 合作。Bonn 希望观众既相信人物的动作，又逐渐对周围的空间产生疑虑。熟悉的体育馆、长廊和桌椅给这种变化提供了起点。","European studio Chapter41 collaborated with German production company X Filme. Park wanted viewers to believe the performers and gradually grow uneasy about the space around them. An ordinary gym, corridor and rows of tables give the changes somewhere familiar to begin."],["Lars Stark 负责 AI 制作，Sarika Hemi Lakhani 担任制片人，Tom Tykwer 担任创意指导。导演保留了真人表演与实拍运镜，把可变的部分交给环境设计。","Lars Stark led AI production, Sarika Hemi Lakhani produced and Tom Tykwer served as creative director. Park anchored the piece in the actors and camera moves, leaving the surroundings open to redesign."]],"layout":"wide","points":[],"media":[{"token":"G3RfbT6K4oSCl2xHd2kchVejndb","kind":"video","caption":["《Volcano High》预告片","Volcano High teaser"],"source":""}]},{"id":"replacements","eyebrow":["镜头对照","Shot comparisons"],"title":["从一只水瓶到二十个人物","From one water bottle to twenty figures"],"summary":["同一套拍法处理了两种尺度的变化，一处小到手边的道具，一处大到整群人的表演。","The same shoot supported two very different changes, from an object within arm’s reach to a roomful of performers."],"paragraphs":[["开头试拍时，学生俯身靠近水瓶。制作团队沿用他的姿态和视线，把水瓶换成显微镜。观众读懂这个动作，靠的是眼睛、头部与物体之间的距离。","In the test take, the student bends down to a bottle. The crew keeps the posture and eyeline, substituting a microscope. The distance between eye, head and object is what makes the gesture legible."],["体育馆段落则从三名演员的歌唱和手势起步。按 Tykwer 的回忆，团队用 Seedance 生成了二十个人物。对照里可以看前景演员的节拍如何延伸到后排，以及各人的动作是否各有分别。","In the gym, three performers supplied the song and gestures. Tykwer recalls using Seedance to generate twenty figures. In the comparison, watch how the front row sets a rhythm for the people behind it and how the gestures differ across the group."]],"layout":"parallel","points":[],"media":[{"token":"SyFabzYH0oR6ZJxVCmhcZrBtnV1","kind":"video","caption":["显微镜镜头，试拍与处理后对照","Microscope shot, test take and processed image"],"source":""},{"token":"WwZPbO6RroyDBoxq48Oc0Fj3n2S","kind":"video","caption":["体育馆群戏，实拍与生成对照","Gym ensemble, photographed and generated versions"],"source":""},{"token":"YpRnbYEenoTiFNxqGtccNu6hnWc","kind":"image","caption":["三位前景演员和扩充后的人群","The three performers and the expanded ensemble"],"source":""}]},{"id":"return","eyebrow":["长镜头","Continuous take"],"title":["摄影机转回来，桌子还得在原处","When the camera turns back"],"summary":["约十二分钟的一镜到底，让房间内每一次回望都成为连续性检查。","A planned twelve-minute take turns every return to a room into a continuity test."],"paragraphs":[["演员何时转身、摄影机以多快的速度靠近门，都在实拍时确定。后期可以重做墙面、增加植物或改变人群密度。摄影机离开后再转回来，桌椅和人物还得处在符合此前画面的位置，否则观众会丢失方向。","The live shoot fixes the actors’ turns and the speed of the camera’s approach to a door. The team can replace walls, introduce a plant or change the density of a crowd. When the camera looks away and back, furniture and performers must occupy positions that make sense against the earlier view, or the audience loses its bearings."]],"layout":"parallel","points":[],"media":[{"token":"McMrbwDqqoAV7PxVKPWcT0h4nfc","kind":"video","caption":["长廊与室内空间的动态对照","Moving comparison of the corridor and interior"],"source":""},{"token":"VbECbCr6LoiFJMxxI1McgbfvnWe","kind":"image","caption":["奇异的学校空间，注意桌椅、植物与人物的位置","Transformed school interior with furniture, a plant and performers"],"source":""}]},{"id":"monitor","eyebrow":["片场协作","On set"],"title":["赶在演员离场前看一次","Review the shot while the actors are there"],"summary":["AI artists 在现场调取刚拍下的素材，做出接近设想的环境预演。","The AI artists take footage straight from the set and make a preview of the intended environment."],"paragraphs":[["灯还亮着，人也还在。导演和摄影师能在监视器前判断，演员的情绪是否足以接住即将出现的火焰、飞行或空间变化。这次判断直接决定是保留表演、换个机位，还是当场再拍一条。","The lights are still up and the cast is available. At the monitor, the director and cinematographer can judge whether the performance will carry a burst of flame, flight or a change of space. That informs a concrete decision: keep the take, change the angle or shoot another performance."]],"layout":"steps","points":[{"title":["输入","The plate"],"body":["取刚完成的表演和机位，保留身体与镜头之间的关系。","Start with the new take and the relationship between body and camera."]},{"title":["现场反馈","The preview"],"body":["在预想的环境中检验构图、动作和情绪是否仍然成立。","Review the composition, action and emotion inside a candidate environment."]},{"title":["拍摄决定","The next take"],"body":["与导演、摄影共同决定补什么素材，趁片场条件仍在时处理。","The director and camera crew decide what to pick up while the set is intact."]}],"media":[]},{"id":"writing","eyebrow":["创作边界","Development"],"title":["一个场景值不值得写进剧本","Which scenes make it onto the page?"],"summary":["Tykwer 把一次试拍的价值追溯到了写作阶段。","For Tykwer, the value of a test can reach back into the writing process."],"paragraphs":[["当团队能在监视器里看到一个房间随着表演发生变化，编剧就有依据保留原先可能因搭景困难而删去的段落。下一步可以具体讨论演员怎么走、摄影机从哪里看见变化、美术该提供哪些参照。技术试验在这里改变了创作讨论的具体内容。","Seeing a room transform around a performance gives the writer a reason to keep a scene that might once have been cut for the difficulty of building it. The team can discuss where the actor walks, from which angle the change will read and what reference the art department needs to supply. The test changes the conversation about the script."]],"layout":"wide","points":[],"media":[]}],"takeaways":[{"title":["让替代道具留下准确的动作","Use stand-ins to get the action right"],"body":["水瓶已经能确定俯身高度和视线，美术随后需要匹配这些条件。","The bottle fixes the height of the lean and the eyeline. The replacement must respect both."]},{"title":["在转回原位的镜头里检查空间","Check the return view"],"body":["房间首次出现时建立的参照物，应该在摄影机回望时仍能辨认。","Landmarks established on first entry should still be legible on the return."]}],"sources":[{"title":["深度案例｜Chapter41 x Seedance：把还不存在的世界，带进拍摄现场【✅ 可对外】","Original case study in Chinese"],"url":"https://bytedance.larkoffice.com/wiki/RQ23w900XienU2kHuCycdPNMngc","type":"feishu"},{"title":["英文案例原文","Case study in English"],"url":"https://bytedance.larkoffice.com/wiki/WXxzwpxlNiqDfTk2afYchhLGnJF","type":"feishu"},{"title":["Tom Tykwer 访谈","Interview with Tom Tykwer"],"url":"https://mp.weixin.qq.com/s/WddOXUpni3MhTG4hJYUd3w","type":"pr"}],"questions":["是否有约十二分钟完整镜头的已核准放映素材？原文给出了设计时长和预告片。"],"evidence":["项目分工、约12分钟长镜头、三名实拍演员与二十名生成人物均见中文原文第二、三节。","出版正文与展示媒体仅讨论 Volcano High；原文引用的另一部短片未用作本项目的画面或技术证据。"]},"xt5":{"key":"xt5","overview":["源然睿影在凯迪拉克 XT5 PHEV 广告中，将 AI 用于实拍置景、光源重构、人物合成和转场；另一支淘宝服饰推广片，则展示纯 AI 动态制作的工作流。","Yuanran Ruiying uses AI for set enhancement, relighting, actor compositing and transitions in Cadillac XT5 PHEV advertising. A separate Taobao fashion film demonstrates an entirely AI-generated moving-image workflow."],"intro":["以倪妮篇、樊振东篇两条 XT5 广告为入口，再与淘宝纯 AI 项目对照，本案例关注的是一条制作链如何分工：前端调研、预演和故事板仍由团队把关，AI 进入具体的镜头和中后期任务。","Starting with the Nini and Fan Zhendong XT5 commercials and comparing them with the Taobao project, this case examines production roles: research, previs and storyboards remain directed by the team, while AI handles specific shot and finishing tasks."],"metrics":[{"value":"70–80%","label":["XT5 项目 AI 镜头占比","AI-shot share in the XT5 project"],"note":["材料中的多工具 AI 总占比，涵盖两条 XT5 广告。","The source’s overall AI share across multiple tools and the two XT5 commercials."],"source":"https://bytedance.larkoffice.com/docx/Vj5zdNeYMoxyQlxafKncyoRFnfc"},{"value":"20–30%","label":["XT5 中 Seedance Studio 承担占比","Seedance Studio share in XT5"],"note":["材料限定在路跑背景与转场任务。","The source limits this contribution to driving backgrounds and transitions."],"source":"https://bytedance.larkoffice.com/docx/Vj5zdNeYMoxyQlxafKncyoRFnfc"},{"value":"2:20","label":["淘宝纯 AI 广告成片时长","Finished duration of the Taobao AI film"],"note":["剪辑后交付版本的时长。","Duration of the edited delivery version."],"source":"https://bytedance.larkoffice.com/docx/Vj5zdNeYMoxyQlxafKncyoRFnfc"},{"value":"¥50K+","label":["淘宝项目积分消耗","Credit spending on the Taobao project"],"note":["Liblib 出图与 Seedance Studio 动态两部分的积分消耗，材料以人民币元记录。","Combined credit spending on Liblib still generation and Seedance Studio moving images, recorded in yuan in the source."],"source":"https://bytedance.larkoffice.com/docx/Vj5zdNeYMoxyQlxafKncyoRFnfc"}],"sections":[{"id":"xt5-two-workflows","eyebrow":["1 · 项目与路径","1 · Projects and approaches"],"title":["两类广告，两种 AI 进入方式。","Two advertising formats; two ways to use AI."],"summary":["实拍广告保留真实拍摄基础，纯 AI 项目把动态镜头交给生成制作。","The live-action commercial retains filmed material; the AI project generates its moving-image shots."],"paragraphs":[["凯迪拉克 XT5 PHEV 项目包含倪妮篇与樊振东篇。材料把 AI 的作用分为置景合成与重塑、人物合成，以及生成式片段三部分。","The Cadillac XT5 PHEV project includes Nini and Fan Zhendong versions. The source divides AI work into set compositing and reshaping, actor compositing and generated sequences."],["淘宝服饰推广片以从办公室飞向草原、追寻自由为主题，动态镜头全部使用 Seedance Studio 制作。两类项目使用不同的拍摄基础，仍共享调研、资产、分镜、生成和后期组织。","The Taobao fashion film follows a theme of leaving the office for open grassland and freedom. Its moving-image shots are all made with Seedance Studio. Although the two approaches start from different footage foundations, both require research, assets, storyboards, generation and finishing."]],"layout":"wide","points":[],"media":[{"token":"WLzIbjXMTofWrZxrtOQcRE0in5f","kind":"video","caption":["凯迪拉克 XT5 PHEV 倪妮篇。","Cadillac XT5 PHEV, Nini version."],"source":"https://bytedance.larkoffice.com/docx/Vj5zdNeYMoxyQlxafKncyoRFnfc"}]},{"id":"xt5-pre-production","eyebrow":["2 · 前期规划","2 · Pre-production"],"title":["先通过预演，确定拍什么。","Use previs to establish what to shoot."],"summary":["资产调研、三维预演与故事板，构成前端制作顺序。","Asset research, 3D previs and storyboards establish the front end of production."],"paragraphs":[["XT5 项目的前期从资产调研出发，使用三维软件进行预演，再整理分镜和故事板。镜头如何构图、人物与车辆如何进入空间，在动态生成之前就需要形成可沟通的方案。","XT5 pre-production begins with asset research, proceeds to 3D previs, and then develops storyboards. Framing and the relationships between people, vehicles and space need to become communicable plans before generation."],["材料对两类广告的总结是：AI 被嵌在中后段，前端仍沿用传统广告的创意与提报链路。工具改变具体任务的完成方式，团队仍要先统一方向和制作目标。","Across the two advertising approaches, the source describes AI as embedded in the middle and later stages, while the front end retains conventional creative and client-presentation processes. Tools change how tasks are executed; the team still aligns direction and production goals first."]],"layout":"steps","points":[{"title":["资产调研","Asset research"],"body":["整理车辆、人物、服装与场景等制作所需的视觉依据。","Collect the visual basis for vehicles, people, costumes and settings."]},{"title":["三维预演","3D previs"],"body":["先在可控空间中验证构图、运动与拍摄安排。","Test framing, movement and shooting arrangements in a controllable space."]},{"title":["分镜与故事板","Storyboards"],"body":["将选定方案整理为团队和客户可以共同确认的镜头顺序。","Turn the chosen approach into a shot sequence the team and client can review."]}],"media":[{"kind":"image","token":"VoKUbZmPwottSAx5dRjcChaAnoe","localPath":"assets/article-media/xt5/VoKUbZmPwottSAx5dRjcChaAnoe.webp","caption":["前期调研与预演工作图，道路参考、三维画面和车内镜头并列。","Road research and previs sheet, with road references, a 3D view and an interior shot side by side."],"source":"https://bytedance.larkoffice.com/docx/Vj5zdNeYMoxyQlxafKncyoRFnfc"}]},{"id":"xt5-set-enhancement","eyebrow":["3 · 实拍置景","3 · Live-action set enhancement"],"title":["保留车与前景，重做环境的光。","Keep the vehicle and foreground; reshape the light."],"summary":["从不满意的拍摄环境出发，补充提亮、材质与城市细节。","Start with a filmed environment and enhance brightness, materials and urban detail."],"paragraphs":[["材料中的第一个置景示例，前景来自真实置景，车辆也为实拍。团队对原环境不满意，于是进行光源重构，并通过 AI 补充亮度、材质和城市细节。","In the first set example, both the foreground set and vehicle are real. The team was dissatisfied with the original environment, so it reconstructed lighting and used AI to add brightness, material response and urban detail."],["这个任务的制作判断是保留已有拍摄关系，再修改环境呈现。它与直接生成一整辆车、一整段广告的任务不同，观看对照时应把注意力放在环境如何接住真实车辆和前景。","The task preserves the relationships established during filming while changing the environment’s appearance. In a comparison, the useful question is how the altered environment continues to support the real vehicle and foreground."]],"layout":"split","points":[],"media":[{"kind":"image","token":"","localPath":"assets/article-media/xt5/SdXXbErAgo3s0excpXnc9KVmnTf.webp","caption":["案例视频静帧，车辆驶过街角，前景车身与城市立面同时入画。","Still from the case video. The car passes a street corner, with the vehicle and city façade in the same frame."],"source":"https://bytedance.larkoffice.com/docx/Vj5zdNeYMoxyQlxafKncyoRFnfc"},{"token":"","kind":"image","caption":["XT5 广告中的车辆与环境展示画面。","Vehicle and environment imagery from the XT5 commercial."],"source":"https://bytedance.larkoffice.com/docx/Vj5zdNeYMoxyQlxafKncyoRFnfc","localPath":"rotating-src/assets/xt5-shot.jpg"}]},{"id":"xt5-actor-and-transitions","eyebrow":["4 · 合成与转场","4 · Compositing and transitions"],"title":["把真实人物，接进生成的段落。","Connect real performers with generated sequences."],"summary":["人物合成、CG 平面到实拍的转场，以及材质片段分别承担不同任务。","Actor compositing, transitions from CG imagery to filming, and material sequences serve different tasks."],"paragraphs":[["除环境重塑外，材料还展示演员实拍的融入，以及从 CG 平面向真实实拍过渡的生成式效果。人物、车辆和场景不需要在同一环节一次完成，而是在不同制作任务中逐步衔接。","Beyond environmental work, the source shows filmed actors being integrated and generated transitions from CG imagery to live-action footage. Performers, vehicles and settings are connected across production tasks rather than completed in a single operation."],["材料给出 XT5 广告 70%–80% 的 AI 镜头总占比，同时明确 Seedance Studio 承担约 20%–30%，范围限于路跑背景与转场。这里保留这两个不同口径，便于看清多工具制作中的实际分工。","The source reports an overall AI-shot share of 70–80% for the XT5 advertising and separately places Seedance Studio’s contribution at approximately 20–30%, limited to driving backgrounds and transitions. Keeping both figures preserves the distinction between the
