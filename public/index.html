  <style>*,

:root {
  font-size: 11px;
  --page-padding: 1.5rem;
  --color-text: #ffffffea;
  --color-bg: #141414;

  --item-width: 300px;
  --color-marquee: rgba(251, 251, 251, 0.942);
  --font-size-marquee: clamp(2rem, 16vw, 8rem);
  --blend-mode: difference;
  --color-shadow-in: rgba(0, 0, 0, 0.2);
  --color-shadow-out: rgba(0, 0, 0, 0.8);
}

body {

  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
}

@media (scripting: enabled) {
  .loading {
    &::before,
    &::after {
      content: "";
      position: fixed;
      z-index: 10000;
    }

    &::before {
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--color-bg);
    }

    &::after {
      top: 50%;
      left: 50%;
      width: 100px;
      height: 1px;
      margin: 0 0 0 -50px;
      background: var(--color-link);
      animation: loaderAnim 1.5s ease-in-out infinite alternate forwards;
    }
  }
}

@keyframes loaderAnim {
  0% {
    transform: scaleX(0);
    transform-origin: 0% 50%;
  }

  50% {
    transform: scaleX(1);
    transform-origin: 0% 50%;
  }

  50.1% {
    transform: scaleX(1);
    transform-origin: 100% 50%;
  }

  100% {
    transform: scaleX(0);
    transform-origin: 100% 50%;
  }
}

a {
  text-decoration: none;
  color: var(--color-link);
  outline: none;
  cursor: pointer;

  &:hover {
    text-decoration: none;
    color: var(--color-link-hover);
  }

  &:focus {
    outline: none;
    background: lightgrey;

    &:not(:focus-visible) {
      background: transparent;
    }

    &:focus-visible {
      outline: 2px solid red;
      background: transparent;
    }
  }
}

.frame {
  font-weight: bold;
  padding: var(--page-padding);
  display: grid;
  z-index: 10000;
  position: relative;
  gap: 1rem;
  pointer-events: none;
  justify-items: start;
  grid-template-columns: 100%;
  grid-template-areas:
    "title"
    "links"
    "demos"
    "tags"
    "sponsor";

  #cdawrap {
    justify-self: start;
    grid-area: sponsor;
  }

  a,
  button {
    pointer-events: auto;
  }

  .frame__title {
    grid-area: title;
    font-size: inherit;
    font-weight: inherit;
    margin: 0;
  }

  .frame__tags {
    grid-area: tags;
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .frame__links {
    grid-area: links;
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .frame__demos {
    grid-area: demos;
    display: grid;
    grid-template-columns: auto repeat(5, auto);
    gap: 0.5rem 1.4rem;
    font-variant-numeric: tabular-nums;
  }

  .frame__demos-label {
    grid-column: 1;
    grid-row: 1;
    margin-right: 0.4rem;
    color: var(--color-link);
  }

  .frame__demo:nth-child(5n + 2) {
    grid-column-start: 2;
  }

  .frame__demo--current {
    color: var(--color-text);
  }

  @media screen and (min-width: 53em) {
    height: 100%;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    gap: 3rem;
    grid-template-columns: auto auto 1fr;
    grid-template-rows: auto auto;
    align-content: space-between;
    grid-template-areas:
      "title links demos"
      "tags tags sponsor";

    .frame__tags {
      align-self: end;
    }

    .frame__demos,
    #cdawrap {
      justify-self: end;
      text-align: right;
    }
  }
}

.mark {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 100vw;
  left: 0;
  z-index: 1;
  overflow: hidden;
  mix-blend-mode: var(--blend-mode);
}

body::after {
  content: "";
  top: 0;
  left: 0;
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: 1000;
  pointer-events: none;
  background: radial-gradient(var(--color-shadow-in) 10%, var(--color-shadow-out) 80%);
  background-repeat: no-repeat;
  background-size: 100%;
}

.mark__inner {
  display: flex;
  gap: 3rem;
  width: max-content;
  position: relative;
  will-change: transform;
}

.mark__inner span {
  white-space: nowrap;
  text-transform: uppercase;
  color: var(--color-marquee);
  font-size: var(--font-size-marquee);
  line-height: 1;
}

.font-1 {
  font-family: "scale-variable", sans-serif;
  font-variation-settings:
    "wght" 772,
    "wdth" 60;
}

.font-2 {
  font-family: "totalblack-variable", sans-serif;
  font-variation-settings: "wght" 800;
}

.font-3 {
  font-family: "brillante-vf", sans-serif;
  font-variation-settings:
    "wght" 827,
    "wdth" 125;
}

.font-4 {
  font-family: swiss-721-bt-extended, sans-serif;
  font-weight: 700;
}

.gallery {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 25vh;
  margin-bottom: 35vh;
}

.gallery__item-wrap {
  width: 100%;
  max-width: var(--item-width);
  perspective: 900px;
  margin-bottom: -5rem;
}

.demo-3 .gallery__item-wrap {
  margin-bottom: -7rem;
}

.demo-4 .gallery__item-wrap {
  margin-bottom: 5rem;
}

.demo-5 .gallery__item-wrap {
  margin-bottom: -10rem;
}

.demo-6 .gallery__item-wrap {
  perspective: 1400px;
  margin-bottom: 2rem;
}

.demo-7 .gallery__item-wrap {
  margin-bottom: 3rem;
}

.demo-8 .gallery__item-wrap {
  margin-bottom: 14rem;
}

.demo-10 .gallery__item-wrap {
  margin-bottom: 4rem;
}

.demo-11 .gallery__item-wrap,
.demo-12 .gallery__item-wrap {
  margin-bottom: 6rem;
}

.demo-13 .gallery__item-wrap,
.demo-14 .gallery__item-wrap {
  margin-bottom: 4rem;
}

.demo-15 .gallery__item-wrap {
  margin-bottom: 1rem;
}

.demo-9 .gallery__item-wrap {
  margin-bottom: 2rem;
}

.gallery__item {
  width: 100%;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  will-change: transform;
  border-radius: var(--item-br);
  aspect-ratio: var(--item-ar);
}

.demo-3 .gallery__item,
.demo-4 .gallery__item,
.demo-5 .gallery__item,
.demo-6 .gallery__item {
  will-change: transform, filter;
}

.demo-6 .gallery__item {
  backface-visibility: hidden;
}

.webgl {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.gallery--webgl .gallery__item {
  visibility: hidden;
  will-change: auto;
}

/* Buttons occupy the original demo's picture planes and frame link slots. */
.gallery__item {
  display: block;
  padding: 0;
  border: 0;
  background-color: transparent;
  cursor: pointer;
}
.gallery__item:focus-visible, .frame button:focus-visible {
  outline: 2px solid var(--color-link);
  outline-offset: 3px;
}
.mark { pointer-events: none; }
.frame button {
  appearance: none;
  margin: 0;
  border: 0;
  background: transparent;
  padding: 0;
  color: var(--color-link);
  font: inherit;
  text-align: inherit;
  cursor: pointer;
}
.frame button:is(:hover, [aria-current="true"], [aria-pressed="true"]) {
  color: var(--color-text);
}

/* Leave the right side of the stage free for the currently screened film. */
.gallery {
  width: 67%;
  z-index: 2;
}
.gallery__item-wrap { max-width: min(var(--item-width), 49vw); }
.mark {
  width: 67%;
  z-index: 0;
}
.film-note {
  position: fixed;
  left: 70%;
  right: 5%;
  top: 50%;
  transform: translateY(-50%);
  z-index: 1001;
  font-family: "swiss-721-bt", "Helvetica Neue", "PingFang SC", sans-serif;
}
.film-note__meta {
  margin: 0 0 1.5rem;
  font-size: 1.1rem;
  line-height: 1.5;
  letter-spacing: .03em;
  color: var(--color-link);
}
.film-note h2 {
  margin: 0;
  color: var(--color-text);
  font-size: clamp(30px, 3.4vw, 62px);
  line-height: 1.12;
  letter-spacing: -.04em;
  font-weight: 560;
  text-wrap: balance;
}
.film-note__summary {
  margin: 1.6rem 0 2.3rem;
  max-width: 30em;
  font-size: clamp(14px, 1.1vw, 18px);
  color: #c2c0b9;
  line-height: 1.7;
  text-wrap: pretty;
}
.film-note__open {
  display: inline-flex;
  justify-content: space-between;
  align-items: center;
  gap: 1.8rem;
  padding: .45rem 0;
  font: inherit;
  font-size: 1.35rem;
  color: var(--color-link);
  border: 0;
  background: none;
  border-bottom: 1px solid currentColor;
  cursor: pointer;
}
.film-note__open span:last-child { transition: transform 160ms ease; }
.film-note__open:hover span:last-child { transform: translate(2px,-2px); }
.film-note__open:focus-visible { outline: 2px solid var(--color-link); outline-offset: 5px; }
@media (max-width: 740px) {
  .gallery { width: 100%; margin-bottom: 62vh; }
  .gallery__item-wrap { max-width: min(94vw, var(--item-width)); }
  .mark { width: 100%; top: 42%; }
  .film-note {
    inset: auto 0 0;
    transform: none;
    padding: 16px max(20px, 5vw) max(18px, env(safe-area-inset-bottom));
    background: #0b0b0b;
    border-top: 1px solid #37342b;
    max-height: 40svh;
    overflow: auto;
  }
  .film-note__meta { margin-bottom: .55rem; font-size: 1rem; }
  .film-note h2 { font-size: clamp(22px, 6vw, 32px); }
  .film-note__summary { font-size: 13px; line-height: 1.4; margin: .7rem 0; }
  .film-note__open { font-size: 13px; padding: .4rem 0; }
}
@media (prefers-reduced-motion: reduce) {
  .film-note__open span:last-child { transition: none; }
}
.frame__links { align-items: flex-start; }
@media (min-width: 741px) {
  .gallery { margin-top: max(25vh, calc(50svh - min(192.86px, 15.75vw))); }
}
@media (max-width: 740px) {
  main { overflow-x: clip; }
  .gallery { margin-top: 10svh; }
}

dialog.case-reader {
  --rd-ink: #f2f1e9; --rd-muted: #b4b7ad; --rd-rule: #40433b;
  box-sizing: border-box; width: min(790px, 92vw); max-width: none;
  max-height: min(88dvh, 900px); margin: auto; padding: 0;
  border: 1px solid #56594e; border-radius: 7px;
  background: #171915; color: var(--rd-ink); color-scheme: dark;
  overflow-y: auto; overscroll-behavior: contain;
  text-align: left; font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif;
}
.case-reader::backdrop { background: #080a07bf; backdrop-filter: blur(8px); }
.case-reader *, .case-reader *::before, .case-reader *::after { box-sizing: border-box; }
.case-reader button, .case-reader input, .case-reader a { font: inherit; }
.case-reader button { cursor: pointer; color: inherit; }
.case-reader :is(button, a, input):focus-visible { outline: 2px solid #d8e6a9; outline-offset: 2px; }
.case-reader .rd-root { padding: clamp(18px, 3.5vw, 34px); }
.case-reader .rd-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.case-reader .rd-heading, .case-reader .rd-case-title {
  margin: 0; font-size: clamp(27px, 4vw, 46px); line-height: 1.14;
  font-weight: 540; letter-spacing: -.055em; color: var(--rd-ink);
}
.case-reader .rd-close { flex: none; display: grid; place-content: center; width: 37px; height: 37px; border: 1px solid #565a50; background: transparent; border-radius: 50%; font: 24px/1 Arial; }
.case-reader .rd-close:hover, .case-reader .rd-filter:hover { background-color: #34382e; }
.case-reader .rd-tools { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin: 28px 0 15px; }
.case-reader .rd-filters { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.case-reader .rd-filter { border: 1px solid #53564b; border-radius: 30px; background: transparent; color: var(--rd-muted); padding: 6px 13px; font-size: 13px; }
.case-reader .rd-filter[aria-pressed="true"] { background: #e8ebe0; color: #181a15; border-color: #e8ebe0; }
.case-reader .rd-search { min-width: 0; width: min(190px, 100%); max-width: 100%; border-radius: 0; background: transparent; color: var(--rd-ink); border: none; border-bottom: 1px solid #63665a; padding: 7px 2px; font-size: 13px; }
.case-reader .rd-search::placeholder { color: #a8ad9e; }
.case-reader .rd-count { color: var(--rd-muted); font-size: 12px; line-height: 1.45; margin: 0 0 7px; }
.case-reader .rd-row {
  display: grid; grid-template-columns: clamp(70px, 9vw, 114px) minmax(0, 1fr) auto 20px;
  width: 100%; gap: 16px; align-items: center; padding: 11px 0;
  background: transparent; border: none; border-top: 1px solid var(--rd-rule); border-radius: 0;
  text-align: left; transition: background-color .15s;
}
.case-reader .rd-row:hover { background: #24271f; }
.case-reader .rd-still { width: 100%; aspect-ratio: 16 / 9; height: auto; object-fit: cover; }
.case-reader .rd-entry strong, .case-reader .rd-entry small { display: block; }
.case-reader .rd-entry strong { font-size: clamp(15px, 1.7vw, 21px); font-weight: 530; line-height: 1.3; letter-spacing: -.025em; }
.case-reader .rd-entry small, .case-reader .rd-kind, .case-reader .rd-meta { font-size: 12px; color: var(--rd-muted); line-height: 1.4; }
.case-reader .rd-entry small { margin: 3px 0 0; }
.case-reader .rd-arrow { color: var(--rd-muted); text-align: right; }
.case-reader .rd-empty { padding: 12px 0 30px; color: var(--rd-muted); }
.case-reader .rd-actions { display: flex; align-items: center; gap: 14px; }
.case-reader .rd-back { border: none; background: transparent; padding: 7px 0; font-size: 12px; }
.case-reader .rd-meta { max-width: 60%; }
.case-reader .rd-case-title { margin: 20px 0 18px; }
.case-reader .rd-media { display: block; width: 100%; max-height: 52dvh; aspect-ratio: 16 / 9; object-fit: contain; background: #090b08; }
.case-reader .rd-copy { display: flex; align-items: start; justify-content: space-between; gap: 24px; margin: 20px 0 1px; }
.case-reader .rd-summary { flex: 1; margin: 0; color: #d3d6ca; font-size: 15px; line-height: 1.65; }
.case-reader .rd-link { border: 0; background: transparent; padding: 0; color: var(--rd-ink); white-space: nowrap; font-size: 13px; line-height: 1.7; text-decoration: underline; text-underline-offset: 4px; }
.case-reader .rd-clips-link { white-space: normal; }
@media(max-width:600px) {
  dialog.case-reader { width: calc(100vw - 20px); max-height: 92dvh; }
  .case-reader .rd-tools { gap: 13px; margin-top: 21px; }
  .case-reader .rd-search { width: 100%; }
  .case-reader .rd-filters { gap: 4px; }
  .case-reader .rd-filter { padding: 5px 10px; }
  .case-reader .rd-row { grid-template-columns: 76px minmax(0, 1fr) 14px; gap: 10px; padding: 9px 0; }
  .case-reader .rd-kind { display: none; }
  .case-reader .rd-copy { display: grid; gap: 13px; }
  .case-reader .rd-close { width: 34px; height: 34px; }
}

.archive-timeline {
  --archive-accent: #e1d6a6;
  --axis-x: 10px;
  --archive-step: min(2.85svh, 29px, calc(64svh / var(--archive-slots,15)));
  position: fixed;
  inset: 50% auto auto var(--timeline-left, 2vw);
  transform: translateY(-50%);
  width: 22px;
  z-index: 1100;
  font: 500 11px/1.25 "Helvetica Neue", Arial, "PingFang SC", sans-serif;
  color: #f3f1e7;
  pointer-events: none;
}
.archive-timeline[hidden], .archive-timeline [hidden] { display: none; }
.archive-timeline__track {
  display: grid;
  position: relative;
  grid-template-columns: minmax(0, 1fr);
  grid-auto-rows: var(--archive-step);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: auto;
}
.archive-timeline__track::before {
  content: "";
  position: absolute;
  top: calc(var(--archive-step) / 2);
  bottom: calc(var(--archive-step) / 2);
  left: var(--axis-x);
  width: 1px;
  background: #dedbcc42;
  transform: translateX(-50%);
  pointer-events: none;
}
.archive-timeline .archive-timeline__dot, .archive-timeline__period {
  position: relative;
  display: flex;
  align-items: center;
  margin: 0;
  border: 0;
  padding: 0;
  width: 100%;
}
.archive-timeline .archive-timeline__dot {
  background: transparent;

<script>gsap.registerPlugin(ScrollTrigger);

let lenis;
let items = [];
let wraps = [];
const marqueeInner = document.querySelector('.mark > .mark__inner'); // Select the inner element of the marquee
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const preloadImages = (selector) => {
  return Promise.all(
    gsap.utils.toArray(selector).map((item) => {
      const image = new Image();
      image.src = item.style.backgroundImage.match(/url\(["']?(.*?)["']?\)/)[1];
      return image.decode().catch(() => {}); // A broken image never blocks the page
    })
  );
};

// --------------------------------
// Smooth Scrolling
// --------------------------------

function initSmoothScrolling() {
  lenis = new Lenis();

  lenis.on('scroll', ScrollTrigger.update);

  gsap.ticker.add((time) => {
    lenis.raf(time * 1000);
  });

  gsap.ticker.lagSmoothing(0);
}

// --------------------------------
// Gallery Structure
// --------------------------------

function createGalleryWrappers() {
  items = gsap.utils.toArray('.gallery__item');

  items.forEach((item) => {
    const wrapper = document.createElement('div');
    wrapper.classList.add('gallery__item-wrap');

    item.parentNode.insertBefore(wrapper, item);
    wrapper.appendChild(item);
  });

  wraps = gsap.utils.toArray('.gallery__item-wrap');
}

// --------------------------------
// Gallery Layout
// --------------------------------

function positionGalleryItems() {
  // Maximum horizontal displacement, capped so items stay on screen.
  const stageWidth = document.querySelector('.gallery').clientWidth;
  const freeSpace = Math.max(0, (stageWidth - wraps[0].offsetWidth) / 2 - 8);
  const amplitude = Math.min(stageWidth * 0.2, freeSpace);

  wraps.forEach((wrap, i) => {
    const angle = i * 0.45;

    // Offset each item using a sine wave.
    // The result is a flowing left/right distribution.
    gsap.set(wrap, {
      x: Math.sin(angle) * amplitude,
    });
  });
}

// --------------------------------
// Gallery Animation
// --------------------------------

function initGalleryAnimation() {
  items.forEach((item) => {
    // Give each item a unique starting orientation.
    const rotationX = gsap.utils.random(70, 120);
    const rotationY = gsap.utils.random(-20, 20);
    const rotationZ = gsap.utils.random(-20, 20);
    const setZ = gsap.quickSetter(item, 'z', 'px');

    gsap.fromTo(
      item,
      {
        rotationX,
        rotationY,
        rotationZ,
      },
      {
        rotationX: -rotationX,
        rotationY: -rotationY,
        rotationZ: -rotationZ,
        ease: 'none',
        scrollTrigger: {
          trigger: item,
          start: 'top bottom+=20%',
          end: 'bottom top-=20%',
          scrub: true,
          invalidateOnRefresh: true,
          onUpdate(self) {
            const progress = self.progress;
            const z = Math.sin(progress * Math.PI) * -50;
            setZ(z);
          },
        },
      }
    );
  });
}

// --------------------------------
// Marquee Animation
// --------------------------------
const animateMarquee = () => {
  gsap
    .timeline({
      scrollTrigger: {
        trigger: document.querySelector('.gallery'),
        start: 'top bottom',
        end: 'bottom top',
        scrub: true,
        invalidateOnRefresh: true,
      },
    })
    .fromTo(
      marqueeInner,
      {
        x: '100vw',
      },
      {
        x: '-100%',
        ease: 'none',
      }
    );
};

// --------------------------------
// Events
// --------------------------------

function initEvents() {
  window.addEventListener('resize', positionGalleryItems);
}

// ------------------------------------------------------------
// INITIALIZATION
// ------------------------------------------------------------

function init() {
  createGalleryWrappers();
  positionGalleryItems();

  initEvents();

  // Keep native scrolling and flat images when reduced motion is preferred.
  if (reduceMotion) {document.dispatchEvent(new Event('galleryready'));return;}

  initSmoothScrolling();
  initGalleryAnimation();
  document.dispatchEvent(new Event('galleryready'));
}

document.addEventListener('DOMContentLoaded', async () => {
  await preloadImages('.gallery__item');
  document.body.classList.remove('loading');
  init();
});
</script>

ests."],"industries":[1],"poster":"media/e3aa0f572dfb79829cf4f8d6b65e7c0647eaf9269715c42fdd64aaec3cf7054a.jpg","video":"media/e942c3608bbd7043fc4aca10fed0a463fa3a75aecaeea2e6d460b1cc92be4c03.mp4","source":"https://bytedance.larkoffice.com/wiki/GVcDwHdYYiPnwGkdvnXc2UdKnt5","overview":["Jon Erwin 的剧组用实拍锁定表演，再为火光、地点和特技动作构建数字画面。","Jon Erwin’s crew anchored shots in recorded performances, then built digital firelight, locations and action around them."],"audience":"internal","number":10,"clip":["日景转夜与火焰测试","Day-for-night and fire test"]},"buwen":{"title":["不问凡尘","Buwen Fanchen"],"team":["朝夕光年","Nuverse"],"kind":["互动影游 · 开放世界","Interactive · Open world"],"line":["朝夕光年将生成的视频接入游戏状态机，让角色待机、战斗和互动演出响应玩家的操作。","Nuverse connects generated video to game states so idle poses, combat and interactive performances can respond to the player."],"industries":[3],"poster":"media/95818b62f9953b9f624937e086fc88cf5881ee4a16ea4a2715b8ecbd1ad3587a.jpg","video":"media/9c78166b621f3b12b8de5328f6e89a7692ae7d5fe23a8321712cda56cff48cf7.mp4","source":"https://bytedance.larkoffice.com/wiki/Aw2OwfbgGirOrukuw50cFUYxnWf","overview":["《不问凡尘》是朝夕光年基于自研 Realm 引擎与 Seedance 构建的超写实修仙互动游戏。它把生成的视频切片接入状态机，将角色、战斗、剧情和环境组织成可以响应玩家操作的内容。","Buwen Fanchen is a photoreal xianxia interactive game built by Nuverse using its Realm engine and Seedance. Generated video slices feed into a state machine, connecting characters, combat, narrative and environments with player input."],"audience":"internal","number":9,"clip":["《不问凡尘》官方预告选段","Buwen Fanchen official trailer excerpt"],"mediaKind":["官方游戏预告","Official game trailer"]},"seen":{"title":["把导演意图带入影视制作","From director’s intent to production"],"team":["SEEN","SEEN"],"kind":["影视 · 导演意图","Film & TV · Creative direction"],"line":["SEEN 用动画预告与场景制作案例，讨论怎样把导演对镜头、光线和表演的判断延续到整场戏。","SEEN uses an animated teaser and production examples to explore how a director’s choices of framing, light and performance carry across a scene."],"industries":[1],"poster":"media/56882359515973f804b2404e5a3a58381356e270af716150b3b0faae8c93da8a.jpg","video":"","source":"https://bytedance.larkoffice.com/wiki/XlwUw4jGJiiNpfknnP8c5vy7nee","watchSource":"https://bytedance.larkoffice.com/wiki/XlwUw4jGJiiNpfknnP8c5vy7nee#DxysdXKAHofYN9xKfhycoIuAnFg","overview":["SEEN 把导演的决定带进三个不同的项目：吕克·贝松的动画长片《The Furious Five》、Gaumont 的历史汽车工厂视效研发，以及《法国好声音》的节目舞台演示。每次换场或换机位，都有已经确定的东西需要保留下来。","SEEN carries creative decisions across three projects: Luc Besson’s animated feature The Furious Five, historical factory R&D with Gaumont and a stage demonstration for The Voice France. Each change of scene or camera angle has to carry earlier decisions forward."],"audience":"internal","number":2},"chapter41":{"title":["预演与实拍的片场反馈","Previs and live action on set"],"team":["Chapter41","Chapter41"],"kind":["影视 · 片场预演","Film & TV · On-set previs"],"line":["从《Volcano High》预告和实拍对照，看 Chapter41 如何在拍摄现场预演尚未完成的世界。","The Volcano High teaser and side-by-side comparisons show how Chapter41 previews an unfinished world on set."],"industries":[1],"poster":"media/8d30347dc41abc4c337f787419a131790dfd66b5c2725e9c66831e37e6683839.jpg","video":"","source":"https://bytedance.larkoffice.com/wiki/RQ23w900XienU2kHuCycdPNMngc","overview":["《Volcano High》把一出舞台剧搬进不断变形的校园。演员和摄影机走过真实的房间，Chapter41 再用 Seedance 2.5 等模型重新布置人物身边的世界。","Volcano High takes a stage play into a school that keeps changing shape. The actors and camera move through real rooms. Chapter41 uses models including Seedance 2.5 to rebuild the world around them."],"audience":"external","number":8},"wpp":{"title":["广告中的数字产品孪生","Digital product twins in advertising"],"team":["WPP","WPP"],"kind":["广告 · 数字产品孪生","Advertising · Product twins"],"line":["WPP 从包装颜色、车型和材质出发，讨论数字产品孪生怎样在场景改变时保留品牌细节。","WPP uses packaging colors, car models and materials to show how a digital product twin can preserve brand details as a scene changes."],"industries":[2],"poster":"media/3b0f261b43d7b944e9c60228cc6d69b20f33fa9c89ee817ad68aeee780075871.jpg","video":"media/e9102b80e4fbc65dd92e4147df5e398e777366f803bf466e4f9bade31b90c681.mp4","source":"https://bytedance.larkoffice.com/wiki/GlyvwMfAViOQEEkFWuUcjwEUnkh","overview":["WPP 从一支超宽幅沙漠影片出发，展示品牌广告怎样在一条时间线上组合生成环境、候选镜头和准确的产品资产。猫头鹰与猎豹是供剪辑选择的素材，车辆则有可重复调用的数字产品孪生。","WPP uses a panoramic desert film to show how generated environments, candidate shots and precise product assets can meet on one edit timeline. Owl and cheetah shots are available for the edit; the vehicle has a reusable digital product twin."],"audience":"internal","number":4,"clip":["宽幅沙漠广告：猎豹候选镜头","Desert campaign: cheetah shot study"]},"brandtech":{"title":["品牌创意的实时制作","Real-time creative production"],"team":["Brandtech","Brandtech"],"kind":["广告 · 品牌创意","Advertising · Brand creative"],"line":["Brandtech 用品牌影片与威士忌广告的制作对照，讨论如何在拍摄前测试创意方向。","Brandtech uses brand films and two treatments of a whisky commercial to explore how concepts can be tested ahead of a shoot."],"industries":[2],"poster":"media/aa1df79c9ba11f5fa510342278b077dd276e0eb8d2bdf1b3ca40250c2736bdd1.jpg","video":"media/acc778e8feef8fe8fd2313311d59d076cef2eaffeb0ed05d8378675b86402ec2.mp4","source":"https://bytedance.larkoffice.com/wiki/RrJYwDPjCieQdTkFmWuc6qoZnae","overview":["Brandtech 将 Seedance 放进品牌广告的创意验证和制作迭代：先确定品牌要讲什么，再用动态影像比较方向、吸收反馈。","Brandtech uses Seedance to test and iterate brand advertising: establish the brand story first, then compare creative directions through moving images and feedback."],"audience":"internal","number":1,"clip":["黑白群像广告选段","Black-and-white ensemble spot"]},"publicis":{"title":["从主片到多市场版本","From master film to market versions"],"team":["Publicis","Publicis"],"kind":["广告 · 多版本制作","Advertising · Versioning"],"line":["Publicis 从广告成片回看制作现场，拆解视频 AI 如何参与一支广告的制作与版本变化。","Publicis works back from a finished commercial to examine where video AI contributes to production and alternate versions."],"industries":[2],"poster":"media/56ef12b30c73b5881e7548fa6960508c330e081f5c123c8a4f8c898958cf71f8.jpg","video":"media/e4ad4b7205abed548551d6669c9d5cae3a336377a4476b2e31225a1505fbada8.mp4","source":"https://bytedance.larkoffice.com/wiki/H7hfwNQJQisYAfkEbvBc4nOHnEb","overview":["Publicis Production 以一支已经投放的梅西品牌广告为例，说明如何把 AI 放进原有制片流程。竖屏影片从社区球场走向街巷，再进入超现实的足球画面；同一个创意要能经得起拍摄、后期和跨市场改版。","Publicis Production describes its work on a released brand commercial featuring Lionel Messi. The supplied vertical film moves from a neighbourhood pitch into city streets and surreal football imagery. A single creative idea has to survive the shoot, finishing and adaptation for other markets."],"audience":"internal","number":3,"clip":["足球广告竖屏选段","Vertical football spot"]}}</script>

<script type="application/json" id="story-data">[{"id":"window","tags":["environment","consistency"],"section":"editing","title":{"zh":"车窗换景，保住前景关系。","en":"A new view, the same foreground."},"summary":{"zh":"在实拍车窗后替换环境，人物与车体仍然留在原来的空间关系里。","en":"Replace the environment beyond a live-action car window while retaining the relationship between performer and vehicle."},"note":{"zh":"人物边缘、车窗遮挡与背景视角。","en":"Performer edges, window occlusion and background perspective."},"video":"media/01aae1a7976477933cf8aaf654f0303c0261bb13af4c30e7070be698a91d9237.mp4","poster":"media/69fd83fe28f8deb6e4157254dfa3d05694e6756c0c9b96473c39b1af494848dd.jpg"},{"id":"interior","tags":["environment"],"section":"editing","title":{"zh":"把窗外，接进室内。","en":"Bring the outside into the scene."},"summary":{"zh":"室内窗景与城市背景的前后对照，展示环境变化如何接上已有机位。","en":"A before-and-after comparison of an interior window view and city background shows how a new environment fits an existing camera angle."},"note":{"zh":"窗框、室内前景与远处建筑的透视。","en":"Window frames, interior foreground and the perspective of distant buildings."},"video":"media/a805b3b3bddcd92530a9fcb5aabefa811e9cbbe339e3c76715b8c1c8f78704c9.mp4","poster":"media/e1f563854690bafdfbdffcd80b340bace0da73dea92607ab1108bb6450bd187d.jpg"},{"id":"terrain","tags":["extension","consistency"],"section":"editing","title":{"zh":"从脚下的地面，延伸到远方。","en":"Extend the location beyond the frame."},"summary":{"zh":"保留实拍人物与近景地形，在远处补出荒漠地貌与更深的空间。","en":"Keep the live-action performers and near terrain, extending the landscape into a deeper desert environment."},"note":{"zh":"脚下接触面、远近层次与地平线。","en":"Ground contact, depth layers and the horizon."},"video":"media/f83bfca8cfdda5dacee1ca59877432d2bd44aa154c2a178a27e987c669c1e2f7.mp4","poster":"media/ce3120dfa814ac2e9b9221efc001dc78908ae613d5800108edfd271d8f07ff32.jpg"},{"id":"fire","tags":["atmosphere","consistency"],"section":"editing","title":{"zh":"同一段表演，另一种氛围。","en":"One performance. A different atmosphere."},"summary":{"zh":"沿用篝火场景里的实拍表演，调整天空与环境光，让人物融入新的时间感。","en":"Retain the live-action performance in a campfire scene while changing the sky and ambient light to establish a new time of day."},"note":{"zh":"天空色彩、脸部亮度与火光的关系。","en":"Sky colour, facial exposure and the relationship to firelight."},"video":"media/beaa0ec883b59055b8869af0edac5907ac32dfd54ba04e9bc5a5620237e1e226.mp4","poster":"media/98d23e0dbe7eaae56b1114626cfae9dfcf248f5b8c366b1384e5e678babe28b4.jpg"},{"id":"screen","tags":["screen","atmosphere"],"section":"editing","title":{"zh":"屏幕里的晚霞，也在此刻。","en":"The sunset on screen belongs to this moment."},"summary":{"zh":"车内手机画面的替换，让屏幕中的景色与人物所处环境呼应。","en":"Replace the phone display inside a car so the image on screen corresponds with the character’s surroundings."},"note":{"zh":"手机边缘、反光，以及屏幕与窗外的时间感。","en":"Phone edges, reflections and the time of day on screen and outside."},"video":"media/963b7e91e7cbfc735d167782034aa7fa0cab3fa0d0d3cad5719d780d45430018.mp4","poster":"media/12fb86fea5c6b60c27254f0984b90480f2984c34ea5368a2edfe06dc64eda42a.jpg"},{"id":"wardrobe","tags":["wardrobe","consistency"],"section":"editing","title":{"zh":"调整造型，保留表演。","en":"Change the wardrobe. Preserve the performance."},"summary":{"zh":"材料附例中，同一条厨房戏的深色上衣换成浅灰色针织衫，围裙、手部动作、灶台摆件和机位延续。","en":"In an additional example included in the material, a dark top becomes a light-grey knit while the apron, hand movements, kitchen props and camera angle carry through."},"note":{"zh":"上衣接缝、围裙边缘和手臂运动的连续性。","en":"Garment seams, apron edges and continuity of arm movement."},"video":"media/26aa669e6069936c0ad5eba3e648a56a153e125fe3986a9810b78ea7cb9088aa.mp4","poster":"media/3f6380c072c2e56de4ae1e139b55dc1489736818ff3a2c54d04f677ba9e02a23.jpg"},{"id":"clouds","tags":["shot-generation","atmosphere"],"section":"generation","title":{"zh":"把难等的云海，变成可设计的镜头。","en":"Turn an elusive cloudscape into a designed shot."},"summary":{"zh":"用参考图与提示词控制云海、山体、光线与色调，以山脊和云层建立空间，再用日出暖光交代清晨。","en":"Guide the clouds, mountains, lighting and colour with reference images and prompts. Mountain ridges establish the space, while warm sunrise light establishes morning."},"note":{"zh":"山脊露出的比例、雾中层次与日出方向。","en":"The visible mountain ridges, layers in the mist and the direction of sunrise."},"video":"media/06aa06bb0de765ecd714b139e24bb0a6fa336605b3645105709f2f313ab7ca85.mp4","poster":"media/01f4eb1e7c92abf88f7d823ff3e9f96aad99631e8d88322dbbacc5f97f27a126.jpg"},{"id":"rock","tags":["shot-generation","extension","consistency"],"section":"generation","title":{"zh":"人物与岩台留住，远景重新展开。","en":"Keep the performer. Open up the distance."},"summary":{"zh":"对照岩台镜头的底片与成片，人物与岩台保留，远处的雾底变成更有层次的云海。","en":"Compare the original and finished rock-platform shot. The performer and platform remain, while distant mist becomes a layered sea of clouds."},"note":{"zh":"岩台边缘、云层高度与人物的空间关系。","en":"Platform edges, cloud height and the performer’s relationship to the space."},"video":"media/8f29ec12835fe72a088553e33e4c9ce8afc0d04da729c7734a031352e8f15980.mp4","poster":"media/9a30eea780a3ed19347b6d6b7147eee127d86680fad3a2c75c7b8f14f678232e.jpg"},{"id":"debris","tags":["shot-generation","atmosphere"],"section":"generation","title":{"zh":"高风险场面，在画面里完成。","en":"Create the hazardous moment in the image."},"summary":{"zh":"泥石流与雨夜行车片段，展示难以在现场控制的效果如何与实拍段落衔接。","en":"A debris flow and rainy-night driving sequence shows how effects that are difficult to control on set can connect with live action."},"note":{"zh":"运动方向、速度、重量感与前后镜头衔接。","en":"Direction, speed, weight and continuity with adjacent shots."},"video":"media/648ffffd6ac6fd323b374351d7ea55942f74ff421fe7bc28648887e6c5f1e265.mp4","poster":"media/be673410bb4491a621d088c7e9d69c154f8a29050273f35742f254b33d6266c6.jpg"}]</script>
<script type="application/json" id="article-data">{"david":{"key":"david","overview":["Jon Erwin 的剧组用实拍锁定表演，再为火光、地点和特技动作构建数字画面。","Jon Erwin’s crew anchored shots in recorded performances, then built digital firelight, locations and action around them."],"intro":["火把举到演员面前，灯光应该落在哪里？为什么排练场拍到的一次落地还要在外景重做？《House of David》的几段原始测试，把混合制作拆成了可观察的片场选择。","Where should the light fall when an actor raises a torch? Why repeat a landing on location when the rehearsal captured it? The production tests for House of David let us examine those decisions shot by shot."],"metrics":[{"value":"73 → 212","label":["前两季 AI 镜头数","AI shots in seasons one and two"],"note":["约数，来自剧组案例。","Approximate counts reported in the production case."],"source":"https://bytedance.larkoffice.com/wiki/GVcDwHdYYiPnwGkdvnXc2UdKnt5"},{"value":"~3,200","label":["第三季计划镜头数","Planned shots for season three"],"note":["剧组公布的计划量。","The team’s planning figure."],"source":"https://bytedance.larkoffice.com/wiki/GVcDwHdYYiPnwGkdvnXc2UdKnt5"},{"value":"10–12 → 1","label":["数字环境搭建周期（周）","Digital environment build time in weeks"],"note":["剧组在本案例中报告的变化。","Change reported for the workflow in this case."],"source":"https://bytedance.larkoffice.com/wiki/GVcDwHdYYiPnwGkdvnXc2UdKnt5"}],"sections":[{"id":"practical","layout":"wide","eyebrow":["拍摄条件","On location"],"title":["先拍下演员能真实完成的部分","Start with what the actor can do on set"],"summary":["希腊外景、城堡的开放时间和特技安全条件，决定了哪些画面必须换一种拍法。","Location rules, castle access and stunt safety determined which shots needed another approach."],"paragraphs":[["Jon Erwin 的团队在希腊搭了实体布景，也到真实城堡取景。实景能给演员明确的距离、方向和视线，却未必能按剧本的时间使用。旅游旺季难以返场，部分地点禁用明火，夜景能拍的时间也有限。","Jon Erwin’s team built physical sets in Greece and filmed at real castles. Those spaces gave performers distances, directions and sightlines they could act against. They also came with limits. A castle was difficult to revisit in peak season, some locations prohibited open flames, and night shoots had short windows."],["团队从已有拍摄条件出发拆镜头。演员的动作、时间点和摄影机位置先记录下来；之后才决定改变火光、移走棚景，还是把排练中的动作放进成片。","The crew broke down each shot around what it could capture. It recorded the action, timing and camera position before deciding whether to alter the firelight, replace a set or carry a rehearsal performance into a finished sequence."]],"points":[],"media":[{"token":"ImnebcKnyoerbexlW5OcMaSFnu4","kind":"video","caption":["导演介绍复杂拍摄条件与混合制作的关系。","Erwin introduces the production constraints behind the hybrid workflow."],"source":""}]},{"id":"fire","layout":"parallel","eyebrow":["外景火光","Firelight"],"title":["火把亮起时，人物也要被照亮","When the torch lights, the face has to change"],"summary":["将日景转成夜景，需要同时处理火焰、演员和周围环境。","Turning a day plate into a night shot meant changing the flame, the actor and the surroundings together."],"paragraphs":[["在允许用火的摄影棚，火焰会自然反射到皮肤和服装上。外景换成安全道具后，这些变化也一并消失。剧组保留演员持物、转身和行走的动作，再生成火焰及它投向附近表面的光。","On a stage that permits fire, light naturally spills onto skin and costumes. A safe prop on location removes those cues. The team retained the performer’s hand position, turn and walk, then added the flame and its illumination on nearby surfaces."],["对照片可以从脸开始看。人在白天拍摄的素材中原本受环境光照亮；转换之后，亮面要随着火把移动，衣服和墙面也得回应这处新光源。","Follow the face in the comparison. Daylight initially lights it from the surroundings. In the night version the highlights must respond to the moving torch. The fabric and the wall also need to pick up the new source."]],"points":[],"media":[{"token":"CaIzbWCueojC0dx3cz7ctyLznFc","kind":"video","caption":["现场火焰与日转夜测试，含实拍对照。","On-set flame and day-for-night test with the original plate."],"source":""},{"token":"KLYCbiY7OoVCLOx4zLQcU5OxnNb","kind":"image","caption":["同一动作在日光和模拟夜景中的对照。","The same action under daylight and simulated night lighting."],"source":"https://feishu.cn/file/KLYCbiY7OoVCLOx4zLQcU5OxnNb"}]},{"id":"castle","layout":"split","eyebrow":["场景采集","Location capture"],"title":["把只能进一次的城堡留给后续镜头","Keep a castle available after the crew leaves"],"summary":["地点的几何和表面质感可以提前记录，表演则安排在可控空间完成。","The team could record a location’s form and surface detail before filming performances in a controlled space."],"paragraphs":[["团队在有机会进入城堡时做扫描，形成可重复调用的 Gaussian splats 场景。门洞的深浅、墙面的纹理、空间转折来自真实地点。演员在棚内完成的动作可以放回这一空间，供不同镜头使用。","During an available visit the team scanned a castle and built a reusable Gaussian splat scene. Recessed openings, wall textures and changes in depth came from the location itself. Performances filmed on stage could subsequently be placed in that space for more than one shot."],["这样安排也改变了返场的含义。补一处构图时，团队先检查已有扫描和演员实拍能否满足镜头，再决定是否值得重新申请外景。","This changed the decision about returning to location. For another composition, the crew could first examine what the existing scan and performance plates would support before arranging another visit."]],"points":[],"media":[{"token":"OypfbomgwoXzY8xfLircftntn3d","kind":"video","caption":["真实地点的 Gaussian splats 空间演示。","Gaussian splat demonstration of a scanned real location."],"source":""}]},{"id":"stunts","layout":"split","eyebrow":["动作场面","Action"],"title":["让保护场地上的排练进入正式制作","Carry a rehearsal performance into the action sequence"],"summary":["特技团队已经在预演中解决了速度、着地点和摄影机位置。","The stunt team had already worked out speed, landing positions and camera placement in rehearsal."],"paragraphs":[["传统预演拍到了这些选择，但演员还要穿上正式服装，到外景把动作再做一遍。这次团队在有保护的排练环境里，从多个角度记录同一次表演，再把角色、服装、道具和场景整合到动作中。部分预演由此成为正式动作段落的素材。","A conventional stunt rehearsal records those decisions, then asks the performers to repeat the action on location in costume. Here, multiple views captured the same performance in a protected rehearsal space. The team integrated the character, costume, props and setting around the action, using selected rehearsal material in the finished sequences."]],"points":[],"media":[{"token":"S8anbjf3koBtfDxGUmCcixV7nGd","kind":"video","caption":["特技预演与正式动作场面的制作示例。","Stunt visualization example used in the production of an action sequence."],"source":""}]},{"id":"performance","layout":"parallel","eyebrow":["表演采集","Performance capture"],"title":["一个主机位，最多九个参考视角","One principal camera and up to nine reference views"],"summary":["主机位记录导演挑选的画面，辅助视角补足同一时刻的脸部与身体信息。","The principal camera held the director’s intended shot. Reference cameras recorded the same instant from other angles."],"paragraphs":[["多视角立体表演采集让演员在没有传统动捕服的情况下完成表演。团队用多个视角把同一段真人动作映射到虚拟人物与环境中。即使用数字方式更换一套服装，转头的时机和嘴角微小的动作仍有具体的实拍依据。","Volumetric performance capture let actors work without a traditional motion-capture suit. The crew mapped multiple views of the performance to a virtual character and environment. Even after a costume change, the timing of a head turn or a small movement at the mouth could be checked against the recording."],["原文把近景测试和采集演示并列。前者适合对照眼神、口型和停顿，后者解释为了保留这些细节，现场实际记录了什么。","The close-up test and the capture demonstration answer different questions. The first lets the viewer compare gaze, lip movement and pauses. The second shows what had to be recorded on set to retain those details."]],"points":[],"media":[{"token":"X9QEbQSlZof31zxAKG5cekCSnOg","kind":"video","caption":["近景实测，观察眼神、口型与微表情。","Close-up test for gaze, lip movement and subtle expression."],"source":""},{"token":"Ejm6bI24Eo3DYyx6s7ZcyiYAnWg","kind":"video","caption":["多视角立体表演采集演示。","Demonstration of volumetric performance capture."],"source":""}]},{"id":"onset","layout":"wide","eyebrow":["片场决策","On-set decisions"],"title":["拍完这一条，就能讨论它会怎样进入数字场景","Review the digital setting while the shot is still on set"],"summary":["第三季把部分数字画面制作向主摄影阶段提前。","For season three, part of the digital work moved into principal photography."],"paragraphs":[["演员在实体布景里走位，片场工作人员把刚拍下的画面放入数字场景。导演、摄影和美术因而可以提前讨论人物在画面中占多少空间、背景延展到哪里，以及下一条是否需要重拍。","Actors blocked their scenes on physical sets while operators placed the captured performance into a digital environment. Direction, camera and art departments could discuss how much space the actor occupied, where the environment extended and whether the next take needed an adjustment."],["原文记录的第一、二季相关镜头分别约为 73 个和 212 个。第三季提出约 3,200 个的计划，以及杀青时完成约九成特效工作的目标。后两个数字属于制作计划，两季已记录的数量才适合回看实际规模。","The case records about 73 AI shots for season one and 212 for season two. The team planned approximately 3,200 for season three and aimed to have about 90% of effects work completed by wrap. The last two figures describe production targets."]],"points":[],"media":[{"token":"OKzRbhl7eoHd5nxZELkcYcw1nGe","kind":"image","caption":["实体片场与现场数字工作位。","Production set and on-set digital workstations."],"source":"https://feishu.cn/file/OKzRbhl7eoHd5nxZELkcYcw1nGe"},{"token":"YoM2bgh8Kofw7mxPyuKc7WnYn1b","kind":"image","caption":["工作人员在监视器上组合与检查画面。","Operators assembling and reviewing imagery on the monitors."],"source":"https://feishu.cn/file/YoM2bgh8Kofw7mxPyuKc7WnYn1b"}]}],"takeaways":[{"title":["检查光有没有传过去","Check where the light travels"],"body":["验收火把镜头时，同时看火焰、持火者的脸和背景受光面。","Review the flame, the carrier’s face and illuminated surfaces in the same pass."]},{"title":["用实拍回看表演","Keep a performance reference"],"body":["转景和替换完成后，仍能回到原始表演核对停顿、视线与动作节奏。","After replacing a setting or costume, compare pauses, eyelines and movement against the original take."]}],"sources":[{"title":["深度案例｜House of David 混合制作案例 Seedance × 影视制作【🔒 仅内部】","Full case study on Feishu"],"url":"https://bytedance.larkoffice.com/wiki/GVcDwHdYYiPnwGkdvnXc2UdKnt5","type":"feishu"},{"title":["混合制作英文原始案例","Original English production case"],"url":"https://bytedance.larkoffice.com/wiki/KnSwwnVFWiHAm9kGDcHcKgjOnXg","type":"feishu"},{"title":["火山引擎导演采访图文","Volcano Engine interview with Jon Erwin"],"url":"https://mp.weixin.qq.com/s/0V_2WaCLpC_ZTqgSO2SKtQ","type":"pr"},{"title":["火山引擎导演采访视频","Volcano Engine video interview"],"url":"https://weixin.qq.com/sph/AZCbG99FWK","type":"pr"}],"questions":[],"evidence":["飞书原文第 2–5 节，第一、二季实际镜头规模，第三季目标，火焰、Gaussian splats、动作预演及面部测试的嵌入附件。"]},"wpp":{"key":"wpp","overview":["WPP 从一支超宽幅沙漠影片出发，展示品牌广告怎样在一条时间线上组合生成环境、候选镜头和准确的产品资产。猫头鹰与猎豹是供剪辑选择的素材，车辆则有可重复调用的数字产品孪生。","WPP uses a panoramic desert film to show how generated environments, candidate shots and precise product assets can meet on one edit timeline. Owl and cheetah shots are available for the edit; the vehicle has a reusable digital product twin."],"intro":["一只猎豹蹲在沙地上，宽到几乎没有尽头的地平线从它身后穿过。动物朝哪看、沙漠是什么颜色，可以在剪辑中试。等镜头对准一辆待售的车，车身比例、轮胎位置、漆面的反光都要有依据。","A cheetah sits against a horizon that runs almost the full width of the screen. The edit can explore the animal’s gaze and the colour of the desert. When the lens turns to a vehicle being sold, its proportions, wheel placement and paint reflections need a product reference."],"metrics":[{"value":"5:1","label":["沙漠样片画幅","Desert film aspect ratio"],"note":["按原文所附成片文件的 6720 × 1344 像素计算。","Calculated from the supplied finished film at 6,720 × 1,344 pixels."],"source":"https://bytedance.larkoffice.com/wiki/GlyvwMfAViOQEEkFWuUcjwEUnkh"},{"value":"6","label":["原文拆解的制作环节","Production stages documented"],"note":["覆盖简报、故事板、候选、剪辑、产品后期和版本迭代。","From the brief and storyboard through candidate generation, editing, product finishing and versioning."],"source":"https://bytedance.larkoffice.com/wiki/GlyvwMfAViOQEEkFWuUcjwEUnkh"}],"sections":[{"id":"desert","eyebrow":["宽幅样片","The panoramic film"],"title":["先看整张画布，再决定动物站在哪里","Composing for the whole width"],"summary":["成片和候选片段在原文中分开展示，一段候选可以很有吸引力，是否采用仍由剪辑决定。","The source presents the finished film and candidate shots separately. An appealing shot still has to earn its place in the edit."],"paragraphs":[["这支沙漠影片的画布宽约五倍于高。猎豹片段把动物留在近处，地平线持续铺向左右。把它裁成普通横屏能看清动物，却会失去原画幅的尺度。回看完整宽幅时，可以检查动物的轮廓、沙地和远山是否都能在同一眼里读清。","The desert film is roughly five times wider than it is high. In the cheetah study the animal sits close while the horizon stretches to either side. A conventional crop can show the animal, but changes the scale of the composition. Across the full width, look at whether its silhouette, the sand and the distant hills still read together."],["WPP 同时提供了猫头鹰和猎豹两条候选镜头。团队先把这些素材放入共享素材池，再和其他画面一起试顺序、试节奏。样片由人的选择、剪辑和后期组成。","WPP includes owl and cheetah studies. The team pools takes and tests them against neighbouring shots for order and pace. Human selection, editing and finishing give the film its form."]],"layout":"wide","points":[],"media":[{"token":"D1Qgb8qFLo1AMgxh5CmcaJu0nHb","kind":"video","caption":["沙漠样片的完整宽幅构图","Finished desert film in its original panoramic composition"],"source":""},{"token":"MqZvbosJqoaewUxQebicB2qPnlf","kind":"video","caption":["猎豹候选镜头，原文件为超宽幅","Cheetah shot study in its original panoramic format"],"source":""},{"token":"L1PDbUqd8o8Su6xWXzPcI3cynSh","kind":"video","caption":["同一项目的猫头鹰候选镜头","Owl shot study from the same project"],"source":""}]},{"id":"workflow","eyebrow":["制作流程","Production workflow"],"title":["让剪辑能回到同一批素材","Keep source shots available to the edit"],"summary":["WPP 把制作拆成六步。后面一次改版，可能重新用到前面的故事板和第一批候选。","WPP describes six stages. A later version can draw on the original boards and the first set of candidates."],"paragraphs":[["简报先规定场景、主体和叙事方向，故事板再安排镜头先后。Seedance 生成的候选镜头和其他拍摄素材被放在一起审核。进入剪辑后，团队可以换顺序或替换某一条素材，保留已经成立的节奏。","The brief establishes the setting, subject and narrative direction. The storyboard fixes an order. Seedance candidates are reviewed beside other production material. In the edit, the team can reorder shots or replace a take while preserving the timing that already works."],["产品镜头使用数字参照，配音和调色在后期统一处理。完成版重新进入素材池，下一次面向不同市场或格式改版时，团队仍能找到使用过的镜头、版本与产品资产。","Product shots use digital references, with voice-over and grading handled in finishing. The completed version returns to the pool, where the sources, versions and product assets remain available for a new market or format."]],"layout":"steps","points":[],"media":[{"token":"T7qcbEGAwop1TqxjCiicqx8InUh","kind":"image","caption":["WPP 原文中的广告制作流程图","Advertising workflow diagram from WPP’s case study"],"source":"https://feishu.cn/file/T7qcbEGAwop1TqxjCiicqx8InUh"}]},{"id":"twin","eyebrow":["产品资产","Product assets"],"title":["同一辆车，读两种图","Two views of the same vehicle"],"summary":["汽车渲染负责呈现成品的表面，数字产品孪生提供可复用的几何和材质参照。","The render shows the surface a viewer sees. The digital product twin gives production a reusable reference for geometry and materials."],"paragraphs":[["对照中，一辆 SUV 在沙石地面行驶。渲染图里要看金属、车漆、轮胎与地面的关系；线框视图则显出车身轮廓、车轮和座椅的位置。换背景、改灯光或推近摄影机时，制作团队可以回到同一件产品资产核对外形与比例。","An SUV crosses sandy ground in the comparison. The render shows metal, paint and tyre contact. The wireframe reveals body shape, wheel placement and seats. A team changing the backdrop, lighting or camera distance can return to the same asset to check shape and proportion."],["也要看车动起来之后发生什么。WPP 在汽车测试里遇到过车漆过亮、扬尘遗漏、驾驶员消失或太抢眼。团队提出希望进一步控制视频到视频的改动，并让后续工具读取 OpenUSD 资产。后者是需求，原文没有把它列为已交付能力。","Motion introduces further checks. WPP’s automotive tests encountered overly reflective paint, missing dust and drivers who disappeared or drew too much attention. The team requested finer video-to-video control and future support for OpenUSD assets. The latter is a requirement, not a delivered feature in the study."]],"layout":"parallel","points":[],"media":[{"token":"DuF7bA4JQody6Sxx3zYc0V8onRb","kind":"image","caption":["车辆渲染，观察漆面和地面接触","Vehicle render, showing paint and ground contact"],"source":"https://feishu.cn/file/DuF7bA4JQody6Sxx3zYc0V8onRb"},{"token":"BXdPbgdhToYMhpxFznGczr8XnLY","kind":"image","caption":["同款车辆的数字产品孪生线框","Digital product twin of the same vehicle in wireframe"],"source":"https://feishu.cn/file/BXdPbgdhToYMhpxFznGczr8XnLY"}]},{"id":"packaging","eyebrow":["品牌审核","Brand review"],"title":["一罐可乐和一盒牙膏怎样出错","Where a can and a carton go wrong"],"summary":["包装图通过单帧审核后，颜色、文字和透视仍可能在换镜头时发生变化。","An approved pack image can still acquire the wrong colour, lettering or perspective in a new shot."],"paragraphs":[["可口可乐相关测试中，纯白、纯黑背景和品牌色需要人工校正。不同市场的罐体比例有差别，背标文字也可能生成错误。一次中途更新品牌规范，让团队重新面对已经做完的版本。WPP 因而提出直接指定色值或色板的需求。","In Coca-Cola-related tests, pure black or white backgrounds and brand colours needed manual correction. Can proportions vary by market, and back-label copy could be wrong even with a reference. A mid-production brand update forced the team to revisit existing versions. WPP consequently asked to be able to specify numerical colours or palettes."],["高露洁案例里，即使白模按牙膏盒的实际尺寸制作，生成机位一变，透视还是会让盒子显得过宽或过窄。对应的审核方法也很具体：核对包装版本与文字，然后在匹配的机位上比较产品的相对尺寸。","In the Colgate example, the stand-in matched the real toothpaste carton. Changing the generated camera angle still distorted its apparent proportions. That points to two distinct review steps: check the packaging version and lettering, then compare relative size from a matching viewpoint."]],"layout":"parallel","points":[],"media":[]},{"id":"world","eyebrow":["交互探索","Interactive exploration"],"title":["如果观众可以转身，品牌还在原地吗","What happens when the viewer turns around?"],"summary":["WPP 将同一个准确性问题延伸到了可探索的品牌空间。","WPP extends the same question of accuracy to explorable branded spaces."],"paragraphs":[["团队设想过在虚拟空间中走入可口可乐售货机工厂，或进入经典广告的布景。观众可以选择方向，离开再回来。对这种形式，测试不止要看第一眼的效果，还要验证原先的位置、包装外形和空间关系是否经得起反复探索。原文把这些场景作为构想。","The team imagines entering a Coca-Cola vending-machine factory or exploring a set from a familiar campaign. A viewer might choose a route, leave and return. Evaluating such a concept means checking that positions, packaging and spatial relationships survive that revisit. The study presents these branded worlds as proposals."],["原文另引 WPP 与 Boston Dynamics、Canon 等伙伴的 Atlas 摄影机器人实验，以及 NVIDIA Cosmos 的合成环境研究。它们说明摄影设备也需要在变化的空间里保持动作可靠，属于延伸阅读，和前面的 Seedance 沙漠影片是不同项目。","The source also discusses WPP’s Atlas camera-robot experiments with partners including Boston Dynamics and Canon, and synthetic environments in NVIDIA Cosmos. These illustrate how camera equipment also needs repeatable behaviour in different spaces. They are separate projects from the Seedance desert film."]],"layout":"wide","points":[],"media":[]}],"takeaways":[{"title":["把产品核对和环境选择分开评审","Review the product and environment separately"],"body":["故事板能帮助选择氛围，真实包装版本、尺寸和机位则用于检查产品是否准确。","Boards guide atmosphere. Actual packaging versions, dimensions and camera position guide product checks."]},{"title":["原画幅要进入审核","Review in the delivery aspect ratio"],"body":["在五比一画面中确认主体占比和地平线位置，随后再判断其他裁切能否保留这些关系。","Check subject scale and horizon placement in the five-to-one frame before judging how well another crop preserves them."]}],"sources":[{"title":["深度案例｜WPP × Seedance：让产品分毫不差，让世界自由延展，品牌广告生成式制作探索【🔒 仅内部】","Original case study in Chinese"],"url":"https://bytedance.larkoffice.com/wiki/GlyvwMfAViOQEEkFWuUcjwEUnkh","type":"feishu"},{"title":["英文案例原文","Case study in English"],"url":"https://bytedance.larkoffice.com/wiki/UPJ2we2YyivNfwkbmKQch7lfnUg","type":"feishu"},{"title":["原文所引数字产品孪生视频","Digital product twin video cited in the case"],"url":"https://www.youtube.com/embed/ga9YBAyy7aQ","type":"film"},{"title":["原文所引机器人拍摄实验","Camera-robot experiment cited in the case"],"url":"https://www.youtube.com/embed/O37-ttev1SI","type":"film"}],"questions":["未列出沙漠影片最终采用了哪些候选镜头。","未给出成片生产成本、节省工时、品牌审批通过率或投放表现。"],"evidence":["六步流程、候选镜头、渲染与孪生对照来自第二节。成片附件分辨率为6720×1344。","摄像机透视、包装色值与汽车材质问题见第三节；品牌空间为第四节构想。"]},"otter":{"key":"otter","overview":["从一只怕虫的快递员出发，追踪剧本、美术、生成、场记和剪辑怎样共同完成一次送达。","Follow an insect-fearing courier from script and design through generation, continuity and editing to the delivery."],"intro":["《Otter is Nobody》是为 Seedance 2.5 发布制作的短片。导演给团队的难题，是让观众看完记住一只水獭，以及他为什么要穿过虫群。以下七个环节把长篇幕后浓缩成一条可追踪的制作线，每个环节都能回到剧本、工作图或样片里核对。","Otter is Nobody was produced for the Seedance 2.5 launch. The director wanted audiences to remember one otter and why he chose to push through a swarm. These seven stages trace that idea through the production, with the script, working images and shot tests as evidence."],"metrics":[{"value":"6","label":["剧本版本数","Script versions"],"note":["团队记录的六个剧本版本，分别承担不同创作目标。","The team documents six script versions, each addressing a different creative goal."],"source":"https://bytedance.larkoffice.com/wiki/BWxXwf8TbiJlcTkPRQXc82hpnyY"},{"value":"5","label":["镜头审查维度","Shot review criteria"],"note":["一致性、台词、穿帮、表演、大动作速度感。","Continuity, line accuracy, visible defects, performance and large-movement dynamics."],"source":"https://bytedance.larkoffice.com/wiki/BWxXwf8TbiJlcTkPRQXc82hpnyY"},{"value":"480 / 720 / 1080","label":["剪辑阶段采用的画面分辨率（P）","Editorial working resolutions (p)"],"note":["依次用于占位、替换和精修。","Used for placeholders, replacement takes and the finishing pass respectively."],"source":"https://bytedance.larkoffice.com/wiki/BWxXwf8TbiJlcTkPRQXc82hpnyY"}],"sections":[{"id":"courier","layout":"wide","eyebrow":["故事起点","The premise"],"title":["让一只怕虫的水獭，穿过虫群送快递","Send a courier who fears insects straight through a swarm"],"summary":["这支发布短片先给主角一个能看见的难题，模型能力才有了可以服务的故事。","A concrete obstacle gives the launch film a story that the model’s capabilities can serve."],"paragraphs":[["快递员要把种子送到该去的地方。观众无需听一段独白解释他缺少勇气，因为他真正害怕的虫子就挡在眼前。看到一只小水獭抱紧包裹再往前走，就能理解这次选择对他有多难。","A courier has to deliver a seed. There is no need for a speech about courage when insects, the very thing he fears, fill his route. An otter tightening his grip on the parcel before taking another step tells us what the choice costs him."],["种子有自己的情绪，与快递员渐渐成为伙伴。团队让巨大昆虫、飞鸟和城市空间围绕这段关系展开。奇观每次出现，都重新提出一个简单的问题：他能不能把这件小事办完？","The seed has feelings of its own and gradually becomes his companion. Giant insects, birds and city spaces are staged around that relationship. Each spectacle returns the viewer to a simple question. Will he finish the delivery?"]],"points":[],"media":[{"token":"UZsLb8PHholQQPxmfOpc00pvnAf","kind":"video","caption":["《Otter is Nobody》完整短片，英语对白、中英字幕。","Otter is Nobody, complete short film with English dialogue and Chinese and English subtitles."],"source":"https://bytedance.larkoffice.com/docx/OwTRdfb0Wohn7RxosEjcEJhhnZg#Ns0XdobZwo9DsVxcDatc59z9nvc"},{"token":"","source":"https://bytedance.larkoffice.com/wiki/BWxXwf8TbiJlcTkPRQXc82hpnyY","kind":"image","localPath":"assets/otter-store.jpg","caption":["成片静帧，水獭伸手抓住种子。","Film still. The otter reaches out to catch the seed."]},{"token":"ZIyIbJpjsoG15mxhcOCcwNujnVb","kind":"image","caption":["虫群里的水獭。角色体型和他害怕的东西出现在同一画面。","The otter faces an insect. The scale of the courier and the thing he fears share one frame."],"source":"https://feishu.cn/file/ZIyIbJpjsoG15mxhcOCcwNujnVb"}]},{"id":"script","layout":"split","eyebrow":["剧本","Writing"],"title":["重写六轮，把冲突写到观众看得见的地方","Six revisions made the conflict visible"],"summary":["剧本每一轮处理一件事，交付任务这条主线贯穿始终。","Each revision addressed a different problem while the delivery remained the thread through the film."],"paragraphs":[["团队从碎片灵感里选出“快递员送种子”的母题，搭出三幕结构，再增加人物选择，打磨台词、情绪和结尾。动作段落之间安排喘息的机会。虫战之后，水獭和种子的追逐变得好笑；惊险逃亡后，貘老板一句冷幽默让观众放松下来。","From scattered ideas the team chose a courier delivering a seed, built a three-act structure, then refined choices, dialogue, mood and ending. The script made room after each action beat. A chase between otter and seed becomes comic after the insect battle. The tapir boss’s dry humour releases the tension after an escape."],["写到中途，导演让豆包朗读梗概，自己只听。听到某句就能想象机位、光线和主角的表情，说明这段叙述已经能带出画面；讲不顺的地方再带回白板讨论。","Midway through writing, the director had Doubao read the synopsis aloud and listened. When a sentence suggested a camera position, light or expression, it was beginning to work as a scene. Passages that did not flow went back to the whiteboard."]],"points":[],"media":[{"token":"X1T6bNAGVo6Pvox4jblchmoOncm","kind":"image","caption":["制作团队讨论剧本时的白板草图。","The team’s whiteboard sketches from a script discussion."],"source":"https://feishu.cn/file/X1T6bNAGVo6Pvox4jblchmoOncm"}]},{"id":"design","layout":"parallel","eyebrow":["美术定稿","Art direction"],"title":["帽子、箱子和一层灰，都是连续性","A cap, a case and a layer of dirt all carry continuity"],"summary":["角色定稿要包含状态变化，也要写清它与同场角色相差多大。","Character approval covered changes of state and the relative size of other characters in a scene."],"paragraphs":[["美术先为人物、道具和场景做多轮候选，确定方向后才形成生产用参考。水獭戴不戴帽子、提不提箱、制服是否已经弄脏，都有相应的三视图。后续镜头可以直接取用正确状态，场记也有依据检查服装是否接得上。","The art team explored multiple character, prop and location options before approving production references. The otter had separate turnarounds for a cap on or off, case in hand or absent, and a clean or dirty uniform. Artists could select the right state, and continuity reviewers could check it against the previous shot."],["同框时再加一张该场的角色比例图。小水獭和昆虫的大小一旦漂移，危险感也跟着改变。定稿角色还要像演员一样试演多组台词，导演从候选里挑出合适的声音与表演气质。","A scale chart set the relationship between characters in each scene. Changing the size of the otter against an insect changed how dangerous the encounter felt. Approved characters also auditioned with different lines, allowing the director to choose a voice and performance quality."]],"points":[],"media":[{"token":"A0VabajLQoN9XMxK2pocJYfEnuf","kind":"image","caption":["角色比例参考，同框比较昆虫与水獭。","Character scale reference showing the insect alongside the otter."],"source":"https://feishu.cn/file/A0VabajLQoN9XMxK2pocJYfEnuf"}]},{"id":"iteration","layout":"steps","eyebrow":["镜头迭代","Shot iteration"],"title":["先找出镜头哪里错，再决定要改哪句话","Find the fault in the shot before changing the prompt"],"summary":["低分辨率起稿，先验证故事，再加参考锁定造型和空间。","Start at low resolution to test the story, then introduce references to lock design and space."],"paragraphs":[["团队用不带图的 480P 版本先判断动作是否讲得通。水獭虽然跑对了方向，表情却可能太凶；摄影机虽然移动，速度却机械。把这种可观察的问题记下来，下一轮才知道该修改角色表演还是摄影描述。","The team began with a text-only 480p pass to see whether the action made sense. An otter could run in the right direction with the wrong expression, or a camera could follow the action at a mechanical speed. Recording the visible fault made clear whether to revise acting or camera direction."],["当整体接近预期，再加入定版人物、场景和道具。每轮尽量只动三处以内，保留已经成立的部分。团队还精修了一条基准镜头，用它统一色调、表演和运镜；各人写下一条时都有一个共同参照。","Once the overall direction was working, approved character, location and prop references were added. The team aimed to change no more than three things per pass. A carefully finished benchmark shot established colour, performance and camera behaviour for everyone preparing the next take."]],"points":[{"title":["确认动作","Establish the action"],"body":["先看叙事动作和镜头意图，保留对的部分。","Review the narrative action and camera intent, keeping what already works."]},{"title":["约束变化","Limit the next change"],"body":["带入定版参考，每一轮只处理少量已定位的问题。","Introduce approved references and address a small, identified set of faults."]}],"media":[{"token":"EHTgbqa6WoMVIfxoepIcTsMVn4c","kind":"image","caption":["审片修改笔记，将表情、运镜和光线的问题分别记录。","Review notes separating expression, camera movement and lighting problems."],"source":"https://feishu.cn/file/EHTgbqa6WoMVIfxoepIcTsMVn4c"}]},{"id":"directions","layout":"parallel","eyebrow":["表演与动作","Acting and action"],"title":["文戏跟着种子的眼神，武戏跟着水獭的重量","Follow the seed’s gaze in dialogue and the otter’s weight in action"],"summary":["两类镜头需要导演给出不同的信息，也值得采用不同的生成时长。","The director gave these scenes different information and chose different lengths for the take."],"paragraphs":[["在水獭与种子的文戏里，团队把两者的关系写进提示，让目光和停顿传出亲近感。这类细微表演按单个镜头制作。追逐和打斗则先规划摄影机的运动、人物的重量和环境反应，用手持晃动、暂时过曝或运动模糊带出速度。","For the otter and seed’s quieter scenes, the team described the relationship so that gaze and pauses carried affection. It generated these small performances shot by shot. For chases and fights it first specified camera movement, physical weight and the environment’s response, using handheld movement, brief overexposure or motion blur to convey speed."],["适合连续动作的段落可以一次生成 15 到 30 秒，让人物状态、声音和动作顺着同一条线发展。后来制作粤语版本时，团队编辑已有的英文镜头来调整口型，让不同语言版本能共享已选中的表演。","Action passages that benefited from continuity could run for 15 to 30 seconds, carrying character state, sound and motion through the same take. For a Cantonese version, the team edited lip movement in existing English-language shots so the selected performance could serve both versions."]],"points":[],"media":[{"token":"","source":"https://bytedance.larkoffice.com/wiki/BWxXwf8TbiJlcTkPRQXc82hpnyY","kind":"video","localPath":"assets/article-media/otter/rescue-excerpt.mp4","poster":"assets/article-media/otter/rescue-poster.webp","caption":["成片节选，种子滑落，水獭随即追上去。","Film excerpt. The seed slips away and the otter follows."]},{"token":"P2FebXbtFomiavxVN1fcoQJOnah","kind":"video","caption":["文戏样片，用角色关系指导停顿与反应。","Dialogue sample, with pauses and reactions guided by the relationship."],"source":""},{"token":"KN17bYTY9oazRCxsyA1cLOGnnQh","kind":"video","caption":["武戏样片，观察追逐中的运镜与速度感。","Action sample showing camera movement and the impression of speed."],"source":""}]},{"id":"continuity","layout":"split","eyebrow":["场记与审片","Continuity and review"],"title":["水獭醒来时，箱子和制服要接得上上一场","When the otter wakes, the case and uniform have a history"],"summary":["剧本拆到每一场，再给角色、道具、声音和候选镜头指定版本。","The scene breakdown tracked versions of characters, props, voices and candidate takes."],"paragraphs":[["以“马路上的废墟”为例。水獭从昏迷中醒来，安全箱损坏，种子开始有反应。团队把此时的脏制服、受损箱子、种子的状态和角色音色放在同一场工作台本里。每类可以有多份候选，但下游镜头引用的定版只有一个。","In the road-ruins scene, the otter wakes, the case is damaged and the seed begins to respond. The scene workbook brings together the dirty costume, the damaged prop, the seed’s state and the character voices. A category can have several candidates, but downstream shots point to one approved version."],["团队用五项标准审片。先核对造型尺度、台词和明显穿帮，再比较表演是否鲜活、大动作是否有重量和速度。原始素材、定稿资产、分场台本、场记镜头表和创作日志分开保存。发现问题时能追到使用的参考，而不必从头猜。","The team reviewed five criteria. It checked continuity, line accuracy and visible defects first, then compared performance and the weight or speed of large movements. Raw material, approved assets, scene workbooks, shot logs and creative notes were filed separately. A fault could be traced to the reference used for that take."]],"points":[],"media":[{"token":"YgnIbIfgIo33DpxWdKNceEWbnSe","kind":"image","caption":["废墟场戏的分场工作台本。","Scene workbook for the road-ruins sequence."],"source":"https://feishu.cn/file/YgnIbIfgIo33DpxWdKNceEWbnSe"},{"token":"Swubb9wrHoEyi1xHVO8cBNmznxb","kind":"image","caption":["同场调用的制服、箱子和种子状态参考。","Costume, case and seed-state references for the same scene."],"source":"https://feishu.cn/file/Swubb9wrHoEyi1xHVO8cBNmznxb"}]},{"id":"cut","layout":"wide","eyebrow":["剪辑","Editorial"],"title":["先把一条粗剪放出来，再决定哪颗镜头值得精修","Build the rough cut before spending on the final shot"],"summary":["剧本一旦成立，剪辑就能用占位素材检验观众的情绪有没有接上。","As soon as the script held together, an assembly with placeholders could test whether the emotional beats connected."],"paragraphs":[["导演、美术和剪辑可以看着同一条时间线讨论：惊险过后，笑点来早了吗？种子开口前，水獭的反应要留多久？这些问题先在粗剪中解决，减少把一颗漂亮但用不上的镜头做得过于精细。","Direction, art and editorial could discuss the same timeline. Did the joke arrive too soon after the scare? How long should the otter’s reaction hold before the seed speaks? Settling those questions in the rough cut reduced the risk of polishing a beautiful shot that would disappear from the film."],["团队以 480P 素材占位，720P 版本替换到精剪，情绪和构图锁定之后，才为选中的镜头做 1080P 精修。这三个分辨率记录的是本片的制作次序。最终是否下剪刀，仍由那一刻观众跟着谁、感受到什么来决定。","The team assembled 480p placeholders, replaced them with 720p material for the fine cut, and finished selected shots at 1080p once mood and composition were locked. Those resolutions describe this production’s sequence. The final cut still came down to whose experience the audience followed at that instant."]],"points":[],"media":[{"token":"","source":"https://bytedance.larkoffice.com/wiki/BWxXwf8TbiJlcTkPRQXc82hpnyY","kind":"image","localPath":"assets/otter-lobby.jpg","caption":["成片静帧，快递员穿行时，画面转入手绘质感。","Film still. The courier moves through a passage rendered in a hand-drawn style."]},{"token":"BOrzbCjWBoC4i8xrOkLcDRhbnFd","kind":"image","caption":["成片中的水獭，从主角的这次反应回看剪辑节奏。","The otter in a finished frame, a reference for the timing of the character’s reaction."],"source":"https://feishu.cn/file/BOrzbCjWBoC4i8xrOkLcDRhbnFd"}]}],"takeaways":[{"title":["把连续性画成可核对的状态","Make continuity inspectable"],"body":["人物三视图要区分当前帽子、道具和服装状态，同场再附角色比例尺。","Give each turnaround a costume and prop state, and include a scale reference for characters sharing the scene."]},{"title":["先在时间线上检查选择","Review choices in sequence"],"body":["越早形成粗剪，越早知道缺的是表演、转场还是足够的停顿。","An early assembly reveals whether a scene needs a different performance, a transition or more time for a reaction."]}],"sources":[{"title":["深度案例｜Seedance2.5 短片《Otter is nobody》 幕后【🔒仅内部】","Full case study on Feishu"],"url":"https://bytedance.larkoffice.com/wiki/BWxXwf8TbiJlcTkPRQXc82hpnyY","type":"feishu"}],"questions":[],"evidence":["制作团队原文“剧本”“执行”“素材管理”“剪接”；用的是本项目白板、角色比例、修改记录、文武戏样片与分场素材，未收录外部作品的风格参考。"]},"publicis":{"key":"publicis","overview":["Publicis Production 以一支已经投放的梅西品牌广告为例，说明如何把 AI 放进原有制片流程。竖屏影片从社区球场走向街巷，再进入超现实的足球画面；同一个创意要能经得起拍摄、后期和跨市场改版。","Publicis Production describes its work on a released brand commercial featuring Lionel Messi. The supplied vertical film moves from a neighbourhood pitch into city streets and surreal football imagery. A single creative idea has to survive the shoot, finishing and adaptation for other markets."],"intro":["看这支片，可以先看足球在竖屏里怎么走。开头的球场把人物放在画面深处，街巷把视线引向远方，后段的足球与球员又逼近观众。未来要改时长、换字幕或换画幅，得先知道这样的空间节奏应当保留到什么程度。","Start by following the ball through the vertical frame. The pitch places the players deep in the image, a street draws the eye into the distance, and later the ball and player loom close. Before recutting the length, captions or format, an editor needs to know which parts of that spatial rhythm matter."],"metrics":[{"value":"9:16","label":["随文广告版本画幅","Supplied commercial format"],"note":["原文所附文件为 720 × 1280 像素。","The video attached to the case is 720 × 1,280 pixels."],"source":"https://bytedance.larkoffice.com/wiki/H7hfwNQJQisYAfkEbvBc4nOHnEb"},{"value":"5","label":["案例拆解的制作环节","Production stages described"],"note":["从内容方向与开拍前预演，经过资产准备、后期，到多市场版本。","From creative direction and previsualisation through asset preparation, finishing and localisation."],"source":"https://bytedance.larkoffice.com/wiki/H7hfwNQJQisYAfkEbvBc4nOHnEb"},{"value":"3","label":["团队划分的视频工作类型","Types of video work"],"note":["原创主片、已批素材复用和现场创作。","Original masters, reuse of approved material and content made on location."],"source":"https://bytedance.larkoffice.com/wiki/H7hfwNQJQisYAfkEbvBc4nOHnEb"}],"sections":[{"id":"commercial","eyebrow":["已投放作品","Released commercial"],"title":["一支足球广告如何铺开画面","How a football spot opens up the frame"],"summary":["Publicis 将梅西合作广告列为 Seedance 已进入正式制作的实例。","Publicis identifies its Messi commercial as an example of Seedance in a live production workflow."],"paragraphs":[["随文的竖屏版先给出球场，再转进街道与建筑之间，后段出现更具想象力的动物、山石与足球画面。纵深提供了一条共同的视觉线索，现实场地和夸张场面可以由它接到一起。","The attached vertical version establishes a pitch, moves into streets framed by buildings and later brings in imaginative animal, rock and football imagery. Depth offers a visual thread between the everyday locations and the heightened sequences."],["团队确认 Seedance 参与了部分内容的生成和迭代，导演、美术及后期保有创意与精修决定。原文没有公布逐镜分工，因此这里把广告作为最终剪辑来阅读；片中每一个效果的来源仍需以制作记录为准。","The team confirms that Seedance helped generate and iterate parts of the work, while direction, art and finishing remained with the production team. The study does not attribute individual shots. The spot can be read as a finished edit; production records would be needed to identify the origin of each effect."]],"layout":"wide","points":[],"media":[{"token":"YRz5bqeBeoKPAHxhD4wcjtBSnr0","kind":"video","caption":["原文附带的竖屏足球品牌广告，完整交付版","The vertical football commercial attached to the source study"],"source":""}]},{"id":"brief","eyebrow":["传播需求","The brief"],"title":["同一份创意，观众带着不同问题来看","One idea, different reasons to watch"],"summary":["Publicis 在原文中列了六类行业变化，说明广告制作为什么需要更具体的版本。","Publicis describes changes across six industries to explain why a campaign needs versions with distinct jobs."],"paragraphs":[["以汽车为例，消费者可能先在社交平台看创作者测评，再去了解某一项功能；电信用户可以借 eSIM 更快换服务商，接触广告的时机因而分散。零售媒体还会对画幅、商品信息和广告位提出各自的要求。它们对脚本的影响不同，有的需要换一个例子，有的只需换信息层。","A car buyer may first watch a creator review and then look up a feature. An eSIM customer can move between networks more readily, so the moment of engagement is less predictable. Retail media placements also impose different formats and product fields. Some briefs call for a different example in the script; others call for a change to the information layer."],["静态素材可以逐项检查商品、文案和标识。换成视频，一次局部修改会牵动人物的一致性、字幕出现的时机、声音和动作节拍。因此，制作不同版本以前，要先在主片中确定观众应该记住的人物、动作和品牌信息。","In a still, reviewers can check the product, copy and mark individually. In video, one local change can affect character continuity, subtitle timing, sound and movement. Before making variants, the master needs to establish the person, action and brand message the audience should remember."]],"layout":"wide","points":[],"media":[]},{"id":"planning","eyebrow":["制作现场","From prep to post"],"title":["先用动态分镜把决定提到开拍前","Make decisions on moving boards before the shoot"],"summary":["Publicis Production 把实拍、XR、虚拟制作、区域改编和交付接在同一条制片流程上。","Publicis Production connects live action, XR, virtual production, local adaptation and delivery."],"paragraphs":[["创意团队先从竞品、社交讨论和新趋势中判断当下该讲什么，再用动态分镜试看脚本的节奏。这一阶段形成的勘景、镜头清单和人员安排，给实际拍摄提供依据。团队也将画面拆成可复用元素，准备模板和数字孪生，给后续版本留下可编辑的材料。","The creative team studies competing campaigns, social conversations and emerging trends, then tests the script’s pace on moving boards. This informs location scouting, shot lists and staffing. The production team also prepares templates, reusable picture elements and digital twins so later versions retain editable source material."],["完成镜头时，AI 可辅助延展人群、服装、天际线或背景。导演和美术负责判断新增画面与主片是否相容，后期完成最后精修。案例方报告这次制作的成本低于全传统方案；原文没有提供金额、比例或逐项比较。","In finishing, AI can help extend crowds, wardrobe, skylines or backgrounds. Direction and art departments decide whether additions belong in the master, and post handles the final polish. The team reports lower costs than an entirely conventional approach; the source supplies neither a figure nor an itemised comparison."]],"layout":"steps","points":[],"media":[]},{"id":"versions","eyebrow":["版本设计","Version design"],"title":["主片获批，才知道哪些东西可以动","An approved master defines what may change"],"summary":["同一主片可以派生不同语言、时长、画幅与场景的版本，每类变化对应不同的审核方式。","One master can lead to new languages, lengths, formats and settings. Each type of change calls for a different review."],"paragraphs":[["Publicis 将视频工作分为三类。第一类由实拍、XR 或虚拟制作建立主片，确定品牌独有的故事。第二类从已批准的主片出发，按市场和渠道制作新版本。第三类交给现场创作者，响应拍摄当下发生的事。三者共享品牌要求，获得素材的时机和审批路径却各不相同。","Publicis distinguishes three types of work. An original master, shot live or produced with XR or virtual production, establishes the brand story. Reuse adapts approved assets for other markets and placements. On-location creators respond to something as it happens. All three follow brand standards, but differ in when footage is available and how it is approved."],["视频到视频可用来探索替换场景的效果。标识位置、字号、版式或法务文字要求精确时，团队保留 After Effects 或 Figma 模板，再逐一检查输出。翻译后的字幕能否在剪辑点前读完，也是一项交付检查。","Video-to-video generation can explore an alternate setting. Where logos, type, layouts or legal copy require precision, the team retains After Effects or Figma templates and checks each export. One practical delivery check is whether translated copy remains readable before the next cut."]],"layout":"split","points":[],"media":[{"token":"DIZxbiYe2oCeZQxZFOkc33JWnKf","kind":"image","caption":["Publicis 原图，主片、现场创作与快速复用三类工作","Publicis diagram of original masters, on-location creation and rapid reuse"],"source":"https://feishu.cn/file/DIZxbiYe2oCeZQxZFOkc33JWnKf"}]},{"id":"onsite","eyebrow":["下一项探索","Work in development"],"title":["现场创作怎样进入发布流程","How on-location work reaches publication"],"summary":["Pepsi 是 Publicis 正在探索的现场创作方向，和已投放的梅西案例应分别理解。","Publicis discusses Pepsi as an on-location exploration, separate from the released Messi commercial."],"paragraphs":[["创作者边拍边做，素材可以更快回应现场，但品牌和渠道规则仍然要在发布前落实。Publicis 希望接入 CreativeX 进行创意素材质量检查，再结合投放数据观察效果。原文将这项接入描述为在建工作，尚无已验证的上线结果。","Creators making material on location can respond to events while they unfold. Brand and channel rules still need a review before publication. Publicis describes plans to add CreativeX for creative quality checks and connect those checks to campaign data. The integration was in development at the time of the study."]],"layout":"wide","points":[],"media":[]}],"takeaways":[{"title":["把可改的部位留成独立素材","Keep variable elements editable"],"body":["模板、分层元素和产品参照能让团队改一个市场版本，同时保住已获批的主片决定。","Templates, layers and product references let a team make a local revision while preserving approved master decisions."]},{"title":["逐版本审核具体交付项","Review the actual deliverable"],"body":["语言、时长、画幅、品牌标识分别验收；最终看片还要把它们放回同一条时间线。","Check language, runtime, aspect ratio and marks individually, then review their combined effect on the timeline."]}],"sources":[{"title":["深度案例｜Publicis x Seedance：当视频 AI 走进制作现场，一支广告如何与变化中的世界对话【🔒 仅内部】","Original case study in Chinese"],"url":"https://bytedance.larkoffice.com/wiki/H7hfwNQJQisYAfkEbvBc4nOHnEb","type":"feishu"},{"title":["英文案例原文","Case study in English"],"url":"https://bytedance.larkoffice.com/wiki/K0Wbw3C2UiZ90ukTjcncvPfRn1b","type":"feishu"},{"title":["CreativeX 素材质量检查平台","CreativeX creative quality platform"],"url":"https://www.creativex.com/products/creative-quality","type":"pr"}],"questions":["梅西广告未披露逐镜工具归属、制作预算、节约工时、版本数量或投放效果。","Pepsi 现场创作探索与 CreativeX 接入尚无上线效果数据。"],"evidence":["原文第四节证实梅西广告已经投放，列出五个制作环节与三类视频工作。","9:16 按附件720×1280计算；球场、街巷与后段足球画面由原文同一附件核实。","CreativeX 接入为在建探索。"]},"candy":{"key":"candy","overview":["DiDi_OK 用四个镜头讲清一条奇幻规则，又把同样的控制方法带进车站、街头和产品广告测试。","DiDi_OK explains a fantastical rule through four shots, then tests the same controls in a station shop, on the street and in product advertising."],"intro":["在九分钟科幻短片《Candy》里，土卫十八脱离轨道，试图伤害别人的人会突然变成一地彩色硬糖。DiDi_OK 用 Seedance 2.5 生成全片画面。把四个段落连着看，会发现最值得学的控制常常很小，一只脚何时停下，焦点何时找到人，或者一颗星究竟能靠近多远。","In the nine-minute science-fiction short Candy, one of Saturn’s moons leaves its orbit, and anyone about to hurt another person bursts into coloured sweets. DiDi_OK generated the film’s imagery with Seedance 2.5. Across four sequences, some of the most telling choices are small. When does a foot stop? When does the lens find a face? How close can a moon come?"],"metrics":[{"value":"9 min","label":["短片时长","Short film runtime"],"note":["导演案例中的成片时长。","Runtime reported in the director’s case study."],"source":"https://bytedance.larkoffice.com/docx/KgJRdmq1doh8cBxhbnnca4PAnKd"},{"value":"24 s","label":["街头长镜头","Continuous street take"],"note":["一张参考图引出三人对话。","One reference image sets up a three-person exchange."],"source":"https://bytedance.larkoffice.com/docx/KgJRdmq1doh8cBxhbnnca4PAnKd"},{"value":"6 s","label":["口型测试台词时长","Lip-sync dialogue brief"],"note":["商业测试中的六秒快语速台词。","A six-second rapid line in the commercial brief."],"source":"https://bytedance.larkoffice.com/docx/KgJRdmq1doh8cBxhbnnca4PAnKd"}],"sections":[{"id":"street","layout":"split","eyebrow":["街边戏","The street scene"],"title":["一只被踢飞的铁碗，先让观众站到狗这一边","A metal bowl puts the audience on the dog’s side"],"summary":["这场戏先让人看清威胁，再用一个完全出乎意料的结果兑现影片规则。","The scene makes the threat legible before revealing the consequence that governs the film."],"paragraphs":[["老人缩在墙边，一群年轻人围上来。铁碗落地的声音和老人护住狗的动作，让观众感到这场欺凌带来的羞辱。导演为下一拍明确划了界线。脚已经抬起，狗还没有被碰到，人就在这一刻碎成彩色硬糖。","An older man is huddled by a wall when a group closes in. The clatter of the bowl and his effort to protect his dog establish the humiliation. The director placed a precise boundary around the next beat. A foot lifts, and just before it touches the dog, the group bursts into hard candy."],["散落的衣物留下了人的轮廓，糖粒在地面滚动，狗停了一下，歪头去看。几个可见的反应让喜剧有落点，也让观众明白这一世界的规则。","Collapsed clothing preserves the outline of the people who vanished. Sweets roll along the pavement. The dog hesitates and tilts its head. Those small physical reactions give the joke a landing and make the world’s rule understandable."]],"points":[],"media":[{"token":"DYpWbkYEzocaJRxTgLzccvEUndB","kind":"video","caption":["街边欺凌场景，观察铁碗、糖果和狗的连续反应。","Street scene. Follow the bowl, the sweets and the dog’s reaction."],"source":""}]},{"id":"taillight","layout":"split","eyebrow":["载具与转场","Car and transition"],"title":["从一片红光里辨出一辆车","Let a patch of red resolve into a car"],"summary":["转场、车的性格和摄影机的运动写进同一条镜头。","The transition, the car’s character and the camera movement belong to the same continuous shot."],"paragraphs":[["第一帧由参考图固定。画面先被红色发光面占满，焦点和距离拉开后，观众才认出那是跑车的尾灯。下一刻，红车从灰色家用车一侧加速穿过去。对照两辆车的节奏，就能看出司机的鲁莽。","A reference image fixes the opening frame. A luminous red patch fills the screen until the change in focus and distance reveals a taillight. The red car then accelerates alongside a grey family car. Their different rhythms convey the driver’s impatience."],["机位贴近车尾，变道时捕捉到惯性带来的抖动，周围的路面和车流有速度模糊。导演还指定引擎、轮胎和风声，让观众能从声音判断加速发生在什么时候。","The low camera stays near the rear of the car and jolts with the change of lane, while traffic and road surface streak past. Engine, tyre and wind cues let the audience hear the moment of acceleration."]],"points":[],"media":[{"token":"J0WabiDXuo6HWtxRghrcvDNYnpd","kind":"video","caption":["从红色尾灯特写进入连续跟车镜头。","The red taillight resolves into a continuous tracking shot."],"source":""}]},{"id":"orbit","layout":"wide","eyebrow":["微缩动画","Miniature animation"],"title":["怎么让一颗卫星显得不情愿","How to make a moon look reluctant"],"summary":["土卫十八的“性格”落实在它被牵引时每次停顿、回弹和挣扎的幅度里。","The moon’s reluctance comes through in the timing and distance of each pause, rebound and recoil."],"paragraphs":[["导演把太空处理成有浅景深的玩具沙盘。地球慢慢自转，小火箭沿虚线路线出发，形成稳定参照。土卫十八在它们之间乱窜，观众因此一眼能分清什么是规则，什么是在捣乱。","The director stages space as a shallow-focus toy diorama. Earth turns slowly while tiny rockets follow dotted routes. Against those regular motions, the little moon’s erratic movement reads immediately as mischief."],["当月球开始吸引它，轨迹只改变一点点。小卫星向右挪一段，停下，回弹，再往回挣扎；终点仍与月球相距很远。只写“飞向月球”会丢掉这个镜头里最有意思的抵抗。","As the Moon begins to draw it in, the trajectory changes only slightly. It edges right, stops, springs back and fights its way toward Earth again. It finishes far from the Moon. Simply asking it to fly toward the Moon would lose the resistance that gives the shot its character."]],"points":[],"media":[{"token":"TuzWbKhKUoxZoCxhRihck0gInRt","kind":"video","caption":["微缩风格的地球、月球与土卫十八运动测试。","Miniature-style Earth, Moon and Saturnian moon motion study."],"source":""}]},{"id":"police","layout":"split","eyebrow":["连续表演","Continuous performance"],"title":["24 秒街访，摄影机跟着谁在说话","Let changes of speaker guide a 24-second take"],"summary":["一张参考图负责起点，其余三个人的关系要在镜头里建立起来。","One image establishes the starting point. The relationships between the three people emerge during the take."],"paragraphs":[["开场两名警察抬头闲聊，对天上的异象早已习惯。一个男人从近景经过，快要出画时被叫住。镜头先转向他，再随着三人靠近往后退。一次没有说完的问话、一个指向天空的眼神与一声没忍住的笑，比解释世界观更有效。","Two officers look up and chat, already accustomed to the sight overhead. A man crosses the foreground and is called back just as he is about to leave frame. The camera finds him, then retreats as all three draw closer. An unfinished question, a glance skyward and a poorly suppressed laugh carry the premise without an explanation."],["自动对焦在制服纽扣、背景路人和人脸间寻找目标，才显得像有人临时举起手机在街边拍摄。原文另附的海滨步道是同片另一组画面，应单独观看。","Focus briefly catches a uniform button or a passer-by before finding a face. Those delays make the camera feel like a phone raised on the street. The seaside promenade included elsewhere in the source is a separate example from the same film."]],"points":[],"media":[{"token":"TzH6bf9PKoil70xGgi0cjtHqnyf","kind":"video","caption":["警察叫住路人的完整场景测试。","Full test of the officers stopping a passer-by."],"source":""}]},{"id":"lips","layout":"parallel","eyebrow":["商业测试 01","Commercial test 01"],"title":["乘客改口的那一瞬间，口型还跟得上吗","Can the lips keep up when the passenger changes his mind?"],"summary":["把同步放进一个会打断人物的环境，比对着镜头念一句台词更难。","A character interrupted by the world around him tests more than a direct-to-camera line."],"paragraphs":[["车站便利店里，一个背着包的男人刚跑到柜台，一边喘气一边报购物清单。虚焦的火车进站，他听到声音、回头确认、转向店员道歉。导演把这些节拍压在同一段六秒台词里，静态参考则负责固定发型、衣服和背包。","A passenger arrives at a station shop slightly breathless and rattles off a shopping list. A train enters the blurred background. He hears it, checks over his shoulder and turns back to apologise. The brief packs those beats into a six-second line, while the reference keeps hair, clothes and backpack consistent."],["验收时可以从三个时间点回看。车头何时出现，人物何时意识到自己来不及了，嘴型何时转到道歉的几个词。三者的先后决定动作是否像一个人临时改变了主意。","Three points make the clip worth replaying. When does the train appear, when does the passenger realise he has run out of time, and when do his lips turn to the apology? Their order determines whether the change of mind f
