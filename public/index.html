overall workflow and a particular tool’s contribution."]],"layout":"parallel","points":[{"title":["人物合成","Actor compositing"],"body":["以演员实拍为基础，完成与其它视觉元素的融入。","Use filmed performance as the basis for integration with other visual elements."]},{"title":["生成转场","Generated transitions"],"body":["连接 CG 平面、实拍画面与相邻广告段落。","Connect CG imagery, live-action footage and adjacent commercial sequences."]},{"title":["材质片段","Material sequences"],"body":["在局部段落中探索材质与画面的变化。","Explore changing materials and imagery within specific sequences."]}],"media":[{"token":"","kind":"image","caption":["XT5 成片将车辆、人物与广告场景组织到同一段落。","The XT5 film brings the vehicle, performers and advertising setting into one sequence."],"source":"https://bytedance.larkoffice.com/docx/Vj5zdNeYMoxyQlxafKncyoRFnfc","localPath":"rotating-src/assets/xt5.jpg"}]},{"id":"taobao-workflow","eyebrow":["5 · 纯 AI 制作","5 · AI-generated production"],"title":["先让客户选方向，再深化动态。","Choose the direction before developing the moving image."],"summary":["淘宝服饰片保留人工主绘分镜，以 AI 辅助，而非一开始就完成全部定帧。","The Taobao film keeps hand-drawn storyboards at its core, with AI support, before committing to polished frames."],"paragraphs":[["前期先制作完整穿搭和数字人物资产，再用人工主绘、AI 辅助的分镜提出多个方向。团队认为，定帧图打磨周期较长，方案一旦被退回，重新完成的成本很高，因此先让客户选方向，再继续深化。","Pre-production develops complete outfit and digital-character assets, then presents options through primarily hand-drawn, AI-assisted storyboards. The team notes that polished frames take time and are expensive to redo after a rejected proposal, so direction is agreed before further development."],["图像制作使用第三方平台的可视化画布，材料展示了 Liblib 的数百节点出图工作流；动态制作则进入 Seedance Studio，通过提示词、参考图和分场列表组织。","Still images are produced in third-party visual canvases; the source shows a Liblib workflow with hundreds of nodes. Moving images are made in Seedance Studio, organised through prompts, references and scene lists."]],"layout":"steps","points":[{"title":["先做提报资产","Prepare presentation assets"],"body":["建立人物完整穿搭，让客户先判断造型与方向。","Establish full outfits so the client can assess appearance and direction first."]},{"title":["人工主绘分镜","Keep authored storyboards"],"body":["保留导演风格与镜头意图，用多个方案推进选择。","Retain the director’s style and shot intentions while comparing options."]},{"title":["分开图像与动态","Separate stills and motion"],"body":["可视化画布组织图像资产，Seedance Studio 负责动态生成。","Use visual canvases to organise still assets and Seedance Studio for moving images."]}],"media":[]},{"id":"taobao-production-scale","eyebrow":["6 · 项目投入","6 · Production scale"],"title":["把积分、时间和修改强度分别记录。","Track credits, schedule and iteration separately."],"summary":["这些数字来自淘宝纯 AI 项目，不能混入 XT5 实拍广告的预算。","These figures belong to the Taobao AI project and are separate from the XT5 live-action advertising budget."],"paragraphs":[["淘宝片交付版本为两分二十秒，项目周期约一个月，其中脚本与设定阶段为一周多。材料记录的五万余元积分消耗，包含 Liblib 出图和 Seedance Studio 动态两部分。","The delivered Taobao film runs two minutes and twenty seconds. The project took about a month, including a little over a week for script and design. The reported credit spending of more than ¥50,000 covers both Liblib still generation and Seedance Studio moving images."],["一个约二十秒的“羊群追风”镜头，生成尝试达到三十次以上，跨平台仍在继续修改。这个具体例子说明，纯 AI 制作仍需要为筛选、调整和反复生成安排时间。","For one approximately twenty-second sheep sequence, the team made at least thirty generation attempts and continued revising across platforms. This example shows why selection, adjustment and repeated generation still require production time."],["XT5 单条广告的百万级以上预算属于另一种完整制作体量。页面将其实拍广告投入，与淘宝项目的积分消耗和周期分开呈现。","The million-yuan-plus budget reported for an individual XT5 commercial belongs to a different production scale. The page keeps that advertising budget separate from the Taobao project’s credits and schedule."]],"layout":"parallel","points":[{"title":["约 1 个月","About one month"],"body":["淘宝项目的整体周期。","Overall schedule of the Taobao project."]},{"title":["一周多","A little over one week"],"body":["淘宝片的前期脚本与设定阶段。","The Taobao film’s script and design phase."]},{"title":["≥ 30 次","At least 30 attempts"],"body":["约二十秒羊群镜头的生成尝试，属于一个具体镜头的观察。","Generation attempts for one approximately twenty-second sheep sequence."]}],"media":[]},{"id":"production-lessons","eyebrow":["7 · 可复用经验","7 · Reusable production lessons"],"title":["复杂调度，先给出空间和动作依据。","Provide spatial and movement evidence for complex staging."],"summary":["其余项目经验把三维、实拍与 AI 分配到各自更清楚的任务。","Lessons from other projects assign clearer roles to 3D, filming and AI."],"paragraphs":[["对于高调度群像，直接生成容易出现姿态跑偏和动作趋同。团队的经验是先用 UE、Blender 等三维工具制作动作骨架，再交给视频模型；需要保留客户场景结构时，也以既有三维模型锁定透视与遮挡。","In heavily staged crowd scenes, direct generation can produce incorrect poses and overly similar actions. The team’s approach is to establish movement with 3D tools such as UE and Blender before video generation. Existing client models also anchor perspective and occlusion when their geometry must be retained."],["实拍参考可以只承担动作，不要求妆造、背景和灯光一次拍齐；后续再进行换装换景。复杂调度难以用短指令说明时，则先绘制调度图或动作分解图作为视觉参考。","Filmed references may supply movement without requiring perfect costume, background and lighting at capture; those can be changed later. When short instructions cannot adequately describe staging, visual blocking diagrams and action breakdowns provide additional guidance."]],"layout":"parallel","points":[{"title":["动作先有骨架","Establish the movement skeleton"],"body":["群像动作先在三维中规划，再交给模型生成。","Plan crowd movement in 3D before asking the model to render it."]},{"title":["实拍承担明确任务","Give filming a clear role"],"body":["从动作参考中提取需要的部分，其它元素在后续完善。","Extract the needed movement from footage and finish other elements later."]},{"title":["场景保留几何底图","Keep a geometric scene base"],"body":["观众席、立柱等既有结构，用模型底图锁定透视和遮挡。","Anchor perspective and occlusion with the existing geometry of stands, columns and other structures."]}],"media":[]}],"takeaways":[{"title":["先分清制作路径","Distinguish the production approach"],"body":["实拍增强与纯生成有不同基础，数据和投入也应分别比较。","Live-action enhancement and full generation start from different foundations and need separate accounting."]},{"title":["前端判断仍然重要","Keep the front end intentional"],"body":["调研、预演和人工分镜，让团队先确认值得制作的方向。","Research, previs and authored storyboards help establish a direction worth producing."]},{"title":["把复杂问题变成明确参考","Turn complexity into clear references"],"body":["动作、几何、妆造与光线分工处理，提高后续修改的可控性。","Handle movement, geometry, styling and light as distinct tasks to make revisions controllable."]}],"sources":[{"title":["深度案例｜源然睿影：把 AI 融入实拍与纯生成两类广告制作【✅可对外】","Yuanran Ruiying: AI in Live-Action and Fully Generated Advertising — Approved for External Sharing"],"url":"https://bytedance.larkoffice.com/docx/Vj5zdNeYMoxyQlxafKncyoRFnfc","type":"feishu"}],"questions":["汇总表写两条 XT5 广告“合计 2 分 56 秒”，播放器分别显示倪妮篇 02:56、樊振东篇 02:41；未使用该合计作为时长指标。","本文记录了 Seedance Studio 承担的任务和材料占比，没有把 70%–80% 的多工具 AI 总占比归到 Seedance。","现有浏览器正文未导出每张美术资产及全部比较片段的文件 token，需由素材补齐流程继续下载。"],"evidence":["全文依据已登录浏览器读取的 /tmp/seed-xt5-source.txt 正文、项目表格与制作经验重组。","70%–80% 与 20%–30% 为 XT5 两种不同口径；淘宝 2:20、五万余元积分、约一个月与单个镜头 ≥30 次生成均保留各自范围。","完整倪妮篇 token WLzIbjXMTofWrZxrtOQcRE0in5f 来自 source-audit/master.json；两张 localPath 图片为既有真实成片素材。","原文标明可对外，但本文没有改变任何飞书权限或发布设置。"]}}</script>

            <div class="cs-brief-columns"><div><h3>${b("哪些值得留在底片里？","What should stay in the live-action plate?")}</h3><p>${b("车内的视线、窗框挡住人物的位置，以及脚掌踩在实地上的接触点，给后期留下了可对照的依据。回看修改前后的同一条镜头，就能判断新景物有没有挤进演员的空间。","The actors’ eyelines, the occlusion from a window frame and the point where a foot meets the ground give the team anchors. Comparing the same take before and after an edit shows whether the new scenery still fits the performer’s space.")}</p></div>
            <div><h3>${b("哪些需要另外设计？","What needed to be designed separately?")}</h3><p>${b("素材里有两种不同的任务。一种沿用实拍，替换窗外、调整天色或延伸远景。另一种从参考画面出发生成云海或灾害场面，再看它能否接进已有的叙事。","The material shows two kinds of work. The first starts with a filmed take and swaps a view, changes the light or extends a landscape. The second builds a cloudscape or a hazardous event from visual references and tests how it cuts into the sequence.")}</p></div></div>
          </section>
          <section id="editing" class="cs-part cs-edit">
            ${partHeading(["02 / 实拍镜头编辑","02 / Editing live action"], ["人物留在原地，环境发生改变","The same performers in a changing world"], ["从窗框看出去，再回到演员身上。下面的片段依次改变窗景、地形、天光和物件，每次都有一个可以来回对照的地方。","Look through the frame, then back at the performer. These excerpts change a view, terrain, light or a prop. Each gives the eye a fixed point to check against the edit."])}
            ${clipFigure("window","cs-feature-clip")}
            <div class="cs-paired">${clipFigure("interior")}${clipFigure("terrain")}</div>
            <div class="cs-paired">${clipFigure("fire")}${clipFigure("screen")}</div>
            ${clipFigure("wardrobe","cs-feature-clip cs-supplement")}
          </section>
          <section id="generation" class="cs-part cs-gen">
            ${partHeading(["03 / 高难度镜头","03 / Complex shots"], ["云海、岩台与雨夜","Clouds, a rocky ledge and a rainstorm"], ["日出云海取决于天气，泥石流的运动很难在现场控制。制作材料把这些镜头与实拍放在一起：远景需要交代地貌，近景则要接得上人物所站的位置和行动方向。","A sunrise above clouds depends on the weather. A debris flow is difficult to control on set. Placed beside the live action, the generated views have different jobs: wide shots establish the terrain, while closer shots have to match the performer’s position and direction of travel."])}
            ${clipFigure("clouds","cs-feature-clip")}
            <div class="cs-paired">${clipFigure("rock")}${clipFigure("debris")}</div>
          </section>
          <section id="learnings" class="cs-part cs-results">
            ${partHeading(["04 / 制作结果","04 / Production results"], ["回到整部剧的尺度","Across the production"], ["制作方在案例材料中披露了三项项目数据。页面里的九个片段用于对照具体做法，下面的数字对应整个项目。","The production team reports three figures for the project. The nine excerpts on this page illustrate individual techniques. The figures below refer to the production as a whole."])}
            <dl class="cs-numbers">${results}</dl>
            <p class="cs-result-note">${b("回看整段案例片，可以把注意力放在一次剪切上：从一张实拍的脸切到生成的云海，再切回岩台，视线、光向和远近关系能否接得住？","Watching the full reel, follow a single cut. From a live-action face to a generated cloudscape and back to the ledge, do the eyeline, direction of light and sense of distance carry over?")}</p>
            <div class="cs-end-links"><button type="button" data-player="original">${icon('play')}${t("回看完整案例片","Watch the full reel")}</button><a href="${sourceUrl}" target="_blank" rel="noopener">${t("阅读原始案例材料","Read the source material")}  ↗</a></div>
          </section>
        </article>
      </div>
      <div class="cs-back"><a href="#/cases">←  ${t("返回案例库","Back to the case library")}</a></div>
    </main>`;
  };
  window.bindCaseStory = function bindCaseStory(ctx) {
    const root = document.querySelector('.cs-story');
    if (!root) return;
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const dialog = document.getElementById('player');
    const players = [...root.querySelectorAll('.cs-loop')];
    const sections = [...root.querySelectorAll('.cs-part')];
    const links = [...root.querySelectorAll('.cs-nav a')];
    const auto = new Set();
    const manuallyPaused = new Set();
    const userStarted = new Set();
    const teardown = new AbortController();
    const options = { signal: teardown.signal };
    const label = (zh, en) => ctx.language === 'zh' ? zh : en;
    function sync(video) {
      if (!auto.has(video) || dialog?.open || document.hidden || manuallyPaused.has(video) || (motion.matches && !userStarted.has(video))) video.pause();
      else video.play().catch(() => {});
    }
    function paintButton(video) {
      const button = video.parentElement.querySelector('[data-cs-play]');
      const running = !video.paused;
      const verb = running ? label('暂停片段','Pause clip') : label('播放片段','Play clip');
      button.innerHTML = icon(running ? 'pause' : 'play');
      button.title = verb;
      button.setAttribute('aria-label', verb + ' · ' + video.getAttribute('aria-label'));
    }
    const observer = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) auto.add(entry.target);
        else auto.delete(entry.target);
        sync(entry.target);
      }
    }, {threshold:0.12}) : null;
    players.forEach(video => {
      if (observer) observer.observe(video);
      else auto.add(video);
      video.addEventListener('play', () => paintButton(video), options);
      video.addEventListener('pause', () => paintButton(video), options);
      video.parentElement.querySelector('[data-cs-play]').addEventListener('click', () => {
        if (video.paused) {
          manuallyPaused.delete(video);
          userStarted.add(video);
          video.play().catch(() => {});
        } else {
          userStarted.delete(video);
          manuallyPaused.add(video);
          video.pause();
        }
      }, options);
    });
    const onEnvironmentChange = () => players.forEach(sync);
    document.addEventListener('visibilitychange', onEnvironmentChange, options);
    const initialMotionChange = () => { userStarted.clear(); onEnvironmentChange(); };
    motion.addEventListener('change', initialMotionChange, options);
    const modal = new MutationObserver(onEnvironmentChange);
    if (dialog) modal.observe(dialog, {attributes:true,attributeFilter:['open']});
    let raf = 0;
    function updateSection() {
      raf = 0;
      const top = window.innerWidth < 800 ? 140 : 130;
      let current = sections[0];
      for (const section of sections) if (section.getBoundingClientRect().top <= top) current = section;
      links.forEach(link => {
        if (link.dataset.scroll === current.id) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
    }
    function onScroll() { if (!raf) raf = requestAnimationFrame(updateSection); }
    window.addEventListener('scroll',onScroll,{passive:true,signal:teardown.signal});
    window.addEventListener('resize',onScroll,options);
    updateSection();
    return () => { observer?.disconnect(); modal.disconnect(); teardown.abort(); cancelAnimationFrame(raf); players.forEach(v => v.pause()); };
  };
})();
</script>

<script>/* Full bilingual case articles. Original files stay on the same origin as the casebook. */
function caseArticleAsset(key, value) {
  if (typeof value !== 'string') return '';
  const p = value.replace(/^rotating-src\//, '');
  const prefix = 'assets/article-media/' + key + '/';
  const name = p.slice(p.lastIndexOf('/') + 1);
  if (!/^[A-Za-z\d_-]+(?:\.[A-Za-z\d]+)$/.test(name)) return '';
  const articleAsset = p === prefix + name;
  const namedCaseStill = p === 'assets/' + name && /\.(?:jpe?g|webp|png)$/i.test(name) &&
    (name.split('.')[0] === key || name.startsWith(key + '-'));
  return articleAsset || namedCaseStill ? 'rotating-src/' + p : '';
}

  const comparisonToken = 'SyFabzYH0oR6ZJxVCmhcZrBtnV1';

  if (!reference) return;

      '<header class="essay-section-head"><p class="essay-section-label"><span>' + index[i].number +
      '</span>' + index[i].label + '</p><h2 id="' + escape(index[i].id) + '-title">' + index[i].full + '</h2></header>' +
      '<div class="essay-section-content' + (figures.length ? ' has-media' : '') + '">' +
      '<div class="essay-prose"><p class="essay-lede">' + local(s.summary) + '</p>' + paragraphs +
      pointsMarkup(s.points, layout === 'steps') + '</div>' +
      (figures.length ? '<div class="essay-gallery" data-count="' + figures.length + '">' + figures.join('') + '</div>' : '') +
      '</div></section>';
  }).join('');
  const navItems = [...index];
  if (article.takeaways?.length) navItems.push({ id: title('notes'), label: takeawaysTitle, full: takeawaysTitle, layout: 'notes' });
  if (article.sources?.length) navItems.push({ id: title('sources'), label: sourceTitle, full: sourceTitle, layout: 'sources' });
  const navTitle = text('阅读目录', 'Contents');
  const nav = '<aside class="essay-aside"><nav class="essay-index" aria-label="' + navTitle + '">' +
    '<div class="essay-index-title">' + navTitle + '</div><div class="essay-index-list">' + navItems.map(s =>

      '" aria-controls="' + escape(s.id) + '" title="' + s.full + '"><span aria-hidden="true">' +
      (s.number || '·') + '</span>' + s.label + '</button>').join('') + '</div>' +
    '<label class="essay-mobile-index"><span>' + navTitle + '</span><select>' + navItems.map(s =>

  const metrics = article.metrics?.length ? '<dl class="essay-metrics">' + article.metrics.map(m =>
    '<div><dt>' + local(m.label) + '</dt><dd class="essay-metric-value' +

    local(m.note) + '</dd></div>').join('') + '</dl>' : '';
  const types = { feishu: text('飞书', 'Feishu'), film: text('影片', 'Film'), pr: text('延伸阅读', 'Further reading') };
  const sources = (article.sources || []).map(s => {
    const href = safeLink(s.url);
    if (!href) return '';
    return '<a class="essay-source" href="' + href + '"' + open + '><small>' + (types[s.type] || sourceTitle) +

  const overviewTitle = text('作品与项目', 'Project overview');
  return '<article class="case-essay" aria-label="' + local(item.title) + '">' +

// Keep the same chapter in view when translated copy takes a different number of lines.
function rememberCaseReading(root) {
  const probe = Math.min(innerHeight * .4, 180);
  const sections = root.querySelectorAll('[data-article-section]');
  for (const section of sections) {
    const box = section.getBoundingClientRect();
    if (box.top > probe || box.bottom <= probe) continue;
    const id = section.id;
    const ratio = (probe - box.top) / Math.max(1, box.height);
    return () => {
      const replacement = document.getElementById(id);
      if (!replacement) return undefined;
      const current = replacement.getBoundingClientRect();
      return Math.max(0, scrollY + current.top + current.height * ratio - probe);
    };
  }
  return null;
}

function bindCaseArticle(root) {
  const essay = root.querySelector('.case-essay');
  if (!essay) return () => {};
  const abort = new AbortController();
  const options = { signal: abort.signal };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const sections = Array.from(essay.querySelectorAll('[data-article-section]'));
  const controls = Array.from(essay.querySelectorAll('[data-essay-jump]'));
  const select = essay.querySelector('.essay-mobile-index select');
  const mobile = matchMedia('(max-width: 760px)');
  const navOffset = () => {
    const dock = document.querySelector('.site-header');
    const bottom = Math.max(0, dock?.getBoundingClientRect().bottom || 0);
    return Math.ceil(bottom + (mobile.matches ? 68 : 22));
  };
  function jump(id) {
    const section = sections.find(s => s.id === id);
    if (!section) return;
    const y = Math.max(0, scrollY + section.getBoundingClientRect().top - navOffset());
    if (typeof lenis !== 'undefined' && lenis) lenis.scrollTo(y, { immediate: reduced.matches, duration: .65 });
    else window.scrollTo({ top: y, behavior: reduced.matches ? 'instant' : 'smooth' });
  }
  controls.forEach(control => control.addEventListener('click', () => jump(control.dataset.essayJump), options));
  select.addEventListener('change', () => jump(select.value), options);
  let current = '';
  let pendingFrame = 0;
  function mark() {
    pendingFrame = 0;
    const line = navOffset() + Math.min(90, innerHeight * .09);
    let active = sections[0]?.id;
    for (const section of sections) {
      if (section.getBoundingClientRect().top > line) break;
      active = section.id;
    }
    if (!active || active === current) return;
    current = active;
    controls.forEach(control => {
      if (control.dataset.essayJump === active) control.setAttribute('aria-current', 'location');
      else control.removeAttribute('aria-current');
    });
    select.value = active;
  }
  const schedule = () => { if (!pendingFrame) pendingFrame = requestAnimationFrame(mark); };
  const watch = new IntersectionObserver(schedule, { rootMargin: '-12% 0px -55% 0px' });
  sections.forEach(section => watch.observe(section));
  // Position the marker against the fixed dock, including near the end of a short section.
  window.addEventListener('scroll', schedule, { passive: true, signal: abort.signal });
  window.addEventListener('resize', schedule, options);
  mark();

  const videos = Array.from(essay.querySelectorAll('video[data-article-src]'));
  const visible = new Set(), manual = new WeakSet(), pausedByPage = new WeakSet();
  function hydrate(video) {
    if (!video.hasAttribute('src')) video.src = video.dataset.articleSrc;
  }
  function pause(video) {
    if (video.paused) return;
    pausedByPage.add(video);
    video.pause();
  }
  function updateVideos() {
    for (const video of videos) {
      if (document.hidden || !visible.has(video)) pause(video);
      else if (!reduced.matches && !manual.has(video)) video.play().catch(() => {});
    }
  }
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (entry.isIntersecting && entry.intersectionRatio >= .2) {
        visible.add(entry.target);
        hydrate(entry.target);
      } else visible.delete(entry.target);
    }
    updateVideos();
  }, { threshold: [0, .2] });
  videos.forEach(video => {
    video.addEventListener('focus', () => hydrate(video), options);
    video.addEventListener('pointerdown', () => hydrate(video), options);
    video.addEventListener('pause', () => {
      if (pausedByPage.delete(video)) return;
      if (!document.hidden && visible.has(video)) manual.add(video);
    }, options);
    video.addEventListener('play', () => manual.delete(video), options);
    video.addEventListener('loadedmetadata', () => {
      if (video.videoWidth && video.videoHeight && video.videoHeight > video.videoWidth) {
        video.closest('.essay-figure').classList.add('is-portrait');
      }
      schedule();
    }, options);
    observer.observe(video);
  });
  reduced.addEventListener('change', () => {
    if (reduced.matches) videos.forEach(pause);
    else updateVideos();
  }, options);
  document.addEventListener('visibilitychange', updateVideos, options);
  return () => {
    abort.abort();
    cancelAnimationFrame(pendingFrame);
    watch.disconnect();
    observer.disconnect();
    videos.forEach(video => { video.pause(); video.removeAttribute('src'); video.load(); });
  };
}

        if(link.dataset.readingTarget==='chapter-'+activeChapter)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');
      });
      let active=null;
      for(const item of root.querySelectorAll('.reading-item'))if(item.getBoundingClientRect().top<innerHeight*.45)active=item;
      refreshFooterReveal();
      root.querySelectorAll('.reading-clip-nav a').forEach(link=>{
        if(active&&link.dataset.readingTarget===active.id)link.setAttribute('aria-current','location');
        else link.removeAttribute('aria-current');
      });
    }
    function onScroll() {
      const delta=scrollY-lastY,nextDirection=Math.sign(delta);
      if(nextDirection&&nextDirection!==direction){direction=nextDirection;anchor=scrollY;}
      document.body.classList.add('detail-header-shown');
      lastY=scrollY;
      if(!frame)frame=requestAnimationFrame(draw);
    }
    root.querySelectorAll('[data-reading-target]').forEach(link=>link.onclick=event=>{
      event.preventDefault();const target=document.getElementById(link.dataset.readingTarget);if(!target)return;
      const top=scrollY+target.getBoundingClientRect().top;
      if(typeof lenis!=='undefined'&&lenis)lenis.scrollTo(top,{duration:reducedMotion()?0:.9,offset:0});
      else window.scrollTo({top,behavior:reducedMotion()?'instant':'smooth'});
    });
    addEventListener('scroll',onScroll,{passive:true});
    addEventListener('resize',draw);
    const metadata=()=>{if(!frame)frame=requestAnimationFrame(draw);};
    screen.querySelector('video')?.addEventListener('loadedmetadata',metadata);
    const stopObserver=playVisible();
    draw();requestAnimationFrame(draw);
    cleanup=()=>{
      stopArticle();stopObserver();removeEventListener('scroll',onScroll);removeEventListener('resize',draw);
      screen.querySelector('video')?.removeEventListener('loadedmetadata',metadata);
      cancelAnimationFrame(frame);document.body.classList.remove('detail-header-shown');
    };

  }
  function render(force=false) {
    const route=location.hash || '#/';
    const refreshPosition=force?scrollY:0;
    const resumeArticle = force && root.querySelector('.case-essay') ? rememberCaseReading(root) : null;
    if(!force && lastRoute===route)return;
    if (!home.hidden && route!=='#/') homeScroll=scrollY;
    lastRoute=route;
    stopMedia();
    document.body.dataset.page=route.startsWith('#/case/')?'detail':route.startsWith('#/cases')||route.startsWith('#/capabilities')?'library':'home';
    if(!route.startsWith('#/case/'))document.querySelector('.dock-case-context').hidden=true;
    const isHome=route==='#/'||route==='#intro'||route==='#archive-stage';
    home.hidden=!isHome;root.hidden=isHome;
    document.body.classList.toggle('subpage',!isHome);
    if(!isHome) {
      document.body.classList.remove('is-gallery');
      if(route.startsWith('#/case/'))detail(decodeURIComponent(route.split('/')[2].split('?')[0]));
      else library(route.startsWith('#/capabilities'));
    }
    resetScroll(isHome ? homeScroll : (resumeArticle?.() ?? refreshPosition));
    requestAnimationFrame(() => {
      ScrollTrigger.refresh();
      if (!home.hidden) resetScroll(homeScroll);
      dispatchEvent(new Event('routechange'));
    });
    dispatchEvent(new Event('routechange'));
    if(!isHome && !force) {
      root.querySelector('h1')?.setAttribute('tabindex','-1');
      root.querySelector('h1')?.focus({preventScroll:true});
    }
  }
  addEventListener('popstate',()=>render());
  addEventListener('hashchange',()=>render());
  requestAnimationFrame(()=>render());
  return {
    openCase:key=>go('#/case/'+key,document.querySelector('.gallery__item[data-case="'+key+'"]')),
    openCases:()=>go('#/cases'),
    back:()=>go(location.hash.startsWith('#/case/')?lastLibraryRoute:location.hash.includes('industry=')||location.hash.includes('all=')?'#/cases':'#/'),
    openSkills:()=>go('#/capabilities'),
    home:()=>{homeScroll=0;go('#/');},
    refresh:()=>{if(home.hidden)render(true);},
  };
}

<script>// Visible case numbers follow the current category; dates keep their source values.
window.createArchiveTimeline = function (element, records, order, dateMap, onSelect) {
  const mobile = matchMedia('(max-width: 740px)');
  const words = {
    group: ['案例时间线', 'Case timeline'],
    updated: ['更新', 'Updated'],
    archived: ['收录', 'Added'],
    noDate: ['日期待补', 'Date unavailable'],
  };
  const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const entries = order.filter(key => records[key]).map((key, index) => {
    const date = dateMap[key] || {};
    return {
      key,
      number: String(order.length - index).padStart(2, '0'),
      date: date.updatedOn || date.archivedOn || '',
      kind: date.updatedOn ? 'updated' : date.archivedOn ? 'archived' : 'noDate',
    };
  });
  const keys = entries.map(entry => entry.key);
  const latestKey=entries[0]?.key;
  const buttons = [];
  const periodLabels = [];
  let language = null;
  let pointerId = null;
  let pointerStart = 0;
  let isDragging = false;
  let dragTarget = -1;

  function node(tag, className) {
    const item = document.createElement(tag);
    item.className = 'archive-timeline__' + className;
    return item;
  }

  element.classList.add('archive-timeline');
  element.setAttribute('role', 'group');
  const track = node('div', 'track');
  const status = node('div', 'status');
  const serial = node('span', 'serial');
  const hash = node('span', 'hash');
  hash.textContent = '#';
  const number = node('strong', 'number');
  const caption = node('div', 'caption');
  const label = document.createElement('span');
  const date = document.createElement('time');
  status.setAttribute('aria-hidden', 'true');
  caption.append(label, date);
  serial.append(hash, number);
  const newLabel=node('span','new');newLabel.textContent='NEW';newLabel.hidden=true;
  status.append(serial,newLabel, caption);
  element.replaceChildren(track, status);

  function appendPeriod(period, previous) {
    const marker = node('div', 'period');
    marker.setAttribute('aria-hidden', 'true');
    marker.dataset.period = period;
    const [year, month] = period.split('-');
    if (year && year !== previous.slice(0, 4)) {
      const yearLabel = node('span', 'year');
      yearLabel.textContent = year;
      marker.append(yearLabel);
    }
    const monthLabel = node('span', 'month');
    marker.append(monthLabel);
    periodLabels.push({element: monthLabel, marker, month: Number(month), index: buttons.length});
    track.append(marker);
  }

  let previousPeriod = null;
  entries.forEach((entry, index) => {
    const period = entry.date.slice(0, 7);
    if (period !== previousPeriod) {
      appendPeriod(period, previousPeriod || '');
      previousPeriod = period;
    }
    const button = node('button', 'dot');
    button.type = 'button';
    button.dataset.case = entry.key;
    button.dataset.number = entry.number;
    const previous=entries[index-1];
    const days=previous ? Math.abs((Date.parse(entry.date)-Date.parse(previous.date))/86400000) : 0;
    button.style.marginTop=Math.min(18, Number.isFinite(days)?days*2:0)+'px';
    button.addEventListener('click', event => {
      // Pointer taps and drags are resolved on the track; keyboard/AT clicks have detail 0.
      if (event.detail === 0) select(index, false);
    });
    button.addEventListener('keydown', event => {
      const target = {
        ArrowDown: index + 1, ArrowRight: index + 1,
        ArrowUp: index - 1, ArrowLeft: index - 1,
        Home: 0, End: entries.length - 1,
      }[event.key];
      if (target === undefined) return;
      event.preventDefault();
      event.stopPropagation();
      const next = Math.max(0, Math.min(entries.length - 1, target));
      select(next, false);
      buttons[next].focus({preventScroll: true});
    });
    buttons.push(button);
    track.append(button);
  });
  // The step measures every case and month tick, including archives with
  // different numbers of works per month.
  const slots = entries.length + periodLabels.length;
  const yearTop=node('div','year-top');
  yearTop.textContent=entries[0]?.date.slice(0,4)||'';
  element.prepend(yearTop);
  track.style.setProperty('--archive-slots', String(Math.max(1, slots)));
  element.style.setProperty('--archive-slots', String(Math.max(1, slots)));

  function localize(lang) {
    language = lang === 1 || lang === 'en' ? 1 : 0;
    element.setAttribute('aria-label', words.group[language]);
    periodLabels.forEach(({element: monthLabel, month}) => {
      monthLabel.textContent = month
        ? String(month).padStart(2,'0')
        : words.noDate[language];
    });
    entries.forEach((entry, index) => {
      const title = records[entry.key].title[language];
      const text = [entry.number && '#' + entry.number, title, words[entry.kind][language], entry.date];
      buttons[index].setAttribute('aria-label', text.filter(Boolean).join(' · '));
      buttons[index].title = title;
    });
  }
  function update(key, lang = language) {
    const index = keys.indexOf(key);
    if (index < 0) return;
    if (language === null || language !== (lang === 1 || lang === 'en' ? 1 : 0)) localize(lang);
    const entry = entries[index];
    element.dataset.case = key;
    element.dataset.number = entry.number;
    number.textContent = entry.number;
    newLabel.hidden=entry.key!==latestKey;
    element.classList.toggle('is-latest',entry.key===latestKey);
    requestAnimationFrame(()=>{
      element.style.setProperty('--active-y', (buttons[index].offsetTop + buttons[index].offsetHeight/2)+'px');
    });
    serial.hidden = !entry.number;
    label.textContent = words[entry.kind][language];
    date.textContent = entry.date.replaceAll('-', '.');
    date.hidden = !entry.date;
    if (entry.date) date.dateTime = entry.date;
    else date.removeAttribute('datetime');
    buttons.forEach((button, i) => {
      button.setAttribute('aria-current', i === index ? 'step' : 'false');
      button.tabIndex = i === index ? 0 : -1;
    });
  }
  function select(index, immediate) {
    if (!entries[index]) return;
    update(entries[index].key);
    onSelect(entries[index].key, {immediate});
  }
  function coordinate(event) {
    return mobile.matches ? event.clientX : event.clientY;
  }
  function closestIndex(event) {
    const point = coordinate(event);
    // A tap in a larger month marker's slot jumps to its first work.
    for (const period of periodLabels) {
      const rect = period.marker.getBoundingClientRect();
      const start = mobile.matches ? rect.left : rect.top;
      const end = mobile.matches ? rect.right : rect.bottom;
      if (point >= start && point < end) return period.index;
    }
    let shortest = Infinity;
    let selected = -1;
    buttons.forEach((button, index) => {
      const rect = button.getBoundingClientRect();
      const center = mobile.matches ? rect.left + rect.width / 2 : rect.top + rect.height / 2;
      const distance = Math.abs(center - point);
      if (distance < shortest) {
        shortest = distance;
        selected = index;
      }
    });
    return selected;
  }
  track.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0) return;
    pointerId = event.pointerId;
    pointerStart = coordinate(event);
    dragTarget = -1;
    isDragging = false;
    track.setPointerCapture(pointerId);
  });
  track.addEventListener('pointermove', event => {
    if (event.pointerId !== pointerId) return;
    if (!isDragging && Math.abs(coordinate(event) - pointerStart) < 4) return;
    isDragging = true;
    const index = closestIndex(event);
    if (index !== dragTarget) {
      dragTarget = index;
      select(index, true);
    }
  });
  track.addEventListener('pointerup', event => {
    if (event.pointerId !== pointerId) return;
    const index = closestIndex(event);
    if (!isDragging || index !== dragTarget) select(index, isDragging);
    track.releasePointerCapture(pointerId);
    pointerId = null;
  });
  track.addEventListener('lostpointercapture', () => {pointerId = null;});
  if (entries.length) update(entries[0].key, 0);
  return {update};
};
</script>
<script>function createOpeningReel(cases, chapters, getLanguage) {
  const video = document.getElementById('hero-reel');
  const chapterList = document.getElementById('reel-chapters');
  const credit = document.getElementById('reel-credit');
  const toggle = document.getElementById('reel-toggle');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let requested = !reduceMotion.matches;
  let visible = true;
  let lastChapter = -1;
  let lastLanguage = -1;

  const chaptersButtons = chapters.map((chapter) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.addEventListener('click', () => {
      video.currentTime = chapter.start + .025;
      render();
    });
    chapterList.append(button);
    return button;
  });

  function render() {
    const index = Math.max(0, chapters.findLastIndex(chapter => video.currentTime >= chapter.start));
    const lang = getLanguage();
    if (lastChapter !== index || lastLanguage !== lang) {
      credit.textContent = cases[chapters[index].key].title[lang];
      chaptersButtons.forEach((button, i) => {
        const title = cases[chapters[i].key].title[lang];
        button.setAttribute('aria-label', (lang ? 'Show excerpt: ' : '切换选段：') + title);
        button.setAttribute('aria-current', String(index === i));
        button.title = title;
      });
      lastChapter = index;
      lastLanguage = lang;
    }
    const start = chapters[index].start;
    const end = chapters[index + 1]?.start ?? video.duration;
    const progress = Number.isFinite(end) ? Math.max(0, Math.min(1, (video.currentTime - start) / (end - start))) : 0;
    chaptersButtons.forEach((button, i) => button.style.setProperty('--played', String(i < index ? 1 : i === index ? progress : 0)));
    const paused = video.paused;
    toggle.textContent = paused ? '▶' : 'Ⅱ';
    toggle.setAttribute('aria-label', paused ? (lang ? 'Play reel' : '播放片头') : (lang ? 'Pause reel' : '暂停片头'));
    toggle.title = toggle.getAttribute('aria-label');
  }
  function sync() {
    if (visible && requested && !document.hidden) {
      if (video.paused) video.play().catch(render);
    } else {
      video.pause();
    }
    render();
  }
  toggle.addEventListener('click', () => {
    requested = video.paused;
    sync();
  });
  reduceMotion.addEventListener('change', () => {
    requested = !reduceMotion.matches;
    video.autoplay = requested;
    sync();
  });
  video.defaultMuted = true;
  video.muted = true;
  video.autoplay = requested;
  for (const event of ['timeupdate', 'seeked', 'loadedmetadata', 'play', 'pause']) {
    video.addEventListener(event, render);
  }
  document.addEventListener('visibilitychange', sync);
  function frame() {
    render();
    video.requestVideoFrameCallback(frame);
  }
  if(video.requestVideoFrameCallback) video.requestVideoFrameCallback(frame);
  sync();
  return {
    refresh: render,
    setVisible(next) {
      if (visible === next) return;
      visible = next;
      sync();
    },
  };
}
</script>
<script>function createHomeFolderLibrary(getLanguage, openCategory) {

  };
  const categoryLabel=group=>'<svg class="category-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+categoryIcons[group.key]+'</svg><span>'+group.title[getLanguage()]+'</span>';

  const floatingButtons=groups.map(group=>{
    const button=document.createElement('button');

    button.addEventListener('click',()=>{setCategory(group.id);openCategory(group.id);});
    floating.append(button);return button;
  });
  function refresh() {
    const theme=groups.find(g=>g.id===selected);
    root.dataset.selected=theme.key;
    ['front','middle','back'].forEach((name,index)=>{
      home.style.setProperty('--folder-'+name+'-color',groups[index].color);

    home.style.setProperty('--archive-ground',theme.surface);

      document.body.style.setProperty('--gallery-theme-'+name,value);
    });
    const label=getLanguage()?'Jump to a case category':'跳转到案例分类';
    root.setAttribute('aria-label',label);tabs.setAttribute('aria-label',label);

    groups.forEach((group,index)=>{
      buttons[index].dataset.layer=String(index);
      buttons[index].innerHTML=categoryLabel(group);
      buttons[index].setAttribute('aria-pressed',String(group.id===selected));
      floatingButtons[index].innerHTML=categoryLabel(group);
      floatingButtons[index].setAttribute('aria-pressed',String(group.id===selected));
    });
  }
  function setCategory(id) {selected=id;refresh();}
  // Continuous curves retain the rounded left corner, shoulder, tab crown and foot.
  function updateContours() {
    const w=root.clientWidth,h=root.clientHeight,mobile=w<=740,u=mobile?1:w/1799;
    const bases=[64,64,64],tops=[8,8,8];
    const slots=mobile?[[.06,.14,.37],[.34,.42,.68],[.65,.70,.98]]:[[1181/1799,1225/1799,1392/1799],[1392/1799,1434/1799,1594/1799],[1596/1799,1636/1799,1790/1799]];
    ['front','middle','back'].forEach((name,i)=>{
      const base=bases[i]*u,top=tops[i]*u,[foot,start,right]=slots[i].map(n=>n*w),r=(mobile?12:16)*u;
      const tab=`C ${foot+5*u} ${base} ${foot+8*u} ${base-3*u} ${foot+14*u} ${base-12*u} L ${start-12*u} ${top+14*u} Q ${start-4*u} ${top} ${start+10*u} ${top} H ${right-r} Q ${right} ${top} ${right} ${top+r} V ${base-6*u} Q ${right} ${base} ${right+6*u} ${base}`;
      const d=`M ${foot-5*u} ${base} ${tab} Z`;
      root.querySelector('#home-folder-clip-'+name+' path').setAttribute('d',d);
      root.querySelector('.layer-'+name).style.transformOrigin=((foot+right)/2)+'px '+base+'px';
      if(name==='front'||name==='middle')root.querySelector('#home-folder-outside-'+name+' path').setAttribute('d',`M 0 0 H ${w} V ${h} H 0 Z `+d);
    });
  }
  tabs.addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    event.preventDefault();
    const current=buttons.indexOf(document.activeElement);
    const next=event.key==='Home'?0:event.key==='End'?2:(current+(event.key==='ArrowRight'?1:-1)+3)%3;
    buttons[next].focus({preventScroll:true});
  });
  new ResizeObserver(updateContours).observe(root);
  refresh();updateContours();
  return {refresh,setCategory,setGalleryVisible:visible=>{floating.inert=!visible;}};
}
</script>

  let previewTimer = 0;

  function selectGalleryCategory(industry,{resetPreview=false}={}) {
    selectedIndustry = industry;
    visibleOrder = order.filter(key => !industry || cases[key].industries.includes(industry));
    visiblePictures = visibleOrder.map(key => byKey.get(key));
    visiblePictures.forEach((picture,index)=>{
      picture.querySelector('.dossier-number').textContent='CASE '+String(visibleOrder.length-index).padStart(2,'0');
    });
    const visible = new Set(visibleOrder);
    pictures.forEach(picture => {
      const wrapper = picture.closest('.gallery__item-wrap');
      picture.hidden = !visible.has(picture.dataset.case);
      if(wrapper)wrapper.hidden = picture.hidden;
    });
    gallery.dataset.industry = String(industry);
    if(pictures.every(picture=>picture.closest('.gallery__item-wrap'))) {
      items = visiblePictures;
      wraps = visiblePictures.map(picture=>picture.closest('.gallery__item-wrap'));
      positionGalleryItems();
    }
    timeline = createArchiveTimeline(rail, cases, visibleOrder, readData('archive-dates'), navigateToCase);
    homeFolders.setCategory(industry);
    removePreview();
    displayCase(visibleOrder[0], false);
    if(lenis)lenis.resize();
    ScrollTrigger.refresh();
    queueUpdate();
    if(resetPreview)requestAnimationFrame(()=>{
      const index=document.getElementById('home-case-library');
      const previewTop=scrollY+index.getBoundingClientRect().top-innerHeight*.33;
      moveTo(Math.max(0,previewTop),reduced.matches);
    });
  }
  document.addEventListener('galleryready',()=>selectGalleryCategory(selectedIndustry));

  function viewingCenter() {
    if (!smallScreen.matches) return innerHeight / 2;
    // The timeline may still be hidden when entering from the opening reel.
    const railBottom = Math.max(162, rail.getBoundingClientRect().bottom);
    return (railBottom + Math.max(railBottom + 120, note.getBoundingClientRect().top)) / 2;
  }
  function moveTo(top, immediate = false) {
    if (lenis) lenis.scrollTo(top, {immediate, duration: immediate ? 0 : .85});
    else window.scrollTo({top, behavior: reduced.matches || immediate ? 'instant' : 'smooth'});
  }
  function navigateToCase(key, {immediate = false} = {}) {
    const target = byKey.get(key);
    if (!target) return;
    ScrollTrigger.refresh();
    const wrap = target.closest('.gallery__item-wrap') || target;
    const targetTop = scrollY + wrap.getBoundingClientRect().top + wrap.offsetHeight / 2 - viewingCenter();
    const stageTop = scrollY + document.getElementById('archive-stage').getBoundingClientRect().top;
    moveTo(smallScreen.matches ? Math.max(targetTop, stageTop - 100) : targetTop, immediate);
  }
  document.getElementById('browse-gallery').addEventListener('click', event => {
    event.preventDefault();
    enterGallery();
  });
  function enterGallery() {
    const change=()=>{
      navigateToCase(visibleOrder[0],{immediate:true});
      ScrollTrigger.update();
      updateScene();
    };
    if(document.startViewTransition && !reduced.matches) document.startViewTransition(change);
    else change();
  }
  document.getElementById('brand-home').addEventListener('click', event => {
    event.preventDefault();
    if (document.getElementById('home-view').hidden) reader.home();
    else moveTo(0);
  });

  function removePreview() {
    clearTimeout(previewTimer);
    retry.classList.remove('is-visible');
    if (preview) {
      preview.pause();
      preview.removeAttribute('src');
      preview.load();
      preview.remove();
      preview = null;
    }
    previewKey = null;
  }
  function syncPreview() {
    const ready = inGallery && !dialog.open && !document.hidden && Boolean(cases[activeKey]?.video);
    if (!ready || (reduced.matches && manualPlaybackKey !== activeKey)) {
      if (previewKey) removePreview();
      retry.classList.toggle('is-visible', ready && reduced.matches);
      return;
    }
    const next = activeKey;
    if (next === previewKey) return;
    removePreview();
    previewKey = next;
    previewTimer = setTimeout(() => {
      if(next !== activeKey || !inGallery || document.hidden)return;
      const player = document.createElement('video');
      preview = player;
      player.muted = true;
      player.defaultMuted = true;
      player.loop = true;
      player.playsInline = true;
      player.setAttribute('aria-hidden', 'true');
      player.addEventListener('loadedmetadata', () => {
        player.classList.toggle('portrait-excerpt', player.videoWidth < player.videoHeight);
      }, {once: true});
      player.addEventListener('playing', () => player.classList.add('is-playing'), {once: true});
      player.src = cases[next].video;
      (byKey.get(next).querySelector('.dossier-media')||byKey.get(next)).append(player);
      player.play().catch(() => {
        if (preview === player && inGallery && !dialog.open) retry.classList.add('is-visible');
      });
    }, 100);
  }

  retry.addEventListener('click', () => {
    manualPlaybackKey = activeKey;
    if (preview) preview.play().then(() => retry.classList.remove('is-visible')).catch(() => {});
    else syncPreview();
  });

  function stageArtwork(key, record) {
    if (!ambientLayers[litLayer].classList.contains('lit') || activeKey !== key) {
      const previous = ambientLayers[litLayer];
      litLayer = 1 - litLayer;
      const incoming = ambientLayers[litLayer];
      incoming.style.backgroundImage = byKey.get(key).style.backgroundImage;
      incoming.classList.add('lit');
      previous.classList.remove('lit');
    }
    const words = Array.from({length: 5}, (_, i) => {
      const span = document.createElement('span');
      span.textContent = i % 2 ? '/' : record.title[1];
      return span;
    });
    lettering.replaceChildren(...words);
  }
  function displayCase(key, animate) {
    const record = cases[key];
    if (activeKey !== key) manualPlaybackKey = null;
    stageArtwork(key, record);
    activeKey = key;
    note.dataset.case = key;
    pictures.forEach(picture=>{const selected=picture.dataset.case===key;picture.classList.toggle('is-current',selected);picture.setAttribute('aria-pressed',String(selected));});
    const mediaLabel = record.mediaKind?.[language] || (!record.video && record.source ? (language ? 'Still preview' : '剧照预览') : '');
    noteMeta.textContent = record.video ? '' : mediaLabel;
    noteMeta.hidden = !noteMeta.textContent;
    note.querySelector('.film-note__sharing').innerHTML=caseAudienceMarkup(record,language);
    note.querySelector('.film-note__overview').textContent=(record.overview||record.line)[language];
    noteTitle.textContent = record.title[language];
    noteSummary.textContent = record.line[language];
    noteButton.setAttribute('aria-label', (language ? 'Enter case: ' : '进入案例：') + record.title[language]);
    documentLink.hidden = !record.source;
    if(!documentLink.querySelector('svg'))documentLink.insertAdjacentHTML('afterbegin',FEISHU_MARK);
    documentLink.querySelector('span').textContent = record.video
      ? (language ? 'Feishu document' : '飞书原文档')
      : (language ? 'Watch in Feishu' : '在飞书看选段');
    if (record.source) documentLink.href = !record.video && record.watchSource ? record.watchSource : record.source;
    else documentLink.removeAttribute('href');
    documentLink.setAttribute('aria-label', record.title[language] + (language ? ' · Open Feishu document' : ' · 查看飞书原文档'));
    const prLink=note.querySelector('.film-note__pr');
    prLink.hidden=!record.pr;
    if(record.pr){prLink.href=record.pr.url;prLink.title=record.pr.title[language];}
    timeline.update(key, language);
    syncPreview();
    // The case copy is always painted. Only the surrounding artwork transitions.
    const content = note.querySelector('.film-note__text');
    content.getAnimations().forEach(animation => animation.cancel());
    content.style.removeProperty('opacity');
    content.style.removeProperty('transform');
  }
  noteButton.addEventListener('click', () => reader.openCase(activeKey));
  for (const picture of pictures) {
    picture.addEventListener('click', () => {
      const key=picture.dataset.case;
      navigateToCase(key);
      displayCase(key,false);
    });
  }
  function syncHeaderNavigation() {
    const button=document.querySelector('[data-view="cases"]');
    const inLibrary=document.body.dataset.page==='library';
    button.querySelector('span').textContent=language?(inLibrary?'Home':'Categories'):(inLibrary?'主页':'案例分类');
    button.setAttribute('aria-label',button.textContent.trim());
  }
  const views = {cases:()=>document.body.dataset.page==='library'?reader.home():reader.openCases(), skills:reader.openSkills};
  for (const control of document.querySelectorAll('[data-view]')) {
    control.addEventListener('click', views[control.dataset.view]);
  }
  for (const control of document.querySelectorAll('[data-lang]')) {
    control.addEventListener('click', () => {
      language = Number(control.dataset.lang);
      localize();
    });
  }
  function localize() {
    document.documentElement.lang = language ? 'en' : 'zh-CN';
    for (const node of document.querySelectorAll('[data-zh]')) node.textContent = language ? node.dataset.en : node.dataset.zh;
    for (const control of document.querySelectorAll('[data-lang]')) control.setAttribute('aria-pressed', String(Number(control.dataset.lang) === language));
    for (const picture of pictures) {
      const title = cases[picture.dataset.case].title[language];
      picture.setAttribute('aria-label', (language ? 'Select case: ' : '选择案例：') + title);
      picture.setAttribute('aria-pressed', String(picture.dataset.case === activeKey));
      picture.title = title;
    }
    document.getElementById('home-index').innerHTML=renderIndexFooter(language);
    bindIndexFooters(document.getElementById('home-index'));
    refreshFooterReveal();
    document.getElementById('dock-back').setAttribute('aria-label',language?'Back':'返回');
    reel.refresh();
    homeFolders.refresh();
    reader.refresh();
    displayCase(activeKey || order[0], false);
  }

  let queued = false;
  function updateScene() {
    queued = false;
    const heroBottom = intro.getBoundingClientRect().bottom;
    intro.style.setProperty('--hero-scroll-dim',String(Math.max(0,Math.min(.64,(innerHeight-heroBottom)/Math.max(1,innerHeight*.9)*.64))));
    const stageRect=document.getElementById('archive-stage').getBoundingClientRect();
    const entrance=Math.max(0,Math.min(1,(innerHeight*.8-stageRect.top)/(innerHeight*.65)));
    const stage=document.getElementById('archive-stage');
    stage.style.setProperty('--gallery-copy-opacity',reduced.matches?'1':String(Math.min(1,entrance*5)));
    stage.style.setProperty('--gallery-copy-shift',Math.max(0,stageRect.top*.5)+'px');
    const focusCenter=viewingCenter();
    visiblePictures.forEach(picture=>{
      const wrap=picture.closest('.gallery__item-wrap');
      if(!wrap)return;
      const box=wrap.getBoundingClientRect();
      const proximity=Math.max(0,1-Math.abs(box.top+box.height/2-focusCenter)/(innerHeight*.72));
      const eased=proximity*proximity*(3-2*proximity);
      const scale=smallScreen.matches?.76+.22*eased:.72+.39*eased;
      picture.style.setProperty('--card-focus-scale',reduced.matches?'1':String(scale));
    });
    const indexRect=document.getElementById('home-case-library').getBoundingClientRect();
    const indexTop=indexRect.top;
    const folderReveal=Math.max(0,Math.min(1,(innerHeight-84-indexTop)/Math.max(1,innerHeight*.45)));
    document.getElementById('home-case-library').style.setProperty('--inactive-tab-opacity',String(.48+.52*folderReveal));
    const homeVisible=!document.getElementById('home-view').hidden;
    const footerRect=document.querySelector('#home-index .brand-footer')?.getBoundingClientRect();
    document.body.classList.toggle('has-footer-nav',homeVisible&&!!footerRect&&footerRect.top<100&&footerRect.bottom>0);
    document.body.classList.toggle('has-gallery-nav',!document.getElementById('home-view').hidden&&indexTop<100&&stageRect.bottom>innerHeight*.35);
    const firstWrap=visiblePictures[0]?.closest('.gallery__item-wrap');
    const lastWrap=visiblePictures.at(-1)?.closest('.gallery__item-wrap');
    const firstRect=firstWrap?.getBoundingClientRect();
    const lastRect=lastWrap?.getBoundingClientRect();
    const galleryVisible = homeVisible && entrance>(smallScreen.matches?.45:.12) && stageRect.bottom > innerHeight*.35 && (!lastRect || lastRect.bottom > innerHeight*.25);
    if (galleryVisible !== inGallery) {
      inGallery = galleryVisible;
      document.body.classList.toggle('is-gallery', inGallery);
      note.inert = rail.inert = !inGallery;
    }
    const floatingVisible=galleryVisible&&indexRect.bottom<=0;
    document.body.classList.toggle('has-floating-categories',floatingVisible);
    document.body.classList.toggle('is-gallery-deep',galleryVisible&&heroBottom<=0);
    homeFolders.setGalleryVisible(floatingVisible);
    reel.setVisible(homeVisible && heroBottom > 1 && !dialog.open);
    if (inGallery) {
      const middle = viewingCenter();
      const nearest = visiblePictures.reduce((best, picture) => {
        const wrap = picture.closest('.gallery__item-wrap') || picture;
        const box = wrap.getBoundingClientRect();
        const gap = Math.abs(box.top + box.height / 2 - middle);
        return gap < best.gap ? {key: picture.dataset.case, gap, center: box.top + box.height / 2} : best;
      }, {key: visibleOrder[0], gap: Infinity});
      if (activeKey !== nearest.key) displayCase(nearest.key, true);
      const phase = reduced.matches ? 0 : (nearest.center - middle) / innerHeight;
      lettering.style.transform = 'translate3d(' + (phase * gallery.clientWidth * .22) + 'px, 0, 0)';
    }
    syncPreview();
  }
  function queueUpdate() {
    if (!queued) requestAnimationFrame(updateScene);
    queued = true;
  }
  let scrollEndTimer;
  window.addEventListener('scroll', () => {
    queueUpdate();
    rail.classList.add('is-scrubbing');
    clearTimeout(scrollEndTimer);
    scrollEndTimer=setTimeout(()=>rail.classList.remove('is-scrubbing'),650);
  }, {passive: true});
  window.addEventListener('routechange', () => {
    syncHeaderNavigation();
    displayCase(activeKey || order[0], false);
    queueUpdate();
  });
  let entering=false;
  window.addEventListener('wheel',event=>{
    if (document.getElementById('home-view').hidden || dialog.open || event.ctrlKey || Math.abs(event.deltaY)<5) return;
    if (!document.getElementById('home-case-library') && scrollY<8 && event.deltaY>0 && !entering) {
      event.preventDefault();entering=true;enterGallery();
      setTimeout(()=>entering=false,1000);
    }
  },{passive:false});
  document.getElementById('reel-credit').addEventListener('click',()=>{
    const chapters=readData('reel-data'),time=document.getElementById('hero-reel').currentTime;
    const index=Math.max(0,chapters.findLastIndex(chapter=>time>=chapter.start));
    reader.openCase(chapters[index].key);
  });
  window.addEventListener('resize', queueUpdate);
  document.addEventListener('visibilitychange', queueUpdate);
  reduced.addEventListener('change', queueUpdate);
  new ResizeObserver(queueUpdate).observe(gallery);
  new MutationObserver(() => {
    if (lenis) { if (dialog.open) lenis.stop(); else lenis.start(); }
    updateScene();
  }).observe(dialog, {attributes: true, attributeFilter: ['open']});
  localize();
  updateScene();
})();
</script>
</body>
